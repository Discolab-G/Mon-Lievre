    SEC('Équivalents',[
      eqMar>=0.1?R('En marathons',eqMar.toFixed(1).replace('.',',')):'',
      eqEarth>=0.01?R('% du tour de la Terre',eqEarth.toFixed(2).replace('.',',')+' %'):'',
      eqEiffel>=1?R('Tours Eiffel grimpées',Math.round(eqEiffel)):'',
      eqEverest>=1?R('% d’un Everest (cumul)',Math.round(eqEverest)+' %'):'' ]),
    SEC('Conditions',[ topTags.length?R('Tags fréquents',topTags.join(' · ')):'' ]),
    SEC('Repères',[
      R('Sorties',n), R('Temps total',fmtHMS(timeTot)), R('Distance totale',km(distTot)),
      p.age?R('Âge',p.age+' ans'):'', w?R('Poids',w+' kg'):'',
      avgHr?R('FC moyenne',avgHr+' bpm'):'', maxHr?R('FC max observée',maxHr+' bpm'):'',
      vo2Avg?R('VO₂ moyen (saisi)',vo2Avg):'',
      hrZone(0.65)?R('Zone endurance (Z2)',hrZone(0.65)):'', hrZone(0.88)?R('Zone seuil',hrZone(0.88)):'' ]),
  ].join('');

  const segBtn=(lab,val)=>`<button class="${period===val?'on':''}" data-statp="${val==null?'all':val}">${lab}</button>`;
  return `<button class="back" data-go="journal">${svg('chevronL',18)} Journal</button>
    <h1 class="hero-title">Statistiques</h1>
    <div class="seg" style="margin:6px 0 12px">${segBtn('4 sem',28)}${segBtn('8 sem',56)}${segBtn('12 mois',365)}${segBtn('Tout',null)}</div>
    ${chartCard}
    <input type="text" id="statq" placeholder="Rechercher une stat (VMA, seuil, watts, série…)" value="${esc(state._statQ||'')}" style="width:100%;margin-bottom:12px" />
    <p class="muted" style="font-size:12px;margin:-6px 0 12px">Trié du plus pointu au plus simple. Les valeurs « estimées » sont des ordres de grandeur, pas des mesures.</p>
    ${(sparse&&n>0)?`<div class="card" style="border:1px solid var(--accent)"><p style="margin:0;font-size:13px"><b>Peu de données récentes</b> (moins de 3 sorties sur 30 jours). Les valeurs <i>estimées</i> — VMA, prédictions, énergie — sont affichées en <b>fourchette ±30 %</b> tant que l'historique est mince. Les mesures réelles (distances, D+, records) restent exactes.</p></div>`:''}
    <div id="stat-list">${sections}</div><div style="height:20px"></div>`;
}
function bindStats(){
  const q=document.getElementById('statq'); if(!q) return;
  const apply=()=>{ const v=(q.value||'').trim().toLowerCase(); state._statQ=q.value;
    document.querySelectorAll('#stat-list [data-stat]').forEach(row=>{ row.style.display = (!v||row.dataset.stat.includes(v))?'':'none'; });
    document.querySelectorAll('#stat-list .stat-sec').forEach(sec=>{ const vis=[...sec.querySelectorAll('[data-stat]')].some(r=>r.style.display!=='none'); sec.style.display=vis?'':'none'; });
  };
  q.oninput=apply; if(state._statQ) apply();
  document.querySelectorAll('[data-statp]').forEach(b=>b.onclick=()=>{ const v=b.dataset.statp; state._statPeriod = v==='all'?null:parseInt(v); render(); });
  document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{ state._statMetric=b.dataset.metric; render(); });
}

/* ====================== ROUTAGE & ÉVÉNEMENTS ====================== */
const TABS=[['home',"Aujourd'hui",'home'],['programme','Programme','calendar'],['journal','Journal','journal'],['coach','Coach','chat']];
function renderTabs(){
  document.getElementById('tabbar').innerHTML=TABS.map(([r,l,ic])=>{
    const dot=(r==='coach'&&coachTabHasHint()&&state.route!=='coach')?'<span class="tab-dot"></span>':'';
    return `<button class="tab ${state.route===r?'on':''}" data-go="${r}"><span style="position:relative">${svg(ic,22)}${dot}</span>${l}</button>`;
  }).join('');
}
function render(){
  const el=document.getElementById('screen');
  const map={home:ScreenHome,onboarding:ScreenOnboarding,programme:ScreenProgramme,journal:ScreenJournal,
    journalEntry:ScreenJournalEntry,detail:ScreenDetail,record:ScreenRecord,settings:ScreenSettings,day:ScreenDay,coach:ScreenCoach,charge:ScreenCharge,planSession:ScreenPlan,intro:ScreenIntro,help:ScreenHelp,data:ScreenData,stats:ScreenStats,import:ScreenImport};
  const same=state._renderedRoute===state.route, prev=el.scrollTop;
  el.innerHTML=(map[state.route]||ScreenHome)();
  el.classList.remove('screen-enter'); void el.offsetWidth; el.classList.add('screen-enter');
  el.scrollTop = same ? prev : 0;
  // Programme : on se positionne sur la séance du jour (à venir au-dessus, historique en dessous).
  if(state._anchorToday){
    const a=el.querySelector('#prog-today');
    if(a){ const ar=a.getBoundingClientRect(), er=el.getBoundingClientRect(); el.scrollTop += (ar.top-er.top)-12; }
    state._anchorToday=false;
  }
  state._renderedRoute=state.route;
  document.getElementById('tabbar').style.display=(state.route==='onboarding'||state.route==='intro')?'none':'flex';
  renderTabs(); bind();
}
function go(route,opts={}){
  if(route==='record'){ initForm(opts.edit, opts.date); }
  if(route==='charge'){ initCharge(opts.date); if(['home','day','journal'].includes(state.route)) state._chargeBack=state.route; }
  if(route==='planSession'){ initPlan(opts.date); }
  if(route==='journalEntry'||route==='detail') state._selId=opts.id;
  if(route==='day'){ state._selDate=opts.date;
    if(['journal','programme','home'].includes(state.route)) state._dayBack=state.route; }
  if(route==='programme') state._anchorToday=true;
  if(route==='import') state._importBack=(state.route==='onboarding'||state.route==='settings')?state.route:'settings';
  if(route==='onboarding') state._onbStep='hub';
  state.route=route; save(); render();
}
function initCharge(date){ state._charge={ date:date||isoToday(), mode:'compare', presetId:null, rpe:5, durationMin:60, score:null, impact:'modere', note:'' }; }
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
    go(b.dataset.go,{id:b.dataset.id, edit:b.dataset.edit, date:b.dataset.date});
  }));
  // Bulles « ? » : on bascule le panneau d'explication en direct (pas de render → le focus et les autres champs ne bougent pas).
  document.querySelectorAll('[data-hq]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation();
    const p=document.getElementById(b.dataset.hq);
    if(p){ const show=p.hidden; p.hidden=!show; b.setAttribute('aria-expanded', show?'true':'false'); }
  });
  // Champs numériques : bornage min/max au change — le clavier ne garantit plus la plage comme les roulettes.
  // (addEventListener ici = exécuté AVANT les onchange assignés par les binders d'écran, qui lisent donc une valeur déjà bornée.)
  document.querySelectorAll('input[type=number]').forEach(i=>i.addEventListener('change',()=>{
    if(i.value==='')return; const v=parseFloat(i.value); if(!isFinite(v)){ i.value=''; return; }
    const mn=i.min!==''?parseFloat(i.min):-Infinity, mx=i.max!==''?parseFloat(i.max):Infinity;
    const c=Math.min(mx,Math.max(mn,v)); if(c!==v)i.value=c;
  }));
  document.querySelectorAll('[data-pview]').forEach(b=>b.onclick=()=>{state.settings.programView=b.dataset.pview;if(b.dataset.pview==='list')state._anchorToday=true;save();render();});
  const adapt=document.getElementById('adapt');
  if(adapt) adapt.onclick=async()=>{
    const r=await runGeneration('Mise à jour de ton programme…'); // sans clé : régénération locale
    if(!r.ok){ alert("L'adaptation a échoué :\n"+r.error); return; }
    render();
  };
  const ease=document.getElementById('ease');
  if(ease) ease.onclick=()=>softenToday();
  document.querySelectorAll('[data-objchoice]').forEach(b=>b.onclick=()=>{
    const o=state.objective, c=b.dataset.objchoice;
    if(c==='maintien'){
      o.maintain=true; o.achieved=true;
      generateProgram();                                   // plan d'entretien allégé, sans progression
      save(); render();
      return;
    }
    o.maintain=false; o.achieved=false;                    // progresser / diversifier : on relance un cycle
    if(c==='progresser'){
      const ax=primaryProgressAxis();
      if(ax.key==='time') o.timeSec=Math.round(o.timeSec*0.97);
      else if(ax.key==='dplus') o.elevationGainM=Math.round(o.elevationGainM*1.15);
      else o.distanceKm=Math.round(o.distanceKm*1.10*10)/10;
    } else if(c==='diversifier'){
      const pr=runnerProfile();
      const low=Object.entries(pr.axes).sort((a,b)=>a[1]-b[1])[0][0];
      if(low==='endurance') o.distanceKm=Math.round(o.distanceKm*1.15*10)/10;
      else if(low==='cotes'||low==='technique') o.elevationGainM=Math.max(o.elevationGainM, Math.round((o.distanceKm||10)*35));
      else if(low==='vitesse'){ const best=Math.min(...objectiveProgress().runs.map(r=>r.durationSec||Infinity)); if(isFinite(best)) o.timeSec=Math.round(best*0.95); }
      else if(low==='jambes') o.distanceKm=Math.round(o.distanceKm*1.10*10)/10;
    }
    state._onbStep='hub'; state.route='onboarding'; save(); render();             // le coureur revoit la cible bumpée puis régénère
  });
  const delsession=document.getElementById('delsession');
  if(delsession) delsession.onclick=()=>{ const id=delsession.dataset.id; if(confirm('Supprimer cette séance du programme ?')){ state.program.sessions=state.program.sessions.filter(s=>s.id!==id); state.route='programme'; save(); render(); } };
  const noterrain=document.getElementById('noterrain');
  if(noterrain) noterrain.onclick=()=>{ const id=noterrain.dataset.id; const s=state.program.sessions.find(x=>x.id===id); if(!s) return;
    const accD=accessibleDplusForRun(s.target&&s.target.distanceKm?s.target.distanceKm:8); const newD=(accD===Infinity||accD>=s.elevationGainM)?0:accD;
    if(confirm('Remplacer le dénivelé de cette séance par un équivalent accessible ? Le D+ manquant se travaille en côtes répétées (escaliers / tapis incliné) et en renfo excentrique.')){
      const lost=s.elevationGainM-newD; s.elevationGainM=newD; s.manual=true;
      s.description=(s.description?s.description+' · ':'')+`Adapté à ton terrain : ${newD} m de D+. Compense les ${lost} m manquants par des côtes répétées (escaliers ou tapis incliné) + du renfo excentrique pour préparer les descentes.`;
      save(); render();
    } };
  const fh=document.getElementById('forme-help'); if(fh) fh.onclick=()=>{ state._helpForme=!state._helpForme; render(); };
  const rh=document.getElementById('radar-help'); if(rh) rh.onclick=()=>{ state._helpRadar=!state._helpRadar; render(); };
  document.querySelectorAll('[data-calnav]').forEach(b=>b.onclick=()=>{
    const ym=state._calYM||ymNow(); let y=ym.y, m=ym.m+(b.dataset.calnav==='next'?1:-1);
    if(m<0){m=11;y--;} else if(m>11){m=0;y++;}
    state._calYM={y,m}; render();
  });
  if(state.route==='onboarding') bindOnboarding();
  if(state.route==='settings') bindSettings();
  if(state.route==='record') bindRecord();
  if(state.route==='charge') bindCharge();
  if(state.route==='planSession') bindPlan();
  if(state.route==='journalEntry') bindJournalEntry();
  if(state.route==='coach') bindCoach();
  if(state.route==='stats') bindStats();
  if(state.route==='import') bindImport();
}

function bindCoach(){
  // Animation de réveil : auto-dismiss puis on bascule vers l'état réveillé.
  if(state._wake){ setTimeout(()=>{ state._wake=false; save(); render(); }, 2600); return; }
  const st=coachState();
  const ta=document.getElementById('cq');
  if(ta){
    ta.oninput=()=>{ state._coachDraft=ta.value; ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px'; };
    ta.style.height='auto'; ta.style.height=Math.min(120,ta.scrollHeight)+'px';
  }
  // Liste des conversations (partagée : modes local ET ai, donc gérable sans clé API)
  if((st==='local'||st==='ai') && state._coachList){
    const back=document.getElementById('convback'); if(back) back.onclick=()=>{ state._coachList=false; render(); };
    const nw=document.getElementById('convnewl'); if(nw) nw.onclick=()=>{ newConversation(); save(); render(); };
    document.querySelectorAll('[data-conv]').forEach(b=>b.onclick=()=>{ state.coach.activeId=b.dataset.conv; state._coachList=false; save(); render(); });
    document.querySelectorAll('[data-convdel]').forEach(b=>b.onclick=()=>{ const id=b.dataset.convdel; if(confirm('Supprimer cette conversation ?')){ deleteConversation(id); save(); render(); } });
    return;
  }
  if(st==='asleep'){
    // Coach endormi : réponses locales somnolentes, comptées pour les déclencheurs.
    const poke=()=>{ const q=(state._coachDraft||'').trim(); if(!q) return;
      const log=state.coach.sleepyLog=state.coach.sleepyLog||[];
      log.push({role:'user',content:q});
      const reply=sleepyReply();
      log.push({role:'assistant',content:reply});
      if(state.coach.sleepyLog.length>20) state.coach.sleepyLog=state.coach.sleepyLog.slice(-20);
      state._coachDraft=''; checkCoachTriggers(); save(); render();
    };
    if(ta) ta.onkeydown=(ev)=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); poke(); } };
    const send=document.getElementById('csend'); if(send) send.onclick=poke;
    const el=document.getElementById('screen'); if(el) el.scrollTop=el.scrollHeight;
    return;
  }
  if(st==='local'){
    // Réveillé sans clé : chat local (base de connaissances), conversations gérables.
    const doAsk=()=>{ const q=(state._coachDraft||'').trim(); if(!q) return; sendCoachLocal(q); };
    if(ta) ta.onkeydown=(ev)=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); doAsk(); } };
    const send=document.getElementById('csend'); if(send) send.onclick=doAsk;
    const list=document.getElementById('convlist'); if(list) list.onclick=()=>{ state._coachList=true; render(); };
    const nw=document.getElementById('convnew'); if(nw) nw.onclick=()=>{ newConversation(); save(); render(); };
    document.querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{ sendCoachLocal(b.dataset.cq); });
    const chat=document.getElementById('chat'); if(chat){ const el=document.getElementById('screen'); if(el) el.scrollTop=el.scrollHeight; }
    return;
  }
  if(st==='ai'){
    const doAsk=()=>{ const q=(state._coachDraft||'').trim(); if(!q||state._coachLoading) return; askCoach(q); };
    if(ta) ta.onkeydown=(ev)=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); doAsk(); } };
    const send=document.getElementById('csend'); if(send) send.onclick=doAsk;
    const list=document.getElementById('convlist'); if(list) list.onclick=()=>{ state._coachList=true; render(); };
    const nw=document.getElementById('convnew'); if(nw) nw.onclick=()=>{ newConversation(); save(); render(); };
    const info=document.getElementById('cinfo'); if(info) info.onclick=()=>{ state._coachInfo=!state._coachInfo; render(); };
    const ic=document.getElementById('cinfoclose'); if(ic) ic.onclick=()=>{ state._coachInfo=false; render(); };
    document.querySelectorAll('[data-cq]').forEach(b=>b.onclick=()=>{ state._coachDraft=b.dataset.cq; askCoach(b.dataset.cq); });
    const chat=document.getElementById('chat'); if(chat){ const el=document.getElementById('screen'); el.scrollTop=el.scrollHeight; }
  }
}

function bindOnboarding(){
  const o=state.objective,p=state.profile,c=o.constraints,re=()=>{save();render();};
  // Hub : ouvrir une catégorie / revenir au hub (l'import passe par [data-go]).
  document.querySelectorAll('[data-onbgo]').forEach(b=>b.onclick=()=>{ state._onbStep=b.dataset.onbgo; save(); render(); });
  document.querySelectorAll('[data-onbhub]').forEach(b=>b.onclick=()=>{ state._onbStep='hub'; save(); render(); });
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{o.mode=b.dataset.mode;re();});
  document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>{o.distanceKm=parseFloat(b.dataset.dist);re();});
  document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{o.focus=b.dataset.focus;re();});
  document.querySelectorAll('[data-dplus]').forEach(b=>b.onclick=()=>{o.elevationGainM=parseInt(b.dataset.dplus);re();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const k=b.dataset.day,i=p.days.indexOf(k);
    if(i>=0)p.days.splice(i,1);else p.days.push(k); p.days.sort((a,b)=>DAY_KEYS.indexOf(a)-DAY_KEYS.indexOf(b));
    if(p.longRunDay&&!p.days.includes(p.longRunDay))p.longRunDay=null; re();});
  bindSlider('dist',v=>{ const h=Math.floor(o.distanceKm/100); o.distanceKm=Math.max(1, h*100+parseFloat(v)); return String(o.distanceKm).replace('.',',')+' km'; });
  bindSlider('dplus',v=>{ const k=Math.floor(o.elevationGainM/1000); o.elevationGainM=k*1000+parseInt(v); return o.elevationGainM+' m'; });
  bindSlider('diff',v=>{o.difficulty=parseInt(v);document.getElementById('diff-out').innerHTML='<b>'+DIFF[o.difficulty-1]+'</b>';return null;});
  bindSlider('vol',v=>{p.weeklyVolumeKm=parseInt(v);return p.weeklyVolumeKm+' km';});
  const e=id=>document.getElementById(id);
  if(e('odate'))e('odate').onchange=()=>{o.date=e('odate').value;save();};
  document.querySelectorAll('[data-longday]').forEach(b=>b.onclick=()=>{p.longRunDay=b.dataset.longday||null;re();});
  ['th','tm','ts'].forEach(id=>{if(e(id))e(id).onchange=()=>{const days=Math.floor((o.timeSec||0)/86400);o.timeSec=days*86400+(+e('th').value)*3600+(+e('tm').value)*60+(+e('ts').value);save();};});
  if(e('volauto'))e('volauto').onclick=()=>{p.weeklyVolumeKm=p.weeklyVolumeKm===null?25:null;re();};
  if(e('daysauto'))e('daysauto').onclick=()=>{p.days=p.days.length?[]:['mon','wed','sat'];if(!p.days.length)p.longRunDay=null;re();};
  if(e('refskip'))e('refskip').onclick=()=>{if(p.refTimeSec===null){p.refDistanceKm=5;p.refTimeSec=1500;}else{p.refDistanceKm=null;p.refTimeSec=null;}re();};
  document.querySelectorAll('[data-refd]').forEach(b=>b.onclick=()=>{p.refDistanceKm=parseFloat(b.dataset.refd);re();});
  ['rh','rm','rs'].forEach(id=>{if(e(id))e(id).onchange=()=>{p.refTimeSec=(+e('rh').value)*3600+(+e('rm').value)*60+(+e('rs').value);save();};});
  if(e('epskip'))e('epskip').onclick=()=>{ p.easyPaceSec = p.easyPaceSec===null ? 330 : null; re(); };
  ['epm','eps'].forEach(id=>{ if(e(id))e(id).onchange=()=>{ p.easyPaceSec=(+e('epm').value)*60+(+e('eps').value); const o=e('ep-out'); if(o)o.textContent=fmtPace(p.easyPaceSec/60); save(); }; });
  // --- Alloué course / semaine (contraintes) ---
  if(e('cthtog'))e('cthtog').onclick=()=>{ c.weeklyHours=c.weeklyHours==null?5:null; re(); };
  bindSlider('cth',v=>{ c.weeklyHours=parseFloat(v); return c.weeklyHours+' h'; });
  if(e('ckmtog'))e('ckmtog').onclick=()=>{ c.weeklyKmCap=c.weeklyKmCap==null?50:null; re(); };
  bindSlider('ckm',v=>{ c.weeklyKmCap=parseInt(v); return c.weeklyKmCap+' km'; });
  if(e('cdurtog'))e('cdurtog').onclick=()=>{ c.maxSessionMin=c.maxSessionMin==null?90:null; re(); };
  bindSlider('cdur',v=>{ c.maxSessionMin=parseInt(v); return c.maxSessionMin+' min'; });
  document.querySelectorAll('[data-smode]').forEach(b=>b.onclick=()=>{ c.sessionsMode=b.dataset.smode; if(c.sessionsMode==='plafond'&&c.sessionsMax==null)c.sessionsMax=4; re(); });
  bindSlider('csess',v=>{ c.sessionsMax=parseInt(v); return c.sessionsMax+' / sem'; });
  // --- pas infinis : distance (×100), D+ (×1000), durée (×1 jour) ---
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ const [k,amt]=b.dataset.step.split(':'); const n=parseFloat(amt);
    if(k==='dist') o.distanceKm=Math.max(1, Math.round((o.distanceKm+n)*10)/10);
    else if(k==='dplus') o.elevationGainM=Math.max(0, o.elevationGainM+n);
    else if(k==='time') o.timeSec=Math.max(0,(o.timeSec||0)+n)||null;
    re(); });
  // --- dénivelé accessible (D+/km) ---
  if(e('dpkmtog'))e('dpkmtog').onclick=()=>{ p.dplusMaxPerKm = p.dplusMaxPerKm==null?50:null; re(); };
  bindSlider('dpkm', v=>{ p.dplusMaxPerKm=parseInt(v); return p.dplusMaxPerKm+' m/km'; });
  document.querySelectorAll('[data-rhythm]').forEach(b=>b.onclick=()=>{ o.rhythm=b.dataset.rhythm; re(); });
  // --- VMA ---
  if(e('vmatog'))e('vmatog').onclick=()=>{ p.vmaKmh=p.vmaKmh==null?14:null; re(); };
  bindSlider('vma',v=>{ p.vmaKmh=parseFloat(v); return p.vmaKmh+' km/h'; });
  // --- tolérance hors-course ---
  if(e('crosstog'))e('crosstog').onclick=()=>{ p.crossTrainHours=p.crossTrainHours==null?3:null; re(); };
  bindSlider('cross',v=>{ p.crossTrainHours=parseFloat(v); return p.crossTrainHours+' h'; });
  // --- profil physiologique ---
  if(e('hrrtog'))e('hrrtog').onclick=()=>{ p.hrRest=p.hrRest==null?55:null; re(); };
  bindSlider('hrr',v=>{ p.hrRest=parseInt(v); return p.hrRest+' bpm'; });
  if(e('hrmtog'))e('hrmtog').onclick=()=>{ p.hrMax=p.hrMax==null?(p.age?Math.round(211-0.64*p.age):185):null; re(); };
  bindSlider('hrm',v=>{ p.hrMax=parseInt(v); return p.hrMax+' bpm'; });
  if(e('wttog'))e('wttog').onclick=()=>{ p.weightKg=p.weightKg==null?70:null; re(); };
  bindSlider('wt',v=>{ p.weightKg=parseInt(v); return p.weightKg+' kg'; });
  if(e('httog'))e('httog').onclick=()=>{ p.heightCm=p.heightCm==null?175:null; re(); };
  bindSlider('ht',v=>{ p.heightCm=parseInt(v); return p.heightCm+' cm'; });
  if(e('agetog'))e('agetog').onclick=()=>{ p.age=p.age==null?35:null; re(); };
  bindSlider('age',v=>{ p.age=parseInt(v); return p.age+' ans'; });
  if(e('gen'))e('gen').onclick=async()=>{
    state.objective.maintain=false; state.objective.achieved=false; // nouveau cycle actif vers une cible
    state.onboarded=true; save();
    const r=await runGeneration('Préparation de ton programme…');
    if(!r.ok){ alert('La génération a rencontré un souci :\n'+r.error+'\n\nUn programme a tout de même été créé.'); generateProgram(); }
    checkObjectiveAmbition(); // P4 : le Lièvre réagit à un objectif ambitieux
    state.route='home'; save(); render();
  };
}
function bindSlider(id,fn){
  const el=document.getElementById(id); if(!el)return;
  el.oninput=()=>{const out=fn(el.value); if(out!==null){const o=document.getElementById(id+'-out'); if(o)o.textContent=out;} save();};
}

function bindImport(){
  const e=id=>document.getElementById(id);
  const inp=e('impinput'), add=e('impadd');
  if(add&&inp){ add.onclick=()=>inp.click();
    inp.onchange=()=>{ if(inp.files&&inp.files.length){ importFiles.push(...Array.from(inp.files)); inp.value=''; render(); } };
  }
  document.querySelectorAll('.imp-del').forEach(b=>b.onclick=()=>{ importFiles.splice(parseInt(b.dataset.idx),1); render(); });
  if(e('impclear'))e('impclear').onclick=()=>{ importFiles=[]; render(); };
  if(e('impsend'))e('impsend').onclick=async()=>{
    if(!importFiles.length||state._bulkBusy) return;
    state._bulkBusy=true; render();
    let res;
    try{ res=await importBulk(importFiles); }
    catch(err){ state._bulkBusy=false; render(); alert(err&&err.message?err.message:'Import impossible.'); return; }
    state._bulkBusy=false; importFiles=[];
    const msg='Import terminé.\n\n• '+res.added+' activité(s) ajoutée(s)'
      +(res.dup?'\n• '+res.dup+' doublon(s) ignoré(s)':'')
      +(res.fit?'\n• '+res.fit+' fichier(s) .fit illisibles':'')
      +(res.err?'\n• '+res.err+' fichier(s) illisibles':'')
      +(res.skipped?'\n• '+res.skipped+' fichier(s) ignorés':'');
    state._selId=null; state.route='journal'; save(); render(); alert(msg);
  };
}
function bindSettings(){
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{state.settings.theme=b.dataset.themeSet;applyTheme();save();render();});
  document.querySelectorAll('[data-rhythm]').forEach(b=>b.onclick=()=>{state.objective.rhythm=b.dataset.rhythm;save();render();});
  const key=document.getElementById('apikey');
  if(key)key.onchange=()=>{if(key.value&&!key.value.startsWith('••')){state.settings.apiKey=key.value;save();}};
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{state.settings.model=b.dataset.model;save();render();});
  const webtog=document.getElementById('webtog');
  if(webtog)webtog.onclick=()=>{state.settings.webSearch=!state.settings.webSearch;save();render();};
  const delkey=document.getElementById('delkey');
  if(delkey)delkey.onclick=()=>{ if(confirm('Supprimer la clé API ? Le coach repasse en mode local gratuit ; tes autres données sont conservées.')){ state.settings.apiKey=''; save(); render(); } };
  const today=isoToday();
  const delfuture=document.getElementById('delfuture');
  if(delfuture)delfuture.onclick=()=>{ const n=state.program.sessions.filter(s=>s.date>=today).length; if(!n){alert('Aucune séance à venir.');return;} if(confirm(`Effacer les ${n} séance(s) à venir du programme ?`)){ state.program.sessions=state.program.sessions.filter(s=>s.date<today); save(); render(); } };
  const delpast=document.getElementById('delpast');
  if(delpast)delpast.onclick=()=>{ const n=state.program.sessions.filter(s=>s.date<today).length; if(!n){alert('Aucune séance passée.');return;} if(confirm(`Effacer les ${n} séance(s) passée(s) du programme ?`)){ state.program.sessions=state.program.sessions.filter(s=>s.date>=today); save(); render(); } };
  const reset=document.getElementById('reset');
  if(reset)reset.onclick=()=>{if(confirm('Effacer toutes les données locales ?')){const th=state.settings.theme;state=structuredClone(DEFAULT_STATE);state.settings.theme=th;state.route='intro';save();render();}};
}

function bindJournalEntry(){
  const del=document.getElementById('del');
  if(del)del.onclick=()=>{if(confirm('Supprimer cette séance du journal ?')){state.journal=state.journal.filter(r=>r.id!==state._selId);state.route='journal';adaptHorizon();save();render();}};
}

function initForm(editId,date){
  if(editId){ const r=state.journal.find(x=>x.id===editId); state._form=Object.assign({paceEdited:true},r); if(!Array.isArray(state._form.tags)) state._form.tags=[]; if(!Array.isArray(state._form.segments)) state._form.segments=[]; state._form._segOpen=state._form.segments.length>0; if(state._form.sport==null) state._form.sport='course'; if(state._form.cadence==null) state._form.cadence=state._form.cadenceSpm||null; state._form._imported=!isRunSport(state._form.sport); state._editId=editId; }
  else{
    const d=date||isoToday(), s=sessionForDate(d);
    const dist=s&&s.target.distanceKm?s.target.distanceKm:8;
    state._form={ date:d, type:s?s.type:'easy', distanceKm:dist, durationSec:Math.round(dist*6*60),
      paceEdited:false, paceMinPerKm:6, elevationGainM:s?(s.elevationGainM||0):0, difficulty:s?(s.difficulty||1):(state.objective.difficulty||1),
      avgHr:null, vo2:null, feeling:null, notes:'', paceRecovery:null, paceFast:null, tags:[], segments:[], _segOpen:false,
      sport:'course', cadence:null, _imported:false };
    state._editId=null;
  }
}
function bindRecord(){
  const f=state._form, e=id=>document.getElementById(id), re=()=>{save();render();};
  if(e('fdate'))e('fdate').onchange=()=>{f.date=e('fdate').value;save();};
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{f.type=b.dataset.type;re();});
  document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{const v=+b.dataset.feel;f.feeling=(f.feeling===v)?null:v;re();});
  document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const id=b.dataset.tag;const i=f.tags.indexOf(id);if(i>=0)f.tags.splice(i,1);else f.tags.push(id);re();});
  // --- sport d'une activité importée ---
  document.querySelectorAll('[data-sportk]').forEach(b=>b.onclick=()=>{ f.sport=b.dataset.sportk; re(); });
  // --- import d'un fichier .gpx / .tcx (export téléchargé, 100% local) ---
  const fimp=e('fimport'), importbtn=e('importbtn');
  if(importbtn&&fimp){ importbtn.onclick=()=>fimp.click();
    fimp.onchange=()=>{ const file=fimp.files&&fimp.files[0]; if(!file) return;
      const nm=(file.name||'').toLowerCase();
      (async()=>{
        let p=null;
        try{
          if(/\.fit(\.gz)?$/.test(nm)){
            let fb=new Uint8Array(await file.arrayBuffer());
            if(nm.endsWith('.gz')){ if(!hasDecompression()){ alert('Ton navigateur ne gère pas la décompression .gz. Décompresse le fichier d\u2019abord.'); fimp.value=''; return; } fb=await decompressBytes(fb,'gzip'); }
            p=parseFitFile(fb.buffer.slice(fb.byteOffset, fb.byteOffset+fb.byteLength));
          } else {
            p=parseActivityFile(await file.text());
          }
        }catch(e){ p=null; }
        if(!p){ alert('Fichier non reconnu. Formats acceptés : .gpx, .tcx et .fit (montres).'); fimp.value=''; return; }
        const dup=state.journal.find(r=>r.date===p.date && Math.abs((r.distanceKm||0)-p.distanceKm)<0.3 && Math.abs((r.durationSec||0)-p.durationSec)<120);
        if(dup && !confirm('Une séance très proche existe déjà au '+p.date+'. Importer quand même ?')){ fimp.value=''; return; }
        Object.assign(f,{ date:p.date, distanceKm:p.distanceKm, durationSec:p.durationSec, paceMinPerKm:p.paceMinPerKm, paceEdited:false,
          elevationGainM:p.elevationGainM, avgHr:p.avgHr, cadence:p.cadence, sport:p.sport, _imported:true });
        if(isRunSport(p.sport) && !['easy','long','tempo','intervals','cotes'].includes(f.type)) f.type='easy';
        fimp.value=''; save(); render();
      })();
    };
  }
  // --- cadence ---
  if(e('cadtog'))e('cadtog').onclick=()=>{ f.cadence=f.cadence==null?170:null; re(); };
  bindSliderF('fcad',v=>{f.cadence=parseInt(v);return f.cadence;});
  // --- segments / répétitions (tâche 4) ---
  if(!Array.isArray(f.segments)) f.segments=[];
  const segtog=e('segtog'); if(segtog)segtog.onclick=()=>{ f._segOpen=!f._segOpen; re(); };
  const segadd=e('segadd'); if(segadd)segadd.onclick=()=>{ f.segments.push({distanceKm:null,elevationGainM:0,durationSec:null,paceMinPerKm:null}); f._segOpen=true; re(); };
  document.querySelectorAll('.seg-del').forEach(b=>b.onclick=()=>{ f.segments.splice(parseInt(b.dataset.si),1); re(); });
  const deriveRow=(i)=>{
    const gi=sf=>document.querySelector(`.seg-in[data-sf="${sf}"][data-si="${i}"]`);
    const dI=gi('dist'), dpI=gi('dplus'), tI=gi('temps'), pI=gi('allure');
    let dist = dI&&dI.value.trim()!=='' ? parseFloat(dI.value.replace(',','.')) : null; if(dist!=null&&isNaN(dist)) dist=null;
    let dplus= dpI&&dpI.value.trim()!=='' ? parseInt(dpI.value) : null; if(dplus!=null&&isNaN(dplus)) dplus=null;
    let durSec = tI ? parseMS(tI.value) : null;
    let pace = pI&&pI.value.trim()!=='' ? parsePaceStr(pI.value) : null;
    // dérivation : compléter la 3ᵉ info parmi distance/temps/allure dès que 2 sont connues
    if(durSec==null && dist!=null && pace!=null){ durSec=Math.round(pace*dist*60); if(tI&&tI.value.trim()==='') tI.value=fmtMS(durSec); }
    else if(dist==null && durSec!=null && pace!=null){ dist=Math.round(((durSec/60)/pace)*1000)/1000; if(dI&&dI.value.trim()==='') dI.value=String(dist).replace('.',','); }
    else if(pace==null && dist!=null && durSec!=null && dist>0){ pace=(durSec/60)/dist; if(pI&&pI.value.trim()==='') pI.value=fmtPace(pace); }
    f.segments[i]={ distanceKm:dist, elevationGainM:dplus!=null?dplus:0, durationSec:durSec, paceMinPerKm:pace };
    save();
  };
  document.querySelectorAll('.seg-in').forEach(inp=>inp.oninput=()=>deriveRow(parseInt(inp.dataset.si)));
  const updPace=()=>{ if(!f.paceEdited){ const p=f.durationSec>0&&f.distanceKm>0?(f.durationSec/60)/f.distanceKm:0; f.paceMinPerKm=p; const o=e('fpace-out'); if(o)o.textContent=(p?fmtPace(p):'—')+' /km'; } };
  if(e('fdist'))e('fdist').oninput=()=>{f.distanceKm=parseFloat(e('fdist').value);e('fdist-out').textContent=f.distanceKm.toFixed(1).replace('.',',')+' km';updPace();save();};
  ['fdh','fdm','fds'].forEach(id=>{if(e(id))e(id).onchange=()=>{f.durationSec=(+e('fdh').value)*3600+(+e('fdm').value)*60+(+e('fds').value);updPace();save();};});
  if(e('paceadj'))e('paceadj').onclick=()=>{f.paceEdited=!f.paceEdited; if(!f.paceEdited){const p=f.durationSec>0&&f.distanceKm>0?(f.durationSec/60)/f.distanceKm:6;f.paceMinPerKm=p;} re();};
  ['fpm','fps'].forEach(id=>{if(e(id))e(id).onchange=()=>{f.paceMinPerKm=(+e('fpm').value)+(+e('fps').value)/60;e('fpace-out').textContent=fmtPace(f.paceMinPerKm)+' /km';save();};});
  bindSliderF('fdplus',v=>{f.elevationGainM=parseInt(v);return f.elevationGainM+' m';});
  if(e('fdiff'))e('fdiff').oninput=()=>{f.difficulty=parseInt(e('fdiff').value);e('fdiff-out').innerHTML='Difficulté : <b>'+DIFF[f.difficulty-1]+'</b>';save();};
  if(e('hrtog'))e('hrtog').onclick=()=>{f.avgHr=f.avgHr===null?150:null;re();};
  bindSliderF('fhr',v=>{f.avgHr=parseInt(v);return f.avgHr;});
  if(e('vo2tog'))e('vo2tog').onclick=()=>{f.vo2=f.vo2===null?50:null;re();};
  bindSliderF('fvo2',v=>{f.vo2=parseInt(v);return f.vo2;});
  ['frcm','frcs'].forEach(()=>{}); 
  if(e('frcm'))['frcm','frcs'].forEach(id=>e(id).onchange=()=>{f.paceRecovery=(+e('frcm').value)+(+e('frcs').value)/60;save();});
  if(e('ffam'))['ffam','ffas'].forEach(id=>e(id).onchange=()=>{f.paceFast=(+e('ffam').value)+(+e('ffas').value)/60;save();});
  if(e('fnotes'))e('fnotes').oninput=()=>{f.notes=e('fnotes').value;save();};
  if(e('fsave'))e('fsave').onclick=()=>{
    // Easter egg : une sortie de 0,0 km réveille le Lièvre (sauf import, où 0 km peut être réel).
    if(!state._editId && !f._imported && Math.round(f.distanceKm*10)/10===0){ wakeCoach(); return; }
    // Activité hors course/trail → entrée "charge" : comptée pour la fatigue, hors métriques course.
    if(f._imported && !isRunSport(f.sport)){
      const minutes=(f.durationSec||0)/60;
      const rpe = feelingToRpe(f.feeling) || sportInfo(f.sport).rpe;
      const entry={ id:state._editId||('r_'+Date.now()), kind:'autre', sport:f.sport, date:f.date,
        durationMin:Math.round(minutes), durationSec:f.durationSec,
        distanceKm:Math.round((f.distanceKm||0)*10)/10, elevationGainM:f.elevationGainM||0,
        load:Math.round(rpe*minutes), avgHr:f.avgHr, cadenceSpm:f.cadence, feeling:f.feeling,
        notes:(f.notes||'').trim(), source:sportInfo(f.sport).lab };
      if(state._editId){ const i=state.journal.findIndex(r=>r.id===state._editId); if(i>=0)state.journal[i]=entry; }
      else state.journal.push(entry);
      state._editId=null; state._selId=entry.id; state.route='journalEntry'; adaptHorizon(); save(); render(); return;
    }
    if(!f.paceEdited){f.paceMinPerKm=f.durationSec>0&&f.distanceKm>0?(f.durationSec/60)/f.distanceKm:0;}
    const planned=sessionForDate(f.date);
    const segOk = ['tempo','intervals','cotes'].includes(f.type) && Array.isArray(f.segments)
      ? f.segments.filter(s=>s && (s.distanceKm!=null||s.durationSec!=null||s.paceMinPerKm!=null||(s.elevationGainM||0)>0)) : [];
    const entry={ id:state._editId||('r_'+Date.now()), date:f.date, type:f.type, sport:isRunSport(f.sport)?f.sport:'course', distanceKm:Math.round(f.distanceKm*10)/10,
      durationSec:f.durationSec, paceMinPerKm:f.paceMinPerKm, elevationGainM:f.elevationGainM, difficulty:f.difficulty,
      avgHr:f.avgHr, vo2:f.vo2, cadenceSpm:f.cadence||null, feeling:f.feeling, notes:f.notes.trim(), tags:Array.isArray(f.tags)?f.tags.slice():[],
      segments: segOk.length?segOk:undefined,
      paceRecovery:f.type==='intervals'?f.paceRecovery:null, paceFast:f.type==='intervals'?f.paceFast:null,
      linkedSessionId:planned?planned.id:null };
    entry.coachNote = localCoachNote(entry); // commentaire local, sans appel API
    if(state._editId){ const i=state.journal.findIndex(r=>r.id===state._editId); if(i>=0)state.journal[i]=entry; }
    else state.journal.push(entry);
    checkCoachTriggers(); // P4 : le Lièvre peut réagir à cette sortie
    state._editId=null; state._selId=entry.id; state.route='journalEntry'; adaptHorizon(); save(); render();
  };
}
function bindSliderF(id,fn){ const el=document.getElementById(id); if(!el)return;
  el.oninput=()=>{const o=document.getElementById(id+'-out'); const v=fn(el.value); if(o)o.textContent=v; save();}; }

function bindCharge(){
  const ch=document.getElementById('charge-help'); if(ch) ch.onclick=()=>{ state._helpCharge=!state._helpCharge; render(); };
  const c=state._charge, e=id=>document.getElementById(id), re=()=>{save();render();};
  const calcLoad=()=>{ const preset=CHARGE_PRESETS.find(p=>p.id===c.presetId);
    return c.mode==='rpe'?Math.round(c.rpe*c.durationMin):c.mode==='score'?(parseInt(c.score)||0):(preset?preset.load:0); };
  const upd=()=>{ const o=e('cload-out'); if(o){ const v=calcLoad(); o.textContent=v||'—'; } };
  if(e('cdate'))e('cdate').onchange=()=>{c.date=e('cdate').value;save();};
  document.querySelectorAll('[data-cmode]').forEach(b=>b.onclick=()=>{c.mode=b.dataset.cmode;re();});
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{c.presetId=b.dataset.preset;re();});
  document.querySelectorAll('[data-cimpact]').forEach(b=>b.onclick=()=>{c.impact=b.dataset.cimpact;re();});
  if(e('cdur'))e('cdur').oninput=()=>{c.durationMin=parseInt(e('cdur').value);e('cdur-out').textContent=c.durationMin+' min';upd();save();};
  if(e('crpe'))e('crpe').oninput=()=>{c.rpe=parseInt(e('crpe').value);e('crpe-out').innerHTML=c.rpe+'/10 · <b>'+RPE_LABELS[c.rpe]+'</b>';upd();save();};
  if(e('cscore'))e('cscore').oninput=()=>{c.score=e('cscore').value;save();};
  if(e('cnote'))e('cnote').oninput=()=>{c.note=e('cnote').value;save();};
  if(e('csave2'))e('csave2').onclick=()=>{
    const preset=CHARGE_PRESETS.find(p=>p.id===c.presetId), load=calcLoad();
    if(!load){ alert(c.mode==='score'?'Saisis un score de charge.':c.mode==='rpe'?'Règle la durée et l\u2019intensité.':'Choisis une comparaison.'); return; }
    const entry={ id:'c_'+Date.now(), date:c.date, kind:'autre', type:'charge', load,
      structFactor: CHARGE_IMPACT[c.impact] != null ? CHARGE_IMPACT[c.impact] : CHARGE_IMPACT.modere,
      source: c.mode==='compare'?(preset?preset.label:null):(c.mode==='score'?'Charge saisie':null),
      rpe: c.mode==='rpe'?c.rpe:null, durationMin: c.mode==='rpe'?c.durationMin:null,
      note:(c.note||'').trim() };
    state.journal.push(entry);
    checkCoachTriggers();
    rescheduleSpentDay(entry.date);                 // grosse charge un jour de séance → décalage au prochain jour libre
    state._selId=entry.id; state.route='journalEntry'; adaptHorizon(); save(); render();
  };
}

function applyTheme(){
  const pref=state.settings.theme;
  const dark=pref==='dark'||(pref==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='system')applyTheme();});

// Démarrage : onboardé → accueil ; sinon on respecte l'intro (1er lancement) ou l'onboarding en cours.
state.route = state.onboarded ? 'home' : (state.route==='onboarding' ? 'onboarding' : 'intro');
if(state.onboarded && state.program && state.program.sessions && state.program.sessions.length){ adaptHorizon(); save(); }
applyTheme(); render();
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
