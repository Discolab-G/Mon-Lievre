  {"id":"nutri_soif_vs_horloge","declencheurs":["soif","quand boire","rythme hydratation","trop boire"],"reponse":"La soif est un signal parfois tardif en course, mais boire à l'excès (hyponatrémie) est très dangereux. Le bon compromis est de boire l'équivalent d'une à deux gorgées (100 à 150 ml) toutes les 15 à 20 minutes, en adaptant selon la température extérieure.","medical":false},
  {"id":"recup_active_vs_passive","declencheurs":["récupération active","récupération passive","décrassage","bouger ou repos"],"reponse":"La récupération passive, c'est le repos total (canapé, sommeil). La récupération active implique une activité très douce (marche, vélo lent, natation) qui stimule la circulation sanguine pour nettoyer les déchets métaboliques sans ajouter de nouvelle charge.","medical":false},
  {"id":"app_entrainement_modele","declencheurs":["entraîner ia","vendre données","anthropic","claude données"],"reponse":"Non. Le fournisseur de l'IA (Anthropic) n'entraîne pas ses modèles commerciaux sur les données transmises via son API, ne les conserve pas durablement et ne les revend pas. Ta requête sert juste à te répondre, puis est effacée de leurs serveurs.","medical":false},
  {"id":"nutri_hydratation_avant","declencheurs":["boire avant","eau avant course","déshydraté départ"],"reponse":"L'hydratation se construit la veille et les jours précédents. Boire 1 litre d'eau juste avant le départ ne fera que te donner envie d'uriner. Bois régulièrement de petites gorgées jusqu'à 30 minutes avant l'effort pour t'assurer des urines claires.","medical":false},
  {"id":"biomeca_sans_chaussette_ampoules","declencheurs":["sans chaussette","barefoot","pied nu","ampoules","frottement","peau"],"reponse":"Courir sans chaussettes (le pied directement dans une chaussure standard) retire la couche de glissement textile. La friction de la peau contre la tige et la semelle augmente la proprioception mais majore le risque phlycténaire (ampoules). Si une zone de frottement devient douloureuse à vif ou saigne, stoppe l'effort pour éviter une infection et consulte si nécessaire.","medical":true},
  {"id":"physio_courbatures_doms","declencheurs":["courbatures","lendemain","jambes de bois","raideur","doms","mal aux muscles"],"reponse":"Les courbatures n'apparaissent souvent que 24 à 48h après l'effort. Elles sont causées par des micro-lésions musculaires et une inflammation bénigne, typiques après un effort excentrique important (comme beaucoup de dénivelé négatif). Si la douleur est articulaire ou très localisée, ce n'est pas une courbature : sois prudent et consulte au besoin.","medical":true},
  {"id":"mat_lacage_douleur","declencheurs":["dessus du pied","laçage","coup de pied","serré","engourdi","fourmis"],"reponse":"Une douleur sur le coup de pied ou des fourmillements sont souvent dus à un laçage trop serré qui comprime les nerfs et les tendons extenseurs. Desserre tes lacets. Si la douleur persiste après plusieurs jours de repos, une inflammation tendineuse est possible : consulte un médecin.","medical":true},
  {"id":"recup_mobilite_lendemain","declencheurs":["mobilité","lendemain","raide","dérouiller","yoga doux","réveil musculaire"],"reponse":"Le lendemain d'une séance éprouvante (forte charge structurelle), une routine de mobilité articulaire douce (mouvements amples sans forcer les amplitudes) est excellente. Elle permet de 'dérouiller' les articulations et de relancer la circulation sans créer de micro-lésions supplémentaires associées aux étirements passifs profonds.","medical":false},
  {"id":"biomecanique_sans_chaussette","declencheurs":["pied nu","sans chaussette","frottement","ampoule","metatarse"],"reponse":"Courir sans chaussettes dans des chaussures classiques augmente fortement les frictions directes avec les coutures et la semelle de propreté, favorisant les ampoules et irritations. De plus, si cela modifie tes appuis habituels, les contraintes sur les os extérieurs du pied (comme le 5ème métatarse) peuvent s'intensifier. Au moindre signe de douleur osseuse ou articulaire, arrête l'effort et consulte un professionnel de santé.","medical":true},
  {"id":"physio_frequence_cardiaque_max","declencheurs":["fcm","coeur max","fréquence maximale","pulsations","battements"],"reponse":"La FCM est le nombre maximum de battements que ton cœur peut atteindre. Contrairement aux idées reçues, la formule '220 - âge' est souvent imprécise. La FCM ne s'entraîne pas vraiment, mais ta capacité à maintenir un effort proche de cette FCM (ton seuil) s'améliore avec l'entraînement.","medical":false},
  {"id":"biomeca_asymetrie","declencheurs":["asymétrie","déséquilibre","boiter","plus fort à droite","jambe plus courte"],"reponse":"Une légère asymétrie est naturelle. Cependant, si tu compenses consciemment ou si l'asymétrie s'accentue soudainement, c'est souvent pour fuir une gêne ou une douleur. Cela crée une surcharge sur l'autre jambe. En cas de douleur persistante, un avis médical est indispensable.","medical":true},
  {"id":"physio_crampes","declencheurs":["crampe","mollet dur","contraction","tétanisé","blocage muscle"],"reponse":"Les crampes sont principalement liées à une fatigue neuromusculaire locale (ton muscle est allé au-delà de sa capacité de tolérance), et plus rarement à la seule déshydratation. Si la douleur survient brutalement comme un coup de poignard et persiste après l'arrêt, cela peut être une déchirure : consulte un médecin.","medical":true},
  {"id":"biomeca_entorse_cheville","declencheurs":["entorse","cheville tordue","vrillé","foulure","pied qui tourne"],"reponse":"Une entorse survient souvent sur un terrain instable (racine, pierre) où le pied part vers l'intérieur, étirant violemment les ligaments externes. C'est une blessure qui nécessite un vrai protocole de guérison. Ne cours pas dessus, glace, et va consulter un professionnel de santé.","medical":true},
  {"id":"physio_vieillissement","declencheurs":["âge","vieillissement","vieux","récupération âge","plus lent"],"reponse":"Avec l'âge, la FCM diminue naturellement, tout comme la souplesse tendineuse. Le besoin de récupération s'allonge car les tissus se réparent moins vite. L'application en tient compte si ton profil est renseigné, mais l'entraînement régulier permet de maintenir une excellente VO2 Max très longtemps.","medical":false},
  {"id":"biomeca_douleur_aine_hanche","declencheurs":["aine","hanche","psoas","bassin blocage","articulation hanche"],"reponse":"Le psoas et les articulations de la hanche sont les moteurs de ta foulée. Une douleur vive ou un blocage à ce niveau peut indiquer un problème articulaire ou une inflammation profonde causée par une charge inadaptée. Ne force pas et consulte un médecin du sport pour un examen clinique.","medical":true},
  {"id":"mat_plaques_dynamiques","declencheurs":["carbone","plaque","rebond","chaussure rapide","effet ressort"],"reponse":"Ces chaussures intègrent une plaque rigide et une mousse très réactive pour améliorer l'économie de course (gain physiologique). Cependant, elles modifient la biomécanique et exigent une excellente stabilité de la cheville. Les utiliser à chaque sortie augmente le risque de blessure tendineuse.","medical":false},
  {"id":"mat_pointure_ongle_noir","declencheurs":["ongle noir","pointure","taille chaussure","orteil","buter"],"reponse":"En courant, le pied gonfle et s'affaisse légèrement. Si tes chaussures sont trop justes, tes orteils butent à chaque foulée, créant un hématome sous l'ongle (ongle noir). Il faut généralement prendre une pointure ou une demi-pointure au-dessus de ta taille de ville. Si l'hématome est très douloureux ou infecté, vois un podologue.","medical":true},
  {"id":"recup_vfc","declencheurs":["vfc","hrv","variabilité","stress corps","système nerveux"],"reponse":"La VFC mesure l'irrégularité des battements de ton cœur. Une VFC haute indique que ton système nerveux est reposé et prêt à encaisser de la charge. Une VFC qui s'effondre est le premier signe d'une fatigue globale, qu'elle soit liée à l'entraînement, à un virus ou au stress du quotidien.","medical":false},
  {"id":"recup_bains_froids","declencheurs":["bain froid","glace","cryothérapie","froid","réduire inflammation"],"reponse":"Le froid bloque l'inflammation et agit comme un antalgique naturel. C'est excellent pour enchaîner les courses. Cependant, l'inflammation naturelle post-entraînement est le signal qui dit au corps de se renforcer. Trop de froid bloque cette adaptation physiologique. À utiliser de manière stratégique.","medical":false},
  {"id":"psycho_baisse_motivation","declencheurs":["motivation","pas envie","flemme","perte envie","abandon"],"reponse":"C'est un cycle naturel. L'entraînement repose sur la discipline, pas sur l'envie quotidienne. Fixe-toi un micro-objectif : 'Je mets mes chaussures et je cours 10 minutes'. Souvent, une fois dehors, la machine se lance. Si l'aversion est totale, prends un vrai jour de repos sans culpabilité.","medical":false},
  {"id":"psycho_effort_percu_srpe","declencheurs":["rpe","ressenti","échelle 1 à 10","subjectif","pourquoi noter l'effort"],"reponse":"La méthode sRPE intègre tout ce que ta montre ne voit pas : une mauvaise nuit, le stress du travail, ou la chaleur. Si une séance habituellement facile te paraît dure (RPE élevé), ton corps a réellement subi une charge supérieure. La subjectivité est la meilleure donnée.","medical":false},
  {"id":"psycho_stress_course","declencheurs":["stress","peur","boule au ventre","course approche","anxiété"],"reponse":"Le stress pré-course est physiologique : l'adrénaline te prépare à l'effort. Pour éviter qu'il ne te paralyse, prépare tes affaires la veille, visualise ta ligne de départ et concentre-toi sur le processus (ton allure, ta respiration) plutôt que sur le chronomètre final.","medical":false},
  {"id":"psycho_seance_ratee","declencheurs":["raté","mauvaise séance","échec","pas réussi","craqué"],"reponse":"Une séance ne définit pas un niveau. L'adaptation se crée sur l'accumulation chronique (tes 28 derniers jours). Une mauvaise séance est souvent une victoire pour le Coach IA, car elle signale un pic de fatigue permettant de recalibrer le plan avant la blessure.","medical":false},
  {"id":"psycho_comparaison_reseaux","declencheurs":["réseaux","autres coureurs","comparer","allure des autres","strava"],"reponse":"Les réseaux sociaux sportifs poussent souvent à courir trop vite pour afficher de belles statistiques. Ton plan est calibré selon TA charge et TON radar de profil. Courir lentement (80/20) demande de laisser son ego au vestiaire.","medical":false},
  {"id":"psycho_blues_post_course","declencheurs":["blues","après course","vide","déprime","plus de but"],"reponse":"Après des mois focalisés sur un objectif, franchir la ligne d'arrivée provoque une chute soudaine de dopamine et d'endorphines. Ce 'vide' est normal. L'application gère cette période en te proposant une phase de maintien doux ou de diversification pour retrouver le plaisir simple de bouger.","medical":false},
  {"id":"psycho_visualisation","declencheurs":["visualisation","imagerie","mental","se voir","préparation mentale"],"reponse":"Le cerveau fait peu la différence entre un mouvement réellement exécuté et un mouvement vivement imaginé. Visualiser le parcours, anticiper les moments durs et s'imaginer les surmonter avec succès aide à pré-programmer le corps pour l'échéance.","medical":false},
  {"id":"app_coach_ia_declenchement","declencheurs":["écoute","arrière-plan","espion","envoi données","quand partent"],"reponse":"Non. Rien n'est envoyé en arrière-plan. La seule fois où une information quitte ton téléphone, c'est quand tu décides toi-même de poser une question au Coach, et uniquement les variables nécessaires à ta requête sur l'instant.","medical":false},
  {"id":"app_medical_disclaimer","declencheurs":["médecin","diagnostic","application santé","soigner","fiable santé"],"reponse":"Non. Mon Lièvre et son Coach IA ne sont pas des dispositifs médicaux. L'application calcule des charges mathématiques, mais seul un professionnel de santé est habilité à poser un diagnostic. Ne prends jamais aucun risque avec ta santé sous prétexte qu'une application te dit l'inverse.","medical":true},
  {"id":"app_suppression_donnees","declencheurs":["effacer","supprimer données","désinstaller","remise à zéro","reset"],"reponse":"Puisque tout est stocké localement sur ton appareil, il n'y a aucune procédure complexe à faire ou de support client à contacter. Supprimer l'application efface instantanément et définitivement l'ensemble de tes données.","medical":false},
  {"id":"recup_chaleur_sauna","declencheurs":["sauna","hammam","chaleur","bain chaud","transpirer après"],"reponse":"La chaleur favorise la vasodilatation, ce qui détend les muscles et aide à détendre le système nerveux. Cependant, elle majore aussi fortement la déshydratation post-effort. Il est conseillé d'attendre au moins quelques heures après une course intense avant de s'exposer à de fortes chaleurs, et de boire abondamment.","medical":false},
  {"id":"recup_overreaching_vs_surentrainement","declencheurs":["dépassé","overreaching","surcompensation","fatigue normale","ko complet"],"reponse":"Une grande fatigue (overreaching) est normale à la fin d'un bloc d'entraînement difficile : une semaine d'allègement suffit à rebondir. Si la fatigue, la baisse de motivation et l'insomnie persistent malgré le repos, c'est un syndrome de surentraînement. C'est une pathologie qui exige l'arrêt du sport et un diagnostic médical.","medical":true},
  {"id":"physio_vs_structurel","declencheurs":["physiologique","structurelle","différence charge","deux charges"],"reponse":"Un même effort fatigue le corps de deux manières indépendantes : la charge physiologique (cœur, souffle) et la charge structurelle (usure mécanique des muscles et articulations). Cela permet de comprendre qu'une séance peut épuiser ton souffle tout en ménageant tes articulations, ou inversement.","medical":false},
  {"id":"explication_acwr","declencheurs":["acwr","ratio","pic de fatigue","calcul ratio"],"reponse":"Le ratio ACWR compare ta fatigue récente, calculée sur 7 jours, à ta tolérance de fond, calculée sur 28 jours. S'il se situe entre 0,8 et 1,3, tu es dans une zone idéale. S'il dépasse 1,5, le risque de blessure augmente fortement.","medical":false},
  {"id":"monotonie_alerte","declencheurs":["monotonie","toujours pareil","stagner","même allure"],"reponse":"Une monotonie élevée indique un entraînement trop uniforme. Faire la même distance à la même allure tous les jours empêche le corps de récupérer et de progresser. Le Coach te conseillera toujours d'intégrer de vrais jours faciles et de vrais jours durs.","medical":false},
  {"id":"adaptation_seance_ratee","declencheurs":["raté séance","déplacer","emploi du temps","manqué"],"reponse":"Le plan s'adapte à ta vie, tu peux régénérer ton programme à volonté sans jamais effacer ce que tu as déjà accompli. L'adaptation s'applique à l'horizon à venir uniquement, jamais au passé.","medical":false},
  {"id":"concept_affutage","declencheurs":["affûtage","avant course","tapering","repos avant course"],"reponse":"Pour un objectif précis daté, le plan ajoute un affûtage avant l'échéance : le volume baisse, mais l'intensité se maintient. L'affûtage permet de réduire la fatigue accumulée sans perdre les bénéfices de l'entraînement.","medical":false},
  {"id":"gestion_apres_objectif","declencheurs":["objectif atteint","après course","maintien","fini"],"reponse":"Une fois l'objectif confirmé, l'application te propose un choix : le maintien simple avec une charge réduite, la progression pour aller plus loin, ou la diversification pour combler l'axe le plus faible de ton profil radar.","medical":false},
  {"id":"limites_allouees","declencheurs":["pas le temps","heures max","limite","impossible"],"reponse":"Si le cadre de temps que tu as posé est incompatible avec l'objectif, le Coach te le dit franchement plutôt que de prescrire un volume intenable. Le moteur distribue la charge à l'intérieur des limites que tu as fixées.","medical":false},
  {"id":"biomeca_descente","declencheurs":["descente","casse fibre","excentrique","dénivelé négatif"],"reponse":"La descente est un problème musculaire excentrique. Ce type d'effort matraque les cuisses et fait grimper la charge structurelle, tout en sollicitant assez peu le système cardio-vasculaire par rapport à une montée.","medical":false},
  {"id":"blessure_genou","declencheurs":["genou","douleur rotule","tfl","essuie glace"],"reponse":"Le genou est l'une des articulations les plus touchées par les surcharges structurelles, souvent liées à un ratio aigu/chronique trop élevé. Ce Coach ne pose pas de diagnostic : arrête de courir et consulte un médecin ou un kiné.","medical":true},
  {"id":"gestion_courbatures","declencheurs":["courbatures","mal aux muscles","raide","jambes lourdes"],"reponse":"Les courbatures sont le signe de micro-lésions musculaires normales après un effort inhabituel (souvent excentrique). L'application devrait avoir enregistré une charge élevée. Si la douleur est asymétrique ou très vive (type déchirure), cela relève du domaine médical.","medical":true},
  {"id":"physio_economie_course","declencheurs":["économie de course","rendement","énergie dépensée","efficacité"],"reponse":"C'est la quantité d'oxygène (ou d'énergie) dont tu as besoin pour courir à une vitesse donnée. Deux coureurs avec la même VO2 Max n'ont pas les mêmes chronos si l'un a une meilleure économie de course (foulée plus fluide, moins de mouvements parasites).","medical":false},
  {"id":"biomeca_cadence","declencheurs":["cadence","fréquence","pas par minute","180 ppm"],"reponse":"Il n'y a pas de cadence 'magique' universelle, bien que le chiffre de 180 pas par minute soit souvent cité. L'important est d'éviter une sur-foulée (le pied qui attaque trop loin devant le genou), car cela augmente fortement la charge structurelle au freinage.","medical":false},
  {"id":"mat_drop_definition","declencheurs":["drop","différence talon pointe","hauteur chaussure","mm"],"reponse":"Le drop est la différence de hauteur entre le talon et l'avant-pied de la chaussure, exprimée en millimètres. Un drop élevé (10-12 mm) soulage les mollets mais transfère la charge vers les genoux. Un drop faible (0-4 mm) favorise une attaque médio-pied mais sollicite fortement le tendon d'Achille.","medical":false},
  {"id":"mat_chaussure_trail_vs_route","declencheurs":["trail sur route","crampons","mixte","bitume trail"],"reponse":"C'est possible mais déconseillé. Les crampons vont s'user prématurément sur le bitume, et la gomme, souvent plus rigide, offre un moins bon amorti sur surface dure, ce qui majore la charge structurelle. Réserve-les aux terrains meubles.","medical":false},
  {"id":"nutri_poids_etalonnage","declencheurs":["perdre du poids","maigrir","régime","paramètres poids"],"reponse":"L'application ne juge jamais ton poids et ne propose aucun régime. Elle a besoin de cette donnée uniquement pour étalonner ta charge structurelle : l'impact encaissé par tes articulations dépend directement de ta masse corporelle au moment de la course.","medical":false},
  {"id":"recup_sieste","declencheurs":["sieste","dormir jour","somme","fatigue journée"],"reponse":"Une 'micro-sieste' de 20 minutes suffit à relancer la vigilance et abaisser le stress. Une sieste d'un cycle complet (environ 90 minutes) permet une réparation musculaire (sommeil profond). Attention à ne pas dépasser 30 minutes si tu ne veux pas te réveiller groggy.","medical":false},
  {"id":"contrainte_stress","declencheurs":["contrainte","stress global","fatigue globale"],"reponse":"La contrainte multiplie ta charge hebdomadaire totale par ta monotonie. C'est un excellent indicateur de ton stress global : si tu cours beaucoup, mais toujours à la même allure, ta contrainte explose, ce qui est un signal d'alarme avant la blessure.","medical":false},
  {"id":"charge_logique","declencheurs":["charge","fatigue","trop couru","ua","ratio","acwr"],"reponse":"L'application compare ta charge d'entraînement récente (les 7 derniers jours) à ta charge habituelle (les 28 derniers jours). Si ce ratio augmente trop brutalement, le risque de fatigue extrême ou de blessure monte en flèche. Si tu ressens une fatigue anormale ou inexpliquée, lève le pied et n'hésite pas à consulter un médecin.","medical":true},
  {"id":"biomeca_pronation_supination","declencheurs":["pronation","supination","pied qui rentre","intérieur","extérieur","affaissement"],"reponse":"La pronation (affaissement du pied vers l'intérieur) est un mécanisme naturel du corps pour absorber les chocs. Ce n'est un problème que si elle est excessive (hyper-pronation) ou asymétrique. Elle s'accentue souvent avec la fatigue au fil des kilomètres.","medical":false},
  {"id":"app_confidentialite_locale","declencheurs":["données","cloud","serveur","vie privée","local","stockage"],"reponse":"Par défaut, absolument nulle part. L'application Mon Lièvre fonctionne entièrement en local sur ton appareil. Il n'y a pas de compte, pas de cloud, et aucun serveur central ne stocke tes informations d'entraînement.","medical":false},
  {"id":"entrainement_polarise","declencheurs":["trop lent","vitesse","80/20","fondamentale","lentement"],"reponse":"Le plan repose sur un modèle polarisé : une majorité de footing facile, soit environ 80%, et une à deux séances de qualité par semaine au maximum. L'endurance facile n'est jamais prescrite plus rapide que l'allure facile déclarée.","medical":false},
  {"id":"physio_vo2max","declencheurs":["vo2","vo2max","oxygène max","moteur","cylindrée"],"reponse":"La VO2 Max est le volume maximal d'oxygène que ton corps peut absorber et utiliser par minute. C'est en quelque sorte la 'cylindrée' de ton moteur physiologique. Elle s'améliore surtout avec des efforts intenses (fractionné) et continus.","medical":false},
  {"id":"biomeca_attaque_pied","declencheurs":["attaque","talon","médio-pied","avant-pied","pose du pied"],"reponse":"L'attaque talon sollicite davantage les genoux et les hanches (transfert d'ondes de choc), tandis que l'attaque médio/avant-pied sollicite davantage les mollets et les tendons d'Achille. Modifier sa foulée volontairement doit se faire très progressivement pour éviter les blessures.","medical":false},
  {"id":"biomeca_oscillation","declencheurs":["oscillation","rebond","monter","verticale","sauter en courant"],"reponse":"Plus tu rebondis vers le haut à chaque foulée, plus tu dépenses de l'énergie physiologiquement pour rien, et plus le choc à l'atterrissage (charge structurelle) est lourd. Une bonne foulée propulse vers l'avant, pas vers le haut.","medical":false},
  {"id":"biomeca_bras","declencheurs":["bras","mouvement bras","balancier","épaules","crispé"],"reponse":"Les bras agissent comme des balanciers pour équilibrer la rotation du bassin causée par les jambes. Des bras crispés ou croisant la ligne médiane de ton buste réduisent ton économie de course et créent des tensions inutiles dans le haut du corps. Garde les épaules basses et détendues.","medical":false},
  {"id":"biomeca_sur_foule","declencheurs":["overstriding","sur-foulée","grand pas","allonger","freinage"],"reponse":"Chercher à aller plus vite en faisant des pas démesurément longs (le pied atterrit loin devant ton centre de gravité) agit comme un coup de frein biomécanique à chaque pas. Cela augmente massivement la charge structurelle sur le tibia et le genou. Préfère augmenter ta cadence.","medical":false},
  {"id":"physio_transpiration","declencheurs":["transpiration","sueur","sel","électrolytes","traces blanches"],"reponse":"La transpiration permet de réguler ta température interne, mais elle te fait perdre de l'eau et du sodium (sel). Si tu as des traces blanches sur tes vêtements après la course, tu es un 'salty sweater' (tu perds beaucoup de sel). Un apport en électrolytes est crucial sur les efforts de plus d'1h30 pour maintenir la fonction neuromusculaire.","medical":false},
  {"id":"biomeca_renforcement_excentrique","declencheurs":["excentrique","renfo","musculation","côtes","descente musculation"],"reponse":"Le travail excentrique (freiner une charge, comme amortir en descente) est très traumatisant pour les fibres. L'intégrer sous forme de renforcement musculaire spécifique permet de solidifier les muscles et les tendons, augmentant ta tolérance de fond (charge chronique) face aux descentes.","medical":false},
  {"id":"biomeca_posture_fatigue","declencheurs":["posture","dos courbé","assis","bassin","gainage"],"reponse":"En fin de course longue, la fatigue des muscles posturaux (abdos, lombaires) provoque souvent un basculement du bassin et un dos qui se voûte. Cette posture dite 'assise' modifie tes appuis, détériore ton économie de course et augmente le risque de blessure au dos ou aux genoux.","medical":false},
  {"id":"mat_compression_manchons","declencheurs":["compression","manchons","chaussettes hautes","mollet","vibration"],"reponse":"Pendant l'effort, les manchons de compression servent principalement à réduire les oscillations musculaires (vibrations) à chaque impact, ce qui peut retarder la fatigue neuromusculaire. Après l'effort, ils favorisent le retour veineux pour la récupération.","medical":false},
  {"id":"mat_capteur_cardiaque","declencheurs":["cardio","ceinture","optique","poignet","bpm faux"],"reponse":"Les capteurs optiques au poignet peuvent 'décrocher' lors d'efforts intenses (fractionnés) ou s'il fait froid (vasoconstriction). La ceinture thoracique à électrodes reste l'outil de mesure de la charge physiologique en temps réel le plus précis.","medical":false},
  {"id":"nutri_fer_anemie","declencheurs":["fer","anémie","fatigue constante","pâle","sang"],"reponse":"Les coureurs réguliers (notamment les femmes et ceux pratiquant sur bitume) détruisent des globules rouges à cause des ondes de choc (hémolyse d'effort), risquant une carence en fer (anémie). Si ta fatigue persiste malgré un ratio ACWR équilibré, un bilan sanguin prescrit par un médecin est nécessaire.","medical":true},
  {"id":"mat_hygiene_chaussettes","declencheurs":["chaussettes","coton","synthétique","mycose","transpiration pied"],"reponse":"Le coton retient l'humidité, gonfle et favorise les ampoules ainsi que la prolifération de bactéries. Opte pour des chaussettes techniques en fibres synthétiques ou laine mérinos qui évacuent la transpiration. Garder les pieds au sec réduit considérablement le risque de mycoses.","medical":false},
  {"id":"recup_sommeil_importance","declencheurs":["sommeil","dormir","nuit","fatigue nuit","insomnie"],"reponse":"Le sommeil est le meilleur outil de récupération existant. C'est pendant les phases de sommeil profond que le corps sécrète l'hormone de croissance, réparant les fibres musculaires lésées par la charge structurelle. Un manque de sommeil augmente le RPE (l'effort te paraîtra plus dur) et le risque de blessure.","medical":false},
  {"id":"recup_auto_massage","declencheurs":["rouleau","massage","pistolet","fascia","nœud musculaire"],"reponse":"L'auto-massage (rouleau en mousse, pistolet à percussion) aide à détendre les fascias (les enveloppes des muscles) et à réduire la sensation de raideur temporaire. Cela ne répare pas les fibres plus vite, mais cela améliore le confort post-séance. Ne passe jamais ces outils sur une articulation ou un os.","medical":false},
  {"id":"recup_surentrainement","declencheurs":["surentraînement","burnout","épuisé","n'avance plus","overtraining"],"reponse":"Le syndrome de surentraînement se traduit par une baisse des performances malgré l'entraînement, un sommeil perturbé, une irritabilité et un ratio ACWR souvent longtemps dans le rouge. C'est un état d'épuisement sérieux. Stoppe l'entraînement et consulte un médecin.","medical":true},
  {"id":"psycho_peur_blessure","declencheurs":["peur","reblesser","appréhension","reprise après blessure","bloqué"],"reponse":"Après une blessure, la peur du mouvement est une protection neurologique normale. La reprise doit être extrêmement progressive. Si ton appréhension se transforme en douleur physique aiguë lors de la reprise, stoppe immédiatement. Si l'angoisse te paralyse, un suivi médical et psychologique est recommandé.","medical":true},
  {"id":"regeneration_plan","declencheurs":["recalculer","régénérer","perdre données","effacer"],"reponse":"Le bouton de régénération réécrit les séances à venir, mais ne touche jamais au journal de ce qui a été réalisé. De plus, tes données restent stockées en local sur ton appareil : rien ne quitte ton téléphone par défaut.","medical":false},
  {"id":"biomeca_sable","declencheurs":["sable","plage","dune","terrain meuble"],"reponse":"Courir sur sable coûte environ 1,6 fois l'énergie d'une surface dure, tout en étant à faible impact. Cela signifie que ta charge physiologique sera très élevée, mais ta charge structurelle sera ménagée.","medical":false},
  {"id":"biomeca_devers","declencheurs":["dévers","penché","asymétrique","de biais"],"reponse":"Le terrain en dévers crée une charge asymétrique. Cela sollicite de manière inégale les chevilles et la bandelette ilio-tibiale, ce qui augmente le tag de charge structurelle d'environ 25%.","medical":false},
  {"id":"manque_denivele","declencheurs":["pas de côte","plat","dénivelé","montagne"],"reponse":"Si le terrain manque de dénivelé, le moteur propose du renforcement excentrique ou des côtes répétées. Le renforcement comme les squats à descente lente ou le step-down prend le relais pour te préparer musculairement aux descentes.","medical":false},
  {"id":"mat_poids_chaussure","declencheurs":["lourd","poids chaussure","léger","grammes"],"reponse":"Ajouter du poids aux extrémités (les pieds) coûte beaucoup plus d'énergie que sur le torse. Une chaussure plus lourde augmente légèrement ta charge physiologique (coût métabolique) à chaque foulée, mais offre souvent plus de protection structurelle.","medical":false},
  {"id":"nutri_gels_energetiques","declencheurs":["gel","sucre","compote","pâte de fruit"],"reponse":"Un gel énergétique apporte un concentré de glucides rapidement assimilables. Il faut impérativement le consommer avec 150 à 200 ml d'eau claire (et non de la boisson isotonique) pour diluer le sucre dans l'estomac, sinon tu risques des crampes intestinales violentes.","medical":false},
  {"id":"nutri_alcool_recuperation","declencheurs":["bière","alcool","récupération bière","fêter"],"reponse":"Contrairement au mythe, la bière n'est pas une bonne boisson de récupération. L'alcool déshydrate, bloque la synthèse des protéines (réparation musculaire) et ralentit la recharge des stocks de glycogène. Hydrate-toi d'abord avec de l'eau ou une boisson de récupération.","medical":false},
  {"id":"nutri_magnesium_crampes","declencheurs":["magnésium","cures","banane","crampes minéraux"],"reponse":"Un déficit en minéraux (sodium, potassium, magnésium) peut favoriser les crampes, bien que la cause principale soit souvent la fatigue musculaire pure. Une alimentation riche au quotidien (oléagineux, légumes verts, eaux minéralisées) suffit généralement à couvrir les besoins.","medical":false},
  {"id":"gestion_douleurs","declencheurs":["douleur","mal","blessure","cheville","genou","tibia","gêne","pointe"],"reponse":"Une douleur aigüe, persistante ou qui modifie ta façon de courir est un signal d'alarme. L'assistant virtuel de cette application ne pose aucun diagnostic. Arrête ta séance et prends rendez-vous avec un médecin ou un kinésithérapeute pour une évaluation précise.","medical":true},
  {"id":"recup_courir_malade","declencheurs":["malade","fièvre","rhume","virus","toux","covid","grippe"],"reponse":"La règle est stricte : on ne court jamais avec de la fièvre ou de fortes courbatures virales. Faire monter son cœur pendant une infection virale augmente drastiquement le risque de développer une myocardite (inflammation du cœur) potentiellement mortelle. Repose-toi totalement et consulte un médecin si les symptômes durent.","medical":true},
  {"id":"caracteristiques_chaussures","declencheurs":["chaussures","drop","amorti","semelle","usure","km"],"reponse":"Les propriétés des mousses amortissantes se dégradent naturellement avec les kilomètres, réduisant l'absorption des chocs même si l'aspect extérieur de la chaussure semble intact. Une usure asymétrique peut modifier ta foulée. Si tu ressens des douleurs nouvelles (genoux, tendons) avec une paire usagée, il est vivement conseillé de consulter un médecin du sport ou un podologue.","medical":true},
  {"id":"physio_fibres_musculaires","declencheurs":["fibres","lentes","rapides","muscle","contraction","génétique"],"reponse":"Ton corps possède des fibres musculaires lentes (très endurantes, fonctionnent à l'oxygène) et rapides (explosives, se fatiguent vite). L'entraînement en endurance fondamentale (qui doit représenter la majorité de ta charge) densifie les réseaux sanguins autour de tes fibres lentes pour te rendre plus résistant sur la durée.","medical":false},
  {"id":"physio_respiration","declencheurs":["nez","bouche","respiration","inspirer","expirer","souffle"],"reponse":"En endurance fondamentale, respirer uniquement par le nez est un bon test pour s'assurer qu'on ne court pas trop vite. Cependant, dès que l'intensité monte (seuil ou fractionné), ouvre la bouche ! Le but est de faire entrer un maximum d'oxygène, peu importe par où.","medical":false},
  {"id":"mat_frottement_saignement","declencheurs":["sang","tétons","aisselle","cuisses","brûlure","frottement"],"reponse":"La répétition de la foulée crée des frottements redoutables avec les coutures ou le textile. Applique une crème anti-frottement avant les sorties longues. Si une zone est à vif ou saigne (comme la fameuse blessure des tétons), nettoie et désinfecte après l'effort. En cas de surinfection, consulte un médecin.","medical":true},
  {"id":"nutri_problemes_gastriques","declencheurs":["diarrhée","ventre","intestins","nausée","vomir","toilettes"],"reponse":"Les chocs répétés de la foulée et la réduction de l'afflux sanguin vers l'intestin provoquent souvent des troubles gastriques. Si les vomissements ou diarrhées sont intenses ou s'accompagnent de fièvre et de sang, arrête-toi immédiatement, hydrate-toi prudemment et consulte un médecin.","medical":true},
  {"id":"recup_electrostimulation","declencheurs":["électrostimulation","électrodes","tens","courant","patchs","secousses"],"reponse":"Les programmes de récupération par électrostimulation créent des micro-secousses musculaires qui relancent la circulation sanguine locale sans épuiser le système nerveux central. C'est idéal le soir après une grosse séance. Attention, ne place jamais les électrodes sur une zone douloureuse pouvant s'apparenter à une déchirure.","medical":false},
  {"id":"definition_charge","declencheurs":["charge","calcul","srpe","effort","ua"],"reponse":"Pour comparer des efforts très différents, on les ramène tous à une même monnaie : la charge. On utilise la session-RPE : la charge est égale à ton effort perçu multiplié par la durée en minutes. Pour plus de détails, n'hésite pas à consulter le document de Méthodologie de l'app.","medical":false},
  {"id":"rythmes_progression","declencheurs":["ambitieux","doux","standard","rythme","évoluer"],"reponse":"Tu peux choisir entre un rythme Doux (micro-cycles courts, allègements fréquents), Standard (3 semaines de montée pour 1 d'allègement), ou Ambitieux (blocs plus longs). Le plan progresse par cycles entrecoupés de semaines d'allègement.","medical":false},
  {"id":"radar_5_axes","declencheurs":["radar","axes","profil","creux","statistiques"],"reponse":"Le radar dresse un portrait sur 8 semaines glissantes selon 5 axes : endurance, vitesse, côtes, technique et robustesse. Ses creux t'invitent à varier ton entraînement, et ce ne sont pas des objectifs stricts, mais plutôt un miroir de ta pratique.","medical":false},
  {"id":"calcul_tags_ressenti","declencheurs":["tag","ressenti","double","calcul","srpe"],"reponse":"Si tu déclares un ressenti (sRPE) très difficile parce qu'il fait très chaud, l'app amortit le multiplicateur lié à la chaleur pour éviter de compter la difficulté deux fois. Sur le canal physiologique, le moteur fait confiance à ton ressenti en priorité.","medical":false},
  {"id":"biomeca_raideur_tendineuse","declencheurs":["tendon","ressort","raideur","élasticité","renvoi"],"reponse":"Une certaine 'raideur' des tendons (notamment d'Achille) est en fait bénéfique en course à pied : elle permet au tendon d'agir comme un ressort puissant qui stocke et restitue l'énergie gratuite à chaque foulée. Trop d'étirements profonds avant une course peuvent diminuer cet effet ressort.","medical":false},
  {"id":"mat_vetements_pluie","declencheurs":["pluie","imperméable","mouillé","veste","respirant"],"reponse":"Une veste totalement imperméable bloque la pluie mais empêche la transpiration de s'évacuer : tu finiras trempé de l'intérieur, ce qui augmente ta dérive cardiaque. Préfère les vestes déperlantes et respirantes. Protège surtout tes extrémités (tête, mains) s'il fait froid.","medical":false},
  {"id":"mat_montre_vs_telephone","declencheurs":["gps","précision","trace","téléphone","montre"],"reponse":"Les montres de sport dédiées ont des puces GPS souvent plus précises et exposées vers le ciel que les téléphones rangés dans une poche. Toutefois, ton application Mon Lièvre calcule ta charge d'après la durée et ton ressenti (session-RPE), ce qui rend la précision GPS kilométrique moins cruciale pour ton suivi.","medical":false},
  {"id":"nutri_solide_liquide","declencheurs":["solide","liquide","mâcher","barre","boisson"],"reponse":"Plus l'intensité de la course est élevée, plus il est difficile de mâcher et de digérer du solide (le sang quitte l'estomac). Sur un marathon, le liquide ou semi-liquide (gels) est roi. Sur un trail long à faible allure, l'apport solide (barres, salé) est nécessaire pour éviter l'écoeurement.","medical":false},
  {"id":"psycho_musique","declencheurs":["musique","écouteurs","podcast","son","bruit"],"reponse":"La musique à tempo élevé réduit le ressenti de l'effort (baisse le RPE) et peut aider sur les séances difficiles. Cependant, courir sans musique permet une meilleure écoute de sa respiration et de sa foulée (proprioception). L'idéal est d'alterner selon l'objectif de la séance.","medical":false},
  {"id":"fatigue_vs_tolerance","declencheurs":["fatigue","tolérance","chronique","aiguë"],"reponse":"La fatigue représente ta charge récente (environ 7 jours), c'est ce que tu as dans les jambes en ce moment. La tolérance représente ta charge de fond (environ 28 jours), c'est ce que ton corps a appris à encaisser. L'app compare en permanence les deux.","medical":false},
  {"id":"profil_poids_impact","declencheurs":["poids","kilos","impact","corpulence"],"reponse":"Le poids sert au calibrage de l'impact structurel, un coureur plus lourd encaisse plus de charge par kilomètre. Il n'y a jamais de cible de poids ni de jugement dans l'application, ce paramètre sert uniquement à affiner le calcul du coût énergétique et de l'impact.","medical":false},
  {"id":"biomeca_instable","declencheurs":["boue","instable","racine","cailloux"],"reponse":"Un terrain instable sollicite fortement les muscles stabilisateurs et les chevilles, augmentant la charge structurelle. La boue ou la neige réduisent également la traction, ce qui augmente le coût métabolique global.","medical":false},
  {"id":"biomeca_chaleur","declencheurs":["chaud","chaleur","canicule","soleil"],"reponse":"La chaleur provoque une dérive cardiaque et augmente la charge physiologique. Ton corps dépense de l'énergie supplémentaire pour se refroidir. Il est crucial d'adapter ton allure et de ne pas forcer si des vertiges apparaissent.","medical":true},
  {"id":"biomeca_froid","declencheurs":["froid","gel","hiver","neige"],"reponse":"Le froid rend les muscles plus raides et nécessite un échauffement plus long. La charge structurelle est légèrement augmentée car l'absorption des chocs par les tissus froids est moins efficace.","medical":false},
  {"id":"biomeca_sac_lest","declencheurs":["sac","lest","poids","gilet"],"reponse":"Porter une masse supplémentaire augmente à la fois la charge physiologique (tu portes plus lourd) et la charge structurelle (plus d'impact à chaque foulée). Les gilets lestés en descente sont déconseillés car ils ne remplacent pas un vrai travail excentrique.","medical":false},
  {"id":"blessure_tendon","declencheurs":["tendon","achille","talon","mollet"],"reponse":"Une douleur au tendon d'Achille peut être le signe d'une surcharge excentrique ou d'un changement de drop trop rapide. Ne force jamais sur une douleur tendineuse au risque de provoquer une rupture. Consulte un professionnel de santé.","medical":true},
  {"id":"altitude_hypoxie","declencheurs":["altitude","montagne","oxygène","essoufflé"],"reponse":"Au-delà de 1500m, l'hypoxie augmente considérablement ta charge physiologique pour une même allure. La charge de ta sortie est majorée par le tag altitude, tu dois donc t'attendre à une baisse naturelle de tes allures.","medical":false},
  {"id":"nutri_cafeine","declencheurs":["café","caféine","boost","excitant"],"reponse":"La caféine est reconnue pour abaisser l'effort perçu (sRPE) et repousser la fatigue mentale. Attention, elle peut accélérer le transit intestinal et avoir un effet diurétique. Teste toujours sa tolérance à l'entraînement, jamais le jour d'une course.","medical":false},
  {"id":"recup_etirements","declencheurs":["étirement","stretching","assouplissement","raideur"],"reponse":"Les étirements statiques profonds juste après une séance dure (ou avec beaucoup de descente) sont déconseillés, car ils étirent des fibres déjà micro-déchirées, augmentant la charge structurelle. Préfère de la mobilité douce à chaud, et garde les étirements profonds pour les jours de repos.","medical":false},
  {"id":"biomeca_tapis","declencheurs":["tapis","salle","roulant"],"reponse":"Sur tapis, il n'y a pas de vent ni d'irrégularité, ce qui réduit légèrement la charge. Le tapis applique un léger multiplicateur à la baisse sur tes charges par rapport à la route.","medical":false}
];
function normalizeFr(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function localCoachAnswer(q){
  const nq=normalizeFr(q); let best=null, bestScore=0;
  for(const e of COACH_KB){
    let score=0;
    for(const trig of (e.declencheurs||[])){ const nt=normalizeFr(trig); if(nt && nq.includes(nt)) score += nt.includes(' ')?2:1; }
    if(score>bestScore){ bestScore=score; best=e; }
  }
  if(best && bestScore>0){
    let txt=best.reponse;
    if(best.medical && !/m[ée]decin|professionnel de sant[ée]|kin[ée]|secours|podologue/i.test(txt))
      txt+="\n\n⚕️ Je ne suis pas un professionnel de santé : en cas de douleur, blessure ou doute, consulte un médecin.";
    return { text:txt, id:best.id, medical:!!best.medical };
  }
  return { text:"Sans clé API, je réponds à partir d'une base de questions courantes (charge, plan, récupération, matériel…), et je n'ai pas de réponse toute prête à celle-ci. Tu peux la reformuler, ouvrir l'Aide intégrée, ou ajouter une clé API pour le coach complet.", id:null, medical:false };
}
function sendCoachLocal(q){
  q=(q||'').trim(); if(!q) return;
  const cv=activeConv();
  cv.messages.push({ role:'user', content:q });
  const ans=localCoachAnswer(q);
  cv.messages.push({ role:'assistant', content:ans.text, local:true });
  cv.updatedAt=isoToday();
  if(!cv.title || cv.title==='Nouvelle conversation') cv.title=convTitle(cv.messages);
  state._coachDraft='';
  save(); render();
}

    <div style="height:6px"></div>

      <p class="coach-text">Je réponds hors-ligne à partir d'une base de questions courantes (charge, plan, récupération, matériel…). Rien n'est envoyé sur internet. Pour des réponses sur-mesure, <span data-go="settings" style="color:var(--accent);text-decoration:underline;cursor:pointer">ajoute une clé API</span>.</p>
      <p class="help" style="margin-top:6px">${privacyLink()}</p></div>
    ${chat.length?`<div class="chat" id="chat">${bubbles}</div>`:intro}
    <div class="chat-input">

function relDay(iso){
  if(!iso) return '';
  const d=diffDays(iso,isoToday());
  if(d<=0) return "aujourd'hui"; if(d===1) return 'hier';
  return new Date(iso+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
function CoachConvList(){
  const c=state.coach;
  const rows=c.conversations.length ? c.conversations.map(cv=>`
    <div class="row conv-row ${cv.id===c.activeId?'on':''}">
      <div class="grow" data-conv="${cv.id}"><div class="r-title">${esc(cv.title||'Nouvelle conversation')}</div>
        <div class="r-sub">${cv.messages.length?relDay(cv.updatedAt):'vide'}</div></div>
      <button class="iconbtn" data-convdel="${cv.id}" aria-label="Supprimer la conversation">${svg('trash',18)}</button></div>`).join('')
    : `<p class="muted" style="margin:0;font-size:13.5px">Aucune conversation pour l'instant.</p>`;
  return `<div class="topbar"><h1 class="hero-title" style="margin:0">Mes conversations</h1>
      <button class="iconbtn" id="convback" aria-label="Retour au coach">${svg('x',20)}</button></div>
    <div style="height:10px"></div>
    <button class="btn btn-accent" id="convnewl">${svg('plus',18)} Nouvelle conversation</button>

    <div class="card">${rows}</div><div style="height:8px"></div>`;
}
function CoachAwakeAI(){
  if(state._coachList) return CoachConvList();
  const cv=activeConv(); const chat=cv.messages;
  const bubbles=chat.map(m=>{
    const srcs=(m.role==='assistant'&&m.sources)?`<div class="sources">Sources : ${m.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc((s.title||'').slice(0,42))}↗</a>`).join(' · ')}</div>`:'';
    return `<div class="bubble ${m.role==='user'?'user':'coach'}">${esc(m.content).replace(/\n/g,'<br>')}${srcs}</div>`;

/* Série de charge par canal sur N jours (pour les graphes de la vue détaillée). */
function loadSeries(N){
  const today=isoToday(), dayP={}, dayS={};
  state.journal.forEach(e=>{ if(e.date<=today){ const L=entryLoadChannels(e); dayP[e.date]=(dayP[e.date]||0)+L.physio; dayS[e.date]=(dayS[e.date]||0)+L.struct; } });
  const b=baselineDailyLoad();
  const firstLog = state.journal.length ? state.journal.reduce((m,e)=> e.date<m?e.date:m,'9999-99-99') : null;
  const series=(daily,base)=>{ let acute=base,chronic=base; const la=2/8,lc=2/29; const out=[];
    for(let i=60;i>=0;i--){ const d=addDays(today,-i); const L=(!firstLog||d<firstLog)?base:(daily[d]||0);
      acute+=la*(L-acute); chronic+=lc*(L-chronic);
      if(i<N) out.push({d,load:L,acute,chronic}); }
    return out; };
  return { physio:series(dayP,b.physio), struct:series(dayS,b.struct) };
}
function loadChartSvg(series,color){
  const W=320,H=92,pad=5;
  const max=Math.max(1,...series.map(p=>Math.max(p.load,p.acute,p.chronic)));
  const X=i=>pad+(i/(series.length-1))*(W-2*pad), Y=v=>H-pad-(v/max)*(H-2*pad);
  const bars=series.map((p,i)=>p.load>0?`<rect x="${(X(i)-1).toFixed(1)}" y="${Y(p.load).toFixed(1)}" width="2" height="${(H-pad-Y(p.load)).toFixed(1)}" fill="var(--line-strong)" opacity="0.55"/>`:'').join('');
  const line=(key,col,w)=>{ let d=''; series.forEach((p,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[key]).toFixed(1)+' '; }); return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`; };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${bars}${line('chronic','var(--muted)',1.5)}${line('acute',color,2.2)}</svg>`;
}

/* Page Statistiques — toutes les stats dérivées du profil + de l'historique.

function weekMonday(iso){ const d=new Date(iso+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return toISO(d); }
function barChartSvg(vals, fmt, color){
  const W=320,H=124,padB=16,padT=8,padX=4;
  const max=Math.max(1,...vals), bw=(W-2*padX)/Math.max(1,vals.length);
  const bars=vals.map((v,i)=>{ const hgt=(v/max)*(H-padB-padT), x=padX+i*bw, y=H-padB-hgt;
    return `<rect x="${(x+bw*0.16).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.68).toFixed(1)}" height="${Math.max(0,hgt).toFixed(1)}" rx="2" fill="${color}" opacity="${v>0&&v===max?1:0.5}"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${bars}<line x1="${padX}" y1="${H-padB}" x2="${W-padX}" y2="${H-padB}" stroke="var(--line-strong)" stroke-width="1"/><text x="${padX}" y="${H-3}" font-size="9" fill="var(--muted)">${vals.length} sem</text><text x="${W-padX}" y="${H-3}" font-size="9" fill="var(--muted)" text-anchor="end">max ${fmt(max)}</text></svg>`;
}
/* --- modèles de performance & physiologie (estimations) --- */
function riegelTime(t1,d1,d2){ return t1*Math.pow(d2/d1,1.06); }           // prédiction de temps
function danielsVdot(distM,timeSec){ const t=timeSec/60, v=distM/t;        // VDOT (Daniels)
  const vo2=-4.60+0.182258*v+0.000104*v*v;
  const pct=0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
  return pct>0?vo2/pct:null; }
function minettiCost(grade){ const i=Math.max(-0.45,Math.min(0.45,grade)); // J/kg/m selon la pente (Minetti 2002)
  return 155.4*i**5 - 30.4*i**4 - 43.3*i**3 + 46.3*i**2 + 19.5*i + 3.6; }

  return h?`${h}h${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; }

function ScreenStats(){
  const period = state._statPeriod===undefined ? null : state._statPeriod;

  const inP  = state.journal.filter(r=>r.date>=since && r.date<=today);

  const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0), n=runs.length;
  const km=v=>String(Math.round(v*10)/10).replace('.',',')+' km';

  const distTot=sum(runs,r=>r.distanceKm), timeTot=sum(runs,r=>r.durationSec), dpTot=sum(runs,r=>r.elevationGainM);
  const span = n? diffDays(runs.reduce((m,r)=>r.date<m?r.date:m,today),today)+1 : 0, weeks=Math.max(1, span/7);
  const chargeTot=sum(inP,r=>{const L=entryLoadChannels(r);return L.physio+L.struct;});
  const segPaceAll=[]; runs.forEach(r=>(r.segments||[]).forEach(s=>{ if(s.paceMinPerKm>0) segPaceAll.push(s.paceMinPerKm); }));
  const paces=runs.filter(r=>r.paceMinPerKm>0).map(r=>r.paceMinPerKm);
  const bestPace=(paces.concat(segPaceAll).length)?Math.min(...paces.concat(segPaceAll)):null, avgPace=paces.length?paces.reduce((a,x)=>a+x,0)/paces.length:null;
  // Fourchettes ±30% quand trop peu de données récentes (tâche 5) : < 3 sorties sur 30 jours glissants.

  const fk=(v,fmt)=> (v==null)?'' : (sparse ? `${fmt(v*0.7)}\u2013${fmt(v*1.3)}` : fmt(v));
  const easyR=runs.filter(r=>['easy','recovery','long'].includes(r.type)&&r.paceMinPerKm>0);
  const easyPace=easyR.length?sum(easyR,r=>r.paceMinPerKm)/easyR.length:null;
  const longest=runs.reduce((m,r)=>(!m||r.distanceKm>m.distanceKm)?r:m,null);

  const byDow={}; runs.forEach(r=>{const k=dayKeyOf(r.date);byDow[k]=(byDow[k]||0)+1;});
  const topDow=Object.keys(byDow).sort((a,b)=>byDow[b]-byDow[a])[0];
  const lastRun=n?runs.reduce((m,r)=>r.date>m?r.date:m,'0000-00-00'):null, daysSince=lastRun?diffDays(lastRun,today):null;
  const quality=runs.filter(r=>['tempo','intervals'].includes(r.type)).length, easyShare=n?Math.round((n-quality)/n*100):null;
  const hrR=runs.filter(r=>r.avgHr), avgHr=hrR.length?Math.round(sum(hrR,r=>r.avgHr)/hrR.length):null, maxHr=hrR.length?Math.max(...hrR.map(r=>r.avgHr)):null;
  const vo2R=runs.filter(r=>r.vo2), vo2Avg=vo2R.length?Math.round(sum(vo2R,r=>r.vo2)/vo2R.length):null;
  const tagCount={}; runs.forEach(r=>(r.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
  const topTags=Object.keys(tagCount).sort((a,b)=>tagCount[b]-tagCount[a]).slice(0,4).map(t=>(TAG_BY_ID[t]?TAG_BY_ID[t].label:t)+' ×'+tagCount[t]);
  const effR=runs.filter(r=>r.distanceKm>=3&&r.paceMinPerKm>0); const effCand=effR.map(r=>r.paceMinPerKm).concat(segPaceAll);
  const bestEff=effCand.length?Math.min(...effCand):null;
  const vmaEst=p.vmaKmh||(bestEff?Math.round((60/bestEff/0.92)*2)/2:null), vmaSrc=p.vmaKmh?'renseignée':'estimée';
  const vo2Est=vmaEst?Math.round(3.5*vmaEst):null;
  const hrZone=pct=>(p.hrRest&&p.hrMax)?Math.round(p.hrRest+pct*(p.hrMax-p.hrRest))+' bpm':null;

  // ---- prédictions (Riegel / Daniels) ----
  let ref=null; if(p.refDistanceKm&&p.refTimeSec) ref={d:p.refDistanceKm,t:p.refTimeSec};
  runs.filter(r=>r.distanceKm>=2&&r.durationSec>0).forEach(r=>{ if(!ref||riegelTime(r.durationSec,r.distanceKm,10)<riegelTime(ref.t,ref.d,10)) ref={d:r.distanceKm,t:r.durationSec}; });
  const pred=d=>ref?fmtClock(riegelTime(ref.t,ref.d,d)):null;
  const predS=d=>ref?riegelTime(ref.t,ref.d,d):null;
  const vdot=ref?danielsVdot(ref.d*1000,ref.t):null;
  const o=state.objective||{}, objKm=o.distanceKm;
  const thrPace=vmaEst?3600/(vmaEst*0.86):null, maraPace=vmaEst?3600/(vmaEst*0.78):null;
  // vitesse critique (indicatif) : effort le plus court vs le plus long
  let cs=null,dprime=null; const eff2=runs.filter(r=>r.distanceKm>=1&&r.durationSec>=180&&r.paceMinPerKm>0).sort((a,b)=>a.durationSec-b.durationSec);
  if(eff2.length>=2){ const s0=eff2[0], s1=eff2[eff2.length-1]; if(s1.durationSec>s0.durationSec+120){ cs=((s1.distanceKm-s0.distanceKm)*1000)/(s1.durationSec-s0.durationSec); dprime=(s0.distanceKm*1000)-cs*s0.durationSec; } }
  const csOk = cs!=null && cs>2.2 && cs<6.5 && dprime>40 && dprime<700;

  // ---- intensité (zones d'allure & de FC) ----
  let zF=0,zS=0,zR=0; if(vmaEst) runs.forEach(r=>{ if(!r.paceMinPerKm||!r.durationSec)return; const pv=(60/r.paceMinPerKm)/vmaEst; if(pv<0.8)zF+=r.durationSec; else if(pv<0.92)zS+=r.durationSec; else zR+=r.durationSec; });
  const zTot=zF+zS+zR, zPct=v=>zTot?Math.round(v/zTot*100)+'%':null, paceZoneStr=zTot?`${zPct(zF)} / ${zPct(zS)} / ${zPct(zR)}`:null;
  let hF=0,hS=0,hM=0; if(p.hrRest&&p.hrMax) runs.forEach(r=>{ if(!r.avgHr||!r.durationSec)return; const hr=(r.avgHr-p.hrRest)/(p.hrMax-p.hrRest); if(hr<0.7)hF+=r.durationSec; else if(hr<0.88)hS+=r.durationSec; else hM+=r.durationSec; });
  const hTot=hF+hS+hM, hPct=v=>hTot?Math.round(v/hTot*100)+'%':null, hrZoneStr=hTot?`${hPct(hF)} / ${hPct(hS)} / ${hPct(hM)}`:null;
  // efficience (allure/FC) + tendance
  const efR=runs.filter(r=>r.avgHr&&r.paceMinPerKm>0).sort((a,b)=>a.date<b.date?-1:1), efVal=r=>(1000/r.paceMinPerKm)/r.avgHr;
  const efAvg=efR.length?efR.reduce((a,r)=>a+efVal(r),0)/efR.length:null; let efTrend=null;
  if(efR.length>=4){ const h=Math.floor(efR.length/2), o1=efR.slice(0,h).reduce((a,r)=>a+efVal(r),0)/h, o2=efR.slice(h).reduce((a,r)=>a+efVal(r),0)/(efR.length-h); efTrend=o2>o1*1.02?'en hausse':o2<o1*0.98?'en baisse':'stable'; }

  // ---- énergie & hydratation (si poids) ----
  const kcalRun=r=>w?w*(r.distanceKm||0)*1.036 + w*(r.elevationGainM||0)*0.0094 : 0;
  const runWatts=r=>{ if(!w||!r.durationSec||!r.distanceKm)return 0; const grade=(r.elevationGainM||0)/(r.distanceKm*1000), spd=(r.distanceKm*1000)/r.durationSec; return minettiCost(grade)*w*spd*0.23; };
  const fatFrac=r=>{ if(vmaEst&&r.paceMinPerKm){ const pv=(60/r.paceMinPerKm)/vmaEst; return pv<0.7?0.55:pv<0.8?0.45:pv<0.88?0.3:pv<0.95?0.15:0.07; } return ['easy','recovery'].includes(r.type)?0.5:r.type==='long'?0.45:r.type==='tempo'?0.25:0.12; };

  const wattsR=runs.filter(r=>w&&r.durationSec&&r.distanceKm), wattsAvg=wattsR.length?Math.round(wattsR.reduce((a,r)=>a+runWatts(r),0)/wattsR.length):null;
  const totK=w?sum(runs,kcalRun):0, fatPct=(w&&totK)?Math.round(sum(runs,r=>kcalRun(r)*fatFrac(r))/totK*100):null, carbPct=fatPct!=null?100-fatPct:null;

  const allWeeks=new Set(state.journal.filter(r=>!isCharge(r)).map(r=>weekMonday(r.date)));
  let cur=0,wk=weekMonday(today); while(allWeeks.has(wk)){cur++;wk=addDays(wk,-7);}
  let longestStreak=0; if(allWeeks.size){ const ws=[...allWeeks].sort(); let run=1; longestStreak=1; for(let i=1;i<ws.length;i++){ if(diffDays(ws[i-1],ws[i])===7){run++;longestStreak=Math.max(longestStreak,run);} else run=1; } }
  const rd=[...new Set(runs.map(r=>r.date))].sort(); let gaps=[]; for(let i=1;i<rd.length;i++) gaps.push(diffDays(rd[i-1],rd[i]));

  const ymT=today.slice(0,7), lmY=(()=>{const d=new Date(today+'T00:00:00');d.setMonth(d.getMonth()-1);return toISO(d).slice(0,7);})();

  const eqMar=distTot/42.195, eqEarth=distTot/40075*100, eqEiffel=dpTot/330, eqEverest=dpTot/8849*100;

  // ---- capteurs (préparé pour une montre : champs optionnels par sortie) ----
  const devAvg=f=>{const a=runs.filter(r=>r[f]!=null);return a.length?Math.round(a.reduce((s,r)=>s+r[f],0)/a.length):null;};
  const devAvgF=(f,dec)=>{const a=runs.filter(r=>r[f]!=null);return a.length?(a.reduce((s,r)=>s+r[f],0)/a.length).toFixed(dec):null;};

  const METR={ distance:{lab:'Distance',col:'var(--accent)',g:b=>b.dist,f:v=>Math.round(v)+' km'},

    charge:{lab:'Charge',col:'var(--navy)',g:b=>b.charge,f:v=>Math.round(v)+' UA'},
    allure:{lab:'Allure',col:'var(--accent)',g:b=>b.pace,f:v=>v?fmtPace(v)+'/km':'—'},
    fc:{lab:'FC',col:'var(--danger)',g:b=>b.hr,f:v=>v?Math.round(v)+' bpm':'—'} };
  if(w) METR.kcal={lab:'Kcal',col:'var(--danger)',g:b=>b.kcal,f:v=>Math.round(v)+' kcal'};
  const metric=METR[state._statMetric]?state._statMetric:'distance', md=METR[metric];
  const metricChips=Object.keys(METR).map(k=>`<button class="chip ${metric===k?'on':''}" data-metric="${k}">${METR[k].lab}</button>`).join('');
  const chartCard = n ? `<div class="card"><p class="lbl" style="margin-bottom:8px">Évolution hebdomadaire</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${metricChips}</div>
    ${barChartSvg(buckets.map(md.g),md.f,md.col)}</div>` : '';

  const R=(label,value)=> (value==null||value==='')?'' :
    `<div class="settings-row" data-stat="${(label+' '+value).toLowerCase().replace(/[<>"]/g,'')}"><span class="muted" style="font-size:13px">${label}</span><span style="font-weight:600;font-size:14px">${value}</span></div>`;
  const SEC=(title,rows)=>{ const b=rows.filter(Boolean).join(''); return b?`<div class="card stat-sec"><p class="lbl">${title}</p>${b}</div>`:''; };

      bestWeekKm?R('Meilleure semaine',km(bestWeekKm)):'',
      R('Distance / semaine',km(distTot/weeks)),
      longest?R('Sortie la plus longue',km(longest.distanceKm)):'' ]),
    SEC('Records',[
