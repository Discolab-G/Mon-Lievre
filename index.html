}
function softenToday(){
  const s=sessionForDate(isoToday()); if(!s) return;
  const acwr=loadState().acwr;
  const Z=paceZones(0);
  if(acwr>=1.8){
    // Surcharge forte (ex. grosse sortie cross-training) → on rétrograde vraiment : footing très court ou repos.
    s.type='recovery'; s.structure=null; s.priority='optional'; s.elevationGainM=0;
    s.target={ distanceKm: Math.max(3, Math.round((s.target&&s.target.distanceKm||6)*0.4)) };
    s.pace={ minPerKm:Z.recovery }; s.effort='très facile';
    s.description='Séance fortement allégée : charge récente très élevée — footing très court, ou repos si les jambes sont lourdes.';
  } else if(acwr>=1.5){
    if(s.type==='tempo'||s.type==='intervals'){ s.type='easy'; s.structure=null; s.priority='optional'; s.pace={ minPerKm:Z.easy }; s.effort='facile'; }
    if(s.target&&s.target.distanceKm) s.target.distanceKm=Math.max(4,Math.round(s.target.distanceKm*0.6));
    s.elevationGainM=Math.round((s.elevationGainM||0)*0.5);
    s.description='Séance allégée : charge récente élevée — on lève le pied pour récupérer.';
  } else {
    if(s.target&&s.target.distanceKm) s.target.distanceKm=Math.max(4,Math.round(s.target.distanceKm*0.8));
    if(s.type==='tempo'||s.type==='intervals'){
      s.type='easy'; s.structure=null; s.priority='optional'; s.pace={ minPerKm:Z.easy }; if(s.effort) s.effort='facile';
      s.description='Séance allégée : footing facile (charge élevée).';
    } else {
      s.description='Séance allégée (charge élevée) — reste bien en aisance.';
    }
  }
  s.adjusted=true; save(); render();
}

/* ===== Objectif atteint (incrément 5) =====
   Une perf peut tomber un jour idéal → on attend une confirmation (2 sorties qualifiantes,
   en conditions représentatives) avant de déclarer l'objectif atteint, puis on propose un choix. */
function objectiveProgress(){
  const o=state.objective;
  if(o.mode!=='dated' || !o.distanceKm) return null;        // l'« objectif atteint » ne concerne que l'objectif précis
  const distOk = r => (r.distanceKm||0) >= o.distanceKm*0.97;
  const timeOk = r => !o.timeSec || (r.durationSec>0 && r.durationSec <= o.timeSec*1.02);
  const dplusOk = r => !(o.elevationGainM>0) || (r.elevationGainM||0) >= o.elevationGainM*0.90;
  const runs = state.journal.filter(r=>!isCharge(r) && isRunSport(r.sport) && distOk(r) && timeOk(r) && dplusOk(r))
                            .sort((a,b)=>a.date.localeCompare(b.date));
  return { count: runs.length, runs, needed: 2 };
}
function objectiveLabelShort(){
  const o=state.objective; let s=(Math.round(o.distanceKm*10)/10).toString().replace('.',',')+' km';
  if(o.timeSec) s+=' en '+fmtHMS(o.timeSec);
  if(o.elevationGainM>0) s+=' · '+o.elevationGainM+' m D+';
  return s;
}
/* Axe principal de progression (pour « aller plus loin ») : chrono > dénivelé > distance. */
function primaryProgressAxis(){
  const o=state.objective;
  if(o.timeSec) return { key:'time', label:'vite' };
  if(o.elevationGainM>0) return { key:'dplus', label:'de dénivelé' };
  return { key:'dist', label:'loin' };
}
function objectiveCelebration(){
  const o=state.objective; if(o.achieved) return '';
  const p=objectiveProgress(); if(!p || p.count<1) return '';
  const lbl=objectiveLabelShort();
  if(p.count<p.needed){
    return `<div class="banner reveal" style="border-color:var(--accent)"><span class="ico" style="color:var(--accent)">${svg('trend',22)}</span>
      <p><b>Objectif réalisé une première fois</b> (${lbl}). Une perf peut tomber un jour parfait — refais-la une fois en conditions normales pour la valider.</p></div>`;
  }
  const pr=runnerProfile();
  const low=Object.entries(pr.axes).sort((a,b)=>a[1]-b[1])[0][0];
  const lowLab={endurance:'ton endurance',vitesse:'ta vitesse',cotes:'tes côtes',technique:'ta technique de terrain',jambes:'ta robustesse'}[low]||'un axe délaissé';
  const prog=primaryProgressAxis();
  return `<div class="card reveal" style="border:2px solid var(--accent)">
    <div class="sess-type" style="color:var(--accent)">${svg('star',20)}<span>Objectif atteint</span></div>
    <div class="sess-title" style="margin:6px 0 2px">Bravo — ${lbl}, confirmé.</div>
    <p class="sess-meta" style="margin-bottom:13px">Tu l'as réalisé en conditions représentatives. Et maintenant, qu'est-ce qu'on vise ?</p>
    <button class="btn" data-objchoice="maintien">${svg('check',18)} Maintenir cette forme — plan d'entretien allégé</button>
    <div style="height:7px"></div>
    <button class="btn btn-accent" data-objchoice="progresser">${svg('trend',18)} Aller plus ${prog.label} — relancer un cycle</button>
    <div style="height:7px"></div>
    <button class="btn" data-objchoice="diversifier">${svg('refresh',18)} Diversifier — travailler ${lowLab}</button>
  </div>`;
}

/* ===== Profil du coureur (P3) — radar à 5 axes dérivés des données réelles.
   Portrait relatif, calculé sur ~8 semaines glissantes (pas des objectifs). ===== */
function runnerProfile(){
  const today=isoToday(), winStart=addDays(today,-55);
  const runs=state.journal.filter(r=>!isCharge(r) && r.date>=winStart && r.date<=today);
  const L=loadState();
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const lin=(v,a,b)=>(v-a)/(b-a)*100; // a→0, b→100

  const totalKm = runs.reduce((a,r)=>a+(r.distanceKm||0),0);
  const longestMin = runs.reduce((m,r)=>Math.max(m,(r.durationSec||0)/60),0);
  // Endurance : tolérance chronique + plus longue sortie
  const endurance = clamp(0.6*lin(L.chronic,30,160) + 0.4*lin(longestMin,30,130));
  // Vitesse : meilleure allure soutenue + volume de qualité
  const paceCandidates=[]; runs.forEach(r=>{ if((r.distanceKm||0)>=2 && r.paceMinPerKm>0) paceCandidates.push(r.paceMinPerKm);
    (r.segments||[]).forEach(s=>{ if(s.paceMinPerKm>0 && (s.distanceKm==null||s.distanceKm>=0.2)) paceCandidates.push(s.paceMinPerKm); }); });
  const bestPace = paceCandidates.length?Math.min(...paceCandidates):null;
  const speedFromPace = bestPace!=null ? lin(bestPace,6.2,3.6) : 0; // 6:12→0, 3:36→100
  const qualityKm = runs.filter(r=>r.type==='tempo'||r.type==='intervals'||r.type==='cotes').reduce((a,r)=>a+(r.distanceKm||0),0);
  const vitesse = clamp(0.75*speedFromPace + 0.25*lin(qualityKm,0,40));
  // Côtes : D+ total et D+/km
  const totalDplus = runs.reduce((a,r)=>a+(r.elevationGainM||0),0);
  const dplusPerKm = totalKm>0 ? totalDplus/totalKm : 0;
  const cotes = clamp(0.5*lin(totalDplus,0,4000) + 0.5*lin(dplusPerKm,0,40));
  // Technique : difficulté de terrain moyenne pondérée par la distance
  const wDiff = totalKm>0 ? runs.reduce((a,r)=>a+((r.difficulty||1)*(r.distanceKm||0)),0)/totalKm : 1;
  const technique = clamp(lin(wDiff,1,4.5));
  // Jambes (robustesse) : régularité + volume absorbé − pénalité surcharge prolongée
  const activeDays = new Set(runs.map(r=>r.date)).size;
  let jambes = 0.55*lin(activeDays/8,0.5,4) + 0.45*lin(totalKm,40,360);
  if(L.freshness < -60) jambes -= 12;
  jambes = clamp(jambes);

  const axes={ endurance, vitesse, cotes, technique, jambes };
  const niveau = clamp((endurance+vitesse+cotes+technique+jambes)/5);
  return { axes, niveau, hasData: runs.length>0, count: runs.length };
}
function radarSvg(p){
  const axes=[['Endurance',p.axes.endurance],['Vitesse',p.axes.vitesse],['Côtes',p.axes.cotes],['Technique',p.axes.technique],['Jambes',p.axes.jambes]];
  const W=320,H=270,cx=160,cy=132,R=92;
  const ang=i=>(-90+i*72)*Math.PI/180;
  const pt=(i,f)=>[cx+R*f*Math.cos(ang(i)), cy+R*f*Math.sin(ang(i))];
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{ const pts=axes.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(',')).join(' '); grid+=`<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`; });
  let lines=''; axes.forEach((_,i)=>{ const [x,y]=pt(i,1); lines+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`; });
  const vpts=axes.map((a,i)=>pt(i,Math.max(0.03,a[1]/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const poly=`<polygon points="${vpts}" fill="var(--accent)" fill-opacity="0.20" stroke="var(--accent)" stroke-width="2"/>`;
  let dots=''; axes.forEach((a,i)=>{ const [x,y]=pt(i,Math.max(0.03,a[1]/100)); dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`; });
  let labels=''; axes.forEach((a,i)=>{ const [x,y]=pt(i,1.16); const anchor=Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    labels+=`<text x="${x.toFixed(1)}" y="${(y).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="var(--text)">${a[0]}</text>`;
    labels+=`<text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="var(--accent)" font-weight="600">${a[1]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="Profil du coureur en 5 axes">${grid}${lines}${poly}${dots}${labels}</svg>`;
}
function radarCard(){

    <p class="muted" style="margin:0;font-size:13.5px">Enregistre des sorties pour révéler ton profil — endurance, vitesse, côtes, technique et robustesse se construisent à partir de ce que tu cours.</p></div>`;

function ymNow(){ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; }

const CAL_LEGEND=`<div class="legend" style="margin-top:14px">
  <span class="sw"><span class="cell done" style="width:20px;height:20px;aspect-ratio:auto"></span> faite</span>

/* ---- STUB de génération (futur appel Claude) ---- */
/* Ancrage des allures sur le NIVEAU RÉEL du coureur.
   Priorité : (1) allure facile déclarée, (2) dérivée d'une perf de référence,
   (3) repli grossier selon le volume hebdo. Renvoie des secondes/km. */
function paceAnchorSec(){
  const p = state.profile;
  if (p.vmaKmh) return Math.round(3600/(p.vmaKmh*0.68)); // endurance facile ≈ 68% de la vVMA
  if (p.easyPaceSec) return p.easyPaceSec;
  if (p.refTimeSec && p.refDistanceKm){
    const racePace = p.refTimeSec / p.refDistanceKm; // s/km de la perf
    const off = p.refDistanceKm <= 5 ? 80 : p.refDistanceKm <= 10 ? 65 : p.refDistanceKm <= 21.1 ? 48 : 28;
    return Math.round(racePace + off);
  }
  const v = p.weeklyVolumeKm || 25;
  if (v < 20) return 390; if (v < 35) return 360; if (v < 50) return 330; if (v < 70) return 310; return 295;
}
/* Palier d'intensité de la séance de QUALITÉ dure (0 = aucune, seuil seul · 1 = vitesse critique · 2 = VO2max).
   Piloté par la DEMANDE de l'objectif (distance, chrono, terrain), pas la difficulté de terrain brute :
   un objectif montagne très technique reçoit MOINS de VO2 sur piste (peu spécifique), pas plus. */
function intensityTier(){
  const o=state.objective, dist=o.distanceKm||0;
  const timed = o.mode==='dated' && o.timeSec>0;
  let tier;
  if(o.mode==='continuous'){ tier = o.focus==='vitesse' ? 2 : 1; }
  else {
    if(dist<=0) tier=1; else if(dist<=12) tier=2; else if(dist<=25) tier=1; else tier=0;
    if(timed && dist<=42) tier+=1;                  // chrono visé → orientation perf, +1 cran
  }
  if((o.difficulty||1)>=4) tier-=1;                 // terrain très technique : VO2 piste peu pertinent
  if(o.rhythm==='doux') tier=Math.min(tier,1);      // reprise / vie chargée : plafond seuil
  return Math.max(0, Math.min(2, tier));
}
/* Zones d'allure (décimal min/km) dérivées de l'ancrage E (= allure facile).
   Les allures de QUALITÉ sont PROPORTIONNELLES à l'ancrage (qPace = E·0,68/frac) : le % de vVMA reste
   constant quel que soit le niveau — et exact quand la VMA est renseignée (E = 68% de la vVMA).
   weekIndex accélère légèrement la qualité au fil du bloc ; l'endurance facile reste facile. */
function paceZones(weekIndex){
  const E = paceAnchorSec();
  const bump = Math.min(weekIndex,3)*0.004;          // +0 à +1,2% de vVMA réparti sur le bloc
  const qPace = frac => E*0.68/(frac+bump);          // s/km à frac×vVMA (proportionnel à l'ancrage)
  const dec = s => Math.max(180, Math.round(s)) / 60;
  const range = (a, b) => { const x=dec(a), y=dec(b); return x<=y?[x,y]:[y,x]; };
  return {
    recovery: range(E + 30, E + 45),
    easy:     range(E,       E + 25),
    long:     range(E + 5,   E + 30),
    tempo:    range(qPace(0.84), qPace(0.875)),       // seuil / tempo (~86% vVMA) — pilier, tous paliers
    seuilRep: dec(qPace(0.86)),
    cv:       range(qPace(0.88), qPace(0.92)),        // vitesse critique (~90% vVMA) — palier 1
    cvRep:    dec(qPace(0.90)),
    vo2:      range(qPace(0.91), qPace(0.95)),        // VO2max (~93% vVMA, sous-maximal) — palier 2
    vo2Rep:   dec(qPace(0.93)),
  };
}

/* ===== Rythmes de progression (périodisation) ===== */
const RHYTHMS = {
  doux:      { label:'Doux',      build:2, gain:0.04, deload:0.70, desc:'Cycles courts (2:1), allègements fréquents. Idéal vie chargée, reprise ou multiactivité.' },
  standard:  { label:'Standard',  build:3, gain:0.06, deload:0.70, desc:'Cycle 3:1 — trois semaines de montée puis une d\u2019allègement. La référence.' },
  ambitieux: { label:'Ambitieux', build:4, gain:0.08, deload:0.65, desc:'Blocs plus longs (4:1) et plafond visé plus haut, toujours avec allègements réguliers.' },
};
/* Plafond dur de volume hebdo, relatif à la base : aucune semaine ne dépasse base×ce facteur.
   Rein le « Ambitieux » (qui filait sinon vers ×2 de la base) à une montée sûre. Calibrable. */
const VOL_PEAK_CEILING = 1.5;
function rhythmParams(){ return RHYTHMS[state.objective.rhythm] || RHYTHMS.standard; }
/* Projection du volume hebdo en escalier : montées + semaines d'allègement, et affûtage si objectif daté.
   Sert à la fois à la visualisation (incrément 1) et au moteur (incrément 2). */
function periodizedWeeks(baseVol, nWeeks, dated){
  const r=rhythmParams();
  if(state.objective.maintain){
    // Plan d'entretien : volume stable allégé (~0,8×), allègement léger 1 semaine sur 4, aucune progression ni affûtage.
    const v=baseVol*0.8, out=[];
    for(let w=0; w<nWeeks; w++) out.push({ vol: Math.round(w%4===3? v*0.75 : v), kind: w%4===3?'deload':'build' });
    return out;
  }
  const out=[]; let lvl=baseVol, peak=baseVol;
  for(let w=0; w<nWeeks; w++){
    const pos = w % (r.build+1);
    if(pos < r.build){ if(w>0) lvl = lvl*(1+r.gain); lvl = Math.min(lvl, baseVol*VOL_PEAK_CEILING); peak = lvl; out.push({vol:lvl, kind:'build'}); }
    else { out.push({vol:peak*r.deload, kind:'deload'}); lvl = peak; }   // allègement, la progression repart du pic
  }
  if(dated && nWeeks>=2){ const mx=Math.max(...out.map(x=>x.vol)); out[nWeeks-1]={vol:mx*0.45, kind:'race'}; out[nWeeks-2]={vol:mx*0.65, kind:'taper'}; }
  return out.map(x=>({ vol:Math.round(x.vol), kind:x.kind }));
}
function projectWeeklyVolume(baseVol, nWeeks, dated){ return periodizedWeeks(baseVol, nWeeks, dated).map(x=>x.vol); }

/* Dénivelé accessible — exprimé en D+/km (raideur des côtes que le coureur peut trouver). */
function accessibleDplusPerKm(){
  const p=state.profile;
  if(p.dplusMaxPerKm!=null) return p.dplusMaxPerKm;
  if(p.terrainAccess && TERRAIN_DPLUS_PER_KM[p.terrainAccess]!=null) return TERRAIN_DPLUS_PER_KM[p.terrainAccess];
  return Infinity;
}
/* D+/km réellement prescriptible en séance normale : c'est la valeur saisie (le D+/km à ne
   pas dépasser hors séances de côtes), bornée par le plafond dur de sécurité. */
function effectiveDplusPerKm(){
  const acc=accessibleDplusPerKm();
  return acc===Infinity ? Infinity : Math.min(acc, DPLUS_PER_KM_CEILING);
}
/* Plafond ABSOLU de D+ pour une séance d'une distance donnée (m). Infinity = aucun plafond. */
function accessibleDplusForRun(distanceKm){
  const perKm=effectiveDplusPerKm();
  if(perKm===Infinity) return Infinity;
  return Math.round(perKm * Math.max(1, distanceKm||0));
}

function generateProgram() {
  const today = isoToday(), startMonday = mondayOf(today);
  const prof = state.profile, obj = state.objective, c = obj.constraints || {};
  const defaultDays = ['mon','wed','sat'], ALL7 = ['mon','tue','wed','thu','fri','sat','sun'];
  const baseDays = (prof.days && prof.days.length) ? prof.days.slice() : defaultDays;
  const long = (prof.longRunDay && baseDays.includes(prof.longRunDay)) ? prof.longRunDay : baseDays[baseDays.length-1];
  const baseVol = prof.weeklyVolumeKm || 25;
  const objDiff = obj.difficulty || 1, dplus = obj.elevationGainM || 0, useEffort = objDiff >= 3;
  const easyPaceMin = paceAnchorSec()/60;

  // ---- terrain accessible : plafond de D+/km par séance + bascule vers côtes / renfo ----
  const perKmEff = effectiveDplusPerKm();                         // D+/km prescriptible (accessible/2 ∩ plafond dur)
  const targetLongDplus = Math.round(dplus*0.4);
  const approxLongKm = Math.max(6, baseVol*0.35);                 // distance ~ de la longue, pour estimer le déficit
  const cappedLongDplus = (perKmEff===Infinity) ? targetLongDplus : Math.min(targetLongDplus, Math.round(perKmEff*approxLongKm));
  const objHilly = dplus >= 600;
  const verticalDeficit = objHilly && (perKmEff!==Infinity) && cappedLongDplus < targetLongDplus*0.7; // le terrain ne fournit pas le vertical visé
  const needDescentPrep = dplus >= 1000; // beaucoup de D+ ⇒ beaucoup de descente ⇒ renfo excentrique indispensable

  // ---- périodisation : escalier du rythme + affûtage si daté ----
  const dated = obj.mode==='dated' && obj.date && diffDays(today,obj.date)>0;
  const weeksToRace = dated ? Math.max(1, Math.ceil(diffDays(today,obj.date)/7)) : 0;
  const planWeeks = dated ? weeksToRace : 10;
  const meta = periodizedWeeks(baseVol, planWeeks, dated);
  const genWeeks = Math.min(meta.length, 4);            // horizon glissant : ~4 semaines matérialisées
  const cycleLen = rhythmParams().build + 1;

  // ---- jours d'entraînement selon le mode de sorties (contrainte « Alloué ») ----
  function pickDays(){
    if(c.sessionsMode==='tousLesJours') return ALL7.slice();
    let d = baseDays.slice();
    if(c.sessionsMode==='plafond' && c.sessionsMax){
      if(!(prof.days && prof.days.length)){ const step=7/c.sessionsMax, picked=[]; for(let i=0;i<c.sessionsMax;i++) picked.push(ALL7[Math.round(i*step)%7]); d=[...new Set(picked)]; }
      else if(d.length>c.sessionsMax){ d=d.slice(0,c.sessionsMax); }
    }
    return d;
  }
  const weekDaysSel = pickDays();
  const longDay = weekDaysSel.includes(long) ? long : weekDaysSel[weekDaysSel.length-1];
  const maxSessionKm = c.maxSessionMin ? c.maxSessionMin/easyPaceMin : Infinity;
  const cap = v => Math.round(Math.min(maxSessionKm, v));

  // ---- palier d'intensité de la séance dure (selon la demande de l'objectif) ----
  const tier = intensityTier();
  const shortSpeed = (obj.distanceKm||0) > 0 && (obj.distanceKm||0) <= 12 && tier===2; // 5-10k : VO2 hebdo OK

  const sessions = [];
  for (let w=0; w<genWeeks; w++){
    const mw = meta[w];
    let weekVol = mw.vol;
    if(c.weeklyKmCap) weekVol = Math.min(weekVol, c.weeklyKmCap);
    if(c.weeklyHours) weekVol = Math.min(weekVol, (c.weeklyHours*60)/easyPaceMin);

    const dates = weekDaysSel.map(k=>({ k, iso: addDays(startMonday, w*7 + DAY_KEYS.indexOf(k)) })).filter(x=>x.iso>=today);
    if(!dates.length) continue;
    if(dates.length < weekDaysSel.length) weekVol *= dates.length / weekDaysSel.length; // semaine en cours tronquée → volume au prorata
    const Z = paceZones(w);
    const eased = mw.kind!=='build';
    // La séance "dure" (CV/VO2) n'est pas hebdo : pour une courte distance, 2 semaines sur 3 (VO2 fréquent
     // mais le seuil garde sa place) ; sinon 1 sur 2. Parité stable sur la semaine calendaire.
    const weekNum = Math.round(new Date(addDays(startMonday, w*7)+'T00:00:00').getTime()/(7*86400000));
    const hardWeek = tier>=1 && !eased && (shortSpeed ? (weekNum%3!==0) : (weekNum%2===0));
    const hasLong = dates.some(x=>x.k===longDay) && mw.kind!=='race';
    const longKm = hasLong ? Math.max(6, cap(weekVol*0.35)) : 0;
    let qualityN = 0;
    if(!eased) qualityN = (obj.rhythm==='ambitieux' && (w % cycleLen) >= 2) ? 2 : 1;
    const easyDays = dates.filter(x=>x.k!==longDay);
    const qualityIsos = easyDays.slice(0, qualityN).map(x=>x.iso);
    let cotesIso=null, renfoIso=null;
    if(!eased && verticalDeficit){
      const avail = easyDays.filter(x=>!qualityIsos.includes(x.iso));
      if(avail.length) cotesIso = avail[0].iso;
      if(needDescentPrep){ const r2 = avail.filter(x=>x.iso!==cotesIso); if(r2.length) renfoIso = r2[0].iso; }
    }
    const nonLong = Math.max(1, dates.filter(x=>x.k!==longDay).length);
    const perEasy = Math.max(4, cap(Math.max(0, weekVol - longKm) / nonLong));

    let qi = 0;
    dates.forEach(({ k, iso }) => {
      let type, target, pace=null, priority='optional', struct=null, effort=null, diff=Math.min(objDiff,2), sd=0, desc=null;
      if (k===longDay && hasLong){
        type='long'; target={ distanceKm: longKm }; priority='key'; diff=objDiff;
        sd = (perKmEff===Infinity) ? targetLongDplus : Math.min(targetLongDplus, Math.round(perKmEff*longKm)); // plafond D+/km × distance réelle
        if(useEffort) effort='facile à modéré'; else pace=Z.long;
      } else if (qualityIsos.includes(iso)){
        const slot = qi; qi++;
        // 1er créneau = SEUIL (pilier, hebdo) ; le créneau "dur" (CV/VO2 selon le palier) n'est pas hebdo.
        const doHard = tier>=1 && ((qualityN>=2 && slot>=1) || (qualityN===1 && hardWeek));
        if(doHard && tier>=2){ type='intervals'; target={ distanceKm: Math.max(6, perEasy) }; priority='key';
          struct={ warmup:15, reps:{ count:6, distanceM:400, paceMinPerKm: useEffort?null:Z.vo2Rep, recoveryMin:2 }, cooldown:10, kind:'vo2' };
          if(useEffort) effort='très soutenu · vif'; else pace=Z.vo2;
          desc='VO2max : 15 min d\u2019échauffement, 6×400 m vifs (récup 2 min), 10 min retour au calme';
        } else if(doHard){ type='intervals'; target={ distanceKm: Math.max(6, perEasy) }; priority='key';
          struct={ warmup:15, reps:{ count:5, distanceM:1000, paceMinPerKm: useEffort?null:Z.cvRep, recoveryMin:2 }, cooldown:10, kind:'cv' };
          if(useEffort) effort='soutenu'; else pace=Z.cv;
          desc='Allure critique : 15 min d\u2019échauffement, 5×1000 m soutenus (récup 2 min), 10 min retour au calme';
        } else { type='tempo'; target={ distanceKm: Math.max(5, perEasy) }; priority='key';
          if(useEffort) effort='modéré · allure seuil'; else pace=Z.tempo;
          desc='Seuil : 15 min d\u2019échauffement, 2×10 min en allure seuil (récup 3 min), 10 min retour au calme'; }
      } else if (iso===cotesIso){
        type='cotes'; priority='key'; diff=Math.min(objDiff,3);
        const reps = Math.min(12, Math.max(5, Math.round((targetLongDplus - cappedLongDplus)/20)));
        struct = { warmup:15, reps:{ count:reps, distanceM:200, paceMinPerKm:null, recoveryMin:2 }, cooldown:10, kind:'cotes' };
        sd = reps*20; // 200 m à ~10 % = 20 m/rep — cohérent avec le calcul du nombre de reps (le D+ produit comble le déficit)
        target = { distanceKm: Math.max(5, perEasy) };
        effort = 'soutenu en montée';
      } else if (iso===renfoIso){
        type='renfo'; priority='optional'; diff=1; sd=0; target={ durationMin:30 }; effort='excentrique · contrôlé';
      } else {
        type='easy'; target={ distanceKm: perEasy };
        if(useEffort) effort='facile'; else pace=Z.easy;
        if(mw.kind==='deload') desc='Semaine d\u2019allègement : footing facile, on récupère pour mieux repartir.';
        else if(mw.kind==='taper') desc='Affûtage : volume réduit, intensité préservée, jambes fraîches.';
        else if(mw.kind==='race') desc='Semaine de l\u2019objectif : déblocage léger, on garde du jus.';
        else if(w===0 && iso===(easyDays[0]&&easyDays[0].iso)) desc='Footing facile en aisance + 6 lignes droites de 20 s en fin de séance';
      }
      sessions.push({ id:'s_'+iso, date:iso, type, priority, target, pace: pace?{ minPerKm: pace }:null,
        elevationGainM: sd, difficulty: diff, effort, structure: struct, week: w, cycle: mw.kind,
        description: desc || describeSession(type, target, struct, effort, sd) });
    });
  }
  commitSessions(sessions);
  adaptHorizon();
}
/* Écrit les séances générées en PRÉSERVANT les séances ajoutées manuellement (manual:true). */
function commitSessions(list){
  const manual=state.program.sessions.filter(s=>s.manual);
  const md=new Set(manual.map(s=>s.date));
  state.program.sessions = manual.concat(list.filter(s=>!md.has(s.date)));
}

function parsePaceStr(s){ if(!s) return null; const m=String(s).trim().split(':'); if(m.length<2) return null; const a=parseFloat(m[0]), b=parseFloat(m[1]); return isNaN(a)||isNaN(b)?null:a+b/60; }
function parseSessions(text){
  let t=(text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();
  const i=t.indexOf('['), j=t.lastIndexOf(']'); if(i>=0&&j>i) t=t.slice(i,j+1);
  try{ const v=JSON.parse(t); return Array.isArray(v)?v:(Array.isArray(v.sessions)?v.sessions:[]); }catch(e){ return []; }
}
function normalizeSession(o){
  let pace=null;
  if(o.pace){ const parts=String(o.pace).replace(/\/?km|min/gi,'').split('-'); const lo=parsePaceStr(parts[0]), hi=parsePaceStr(parts[1]||parts[0]); if(lo&&hi) pace={minPerKm:[lo,hi]}; }
  let struct=null;
  if(o.intervals){ const iv=o.intervals; struct={ warmup:iv.warmupMin||15, reps:{ count:iv.reps||iv.count||5, distanceM:iv.repDistanceM||iv.distanceM||400, paceMinPerKm:parsePaceStr(iv.repPace)||4.2, recoveryMin:iv.recoveryMin||2 }, cooldown:iv.cooldownMin||10 }; }
  const target={}; if(o.distanceKm) target.distanceKm=o.distanceKm; if(o.durationMin) target.durationMin=o.durationMin;
  return { id:'s_'+o.date, date:o.date, type:o.type||'easy', priority:o.priority||'optional', target, pace,
    effort:o.effort||null, elevationGainM:o.elevationGainM||0, difficulty:Math.min(5,Math.max(1,o.difficulty||1)),
    structure:struct, description:o.description||describeSession(o.type||'easy',target,struct,o.effort,o.elevationGainM||0) };
}
async function generateProgramAI(){
  if(!navigator.onLine) throw new Error('Pas de connexion internet');
  const key=state.settings.apiKey; if(!key) throw new Error('Clé API manquante');
  const { system, user }=buildPrompt();
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify({ model:state.settings.model||'claude-sonnet-4-6', max_tokens:8000, system, messages:[{role:'user',content:user}] })
  });
  if(!res.ok){ let m='Erreur '+res.status; try{ const e=await res.json(); if(e&&e.error&&e.error.message) m=e.error.message; }catch(_){} throw new Error(m); }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const arr=parseSessions(text);
  if(!arr.length) throw new Error('Réponse illisible (JSON non reconnu)');
  const today=isoToday();
  const future=arr.filter(s=>s&&/^\d{4}-\d{2}-\d{2}$/.test(s.date)&&s.date>=today).map(normalizeSession).sort((a,b)=>a.date.localeCompare(b.date));
  if(!future.length) throw new Error('Aucune séance valide reçue');
  const past=state.program.sessions.filter(s=>s.date<today);
  commitSessions(past.concat(future));
  save();
}

    const body={ model, max_tokens:900, system, messages:msgs };
    if(state.settings.webSearch) body.tools=[{ type:'web_search_20250305', name:'web_search', max_uses:3 }];
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key':state.settings.apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body:JSON.stringify(body)
    });
    if(!res.ok){ let m='Erreur '+res.status; try{ const e=await res.json(); if(e&&e.error&&e.error.message) m=e.error.message; }catch(_){} throw new Error(m); }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    // Sources éventuelles (recherche web) — capturées depuis la même réponse, consultables sans crédit.
    const sources=[];
    (data.content||[]).forEach(b=>{ if(b.type==='web_search_tool_result'&&Array.isArray(b.content)) b.content.forEach(r=>{ if(r&&r.url) sources.push({title:r.title||r.url, url:r.url}); }); });
    // Coût réel depuis l'usage renvoyé par l'API.
    const u=data.usage||{}, pr=MODEL_PRICING[model]||MODEL_PRICING['claude-sonnet-4-6'];
    let cost=(u.input_tokens||0)/1e6*pr.in + (u.output_tokens||0)/1e6*pr.out;
    const nSearch=(data.content||[]).filter(b=>b.type==='web_search_tool_result').length;
    cost += nSearch*0.01; // estimation des frais de recherche web
    state.coach.costEstimate=(state.coach.costEstimate||0)+cost; state.coach.lastCost=cost;
    chat.push({ role:'assistant', content:text||'(réponse vide)', sources:sources.length?sources.slice(0,6):null });
    cv.updatedAt=isoToday();
    state._coachLoading=false; save(); render();
  }catch(e){
    chat.pop();
    state._coachDraft=q; state._coachLoading=false; save(); render();
    alert('La demande au coach a échoué :\n'+e.message);
  }
}

    else out.push("Charge bien équilibrée — continue sur ce rythme, c'est la régularité qui paie.");
  }
  const pr=runnerProfile();
  if(pr.hasData){
    const low=Object.entries(pr.axes).sort((a,b)=>a[1]-b[1])[0];
    const lab={endurance:'ton endurance',vitesse:'ta vitesse',cotes:'ton aisance en côte',technique:'ta technique de terrain',jambes:'ta robustesse'};
    const tip={endurance:'allonge progressivement une sortie par semaine',vitesse:'ajoute des lignes droites en accélération ou une courte séance de fractionné',cotes:'glisse du dénivelé sur tes sorties, quitte à marcher les montées',technique:'varie les terrains (sentier, chemin) pour gagner en aisance',jambes:'vise surtout la régularité, semaine après semaine'};
    if(low&&low[1]<45) out.push(`Ton profil est un peu en retrait sur ${lab[low[0]]} : pour l'étoffer, ${tip[low[0]]}.`);
  }
  const today=isoToday(), next=state.program.sessions.filter(s=>s.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];

function checkCoachTriggers(){
  if(state.coach.awakened) return;
  const today=isoToday();
  const upgrade=(state.coach.teaseSeen|0)>=1; // un tease déjà vu → on révèle l'action 0,0 km
  // Veut le coach : ≥ 3 messages au coach endormi (révélation directe)

  if(pokes>=3 && canNudge('wants',9999)){ fireNudge('wants','reveal',"Bon, bon… tu insistes vraiment ! Si tu veux que je me réveille pour de bon : enregistre une sortie de 0,0 km. C'est ma façon de revenir. *clin d'œil*"); return; }
  // Question technique au coach endormi (révélation directe)
  const lastUser=[...(state.coach.sleepyLog||[])].reverse().find(m=>m.role==='user');
  if(lastUser&&detectTechnicalTopic(lastUser.content)&&canNudge('technique',9999)){ fireNudge('technique','reveal',"Ça, c'est une vraie question de coach… et pour bien y répondre, il faut que je sois réveillé. Tente une sortie de 0,0 km. *bâille*"); return; }

  const runs7=state.journal.filter(r=>!isCharge(r)&&diffDays(r.date,today)>=0&&diffDays(r.date,today)<7).length;
  if(runs7>=7 && canNudge('beaucoup',14)){ if(upgrade){fireNudge('beaucoup','reveal',REVEAL_TEXT);} else {state.coach.teaseSeen=1; fireNudge('beaucoup','tease',"Dis donc, tu enchaînes les sorties en ce moment… *entrouvre un œil*. Tu veux un petit tips ?");} return; }

function ScreenProgramme(){
  if(!state.program.sessions.length) return emptyState('calendar','Aucun programme','Configure ton objectif pour générer un plan.','onboarding','Configurer');
  const today=isoToday(), view=state.settings.programView||'list', ss=state.program.sessions;
  const seg=`<div class="seg" style="margin-bottom:16px">
    <button class="${view==='list'?'on':''}" data-pview="list">${svg('journal',15)} Liste</button>
    <button class="${view==='calendar'?'on':''}" data-pview="calendar">${svg('calendar',15)} Calendrier</button></div>`;
  let body;
  if(view==='calendar'){
    body=`<div class="card">${calMonth(state._calYM||ymNow())}</div>${CAL_LEGEND}`;
  } else {
    // Ordre : AUJOURD'HUI en haut (ancre), puis à venir (le plus proche d'abord), puis historique.
    const rowOf=s=>{
      const past=s.date<today, done=logsForDate(s.date).length>0;
      const lab=new Date(s.date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
      const ic=done?'check':(past?'x':('t_'+(I['t_'+s.type]?s.type:'autre')));
      const fam=TYPE_FAM[s.type]||'off';
      const st=done?'style="background:transparent;color:var(--success)"':(past?'style="background:transparent;color:var(--danger)"':`style="background:var(--fam-${fam}-soft);color:var(--fam-${fam})"`);
      return `<div class="row" data-go="detail" data-id="${s.id}"><div class="ico-wrap" ${st}>${svg(ic,20)}</div>
        <div class="grow"><div class="r-title">${describeSession(s.type,s.target,s.structure,s.effort,s.elevationGainM)}</div>
        <div class="r-sub">${TYPE_LAB[s.type]} · ${sessionMeta(s)}</div></div><div class="r-day">${lab}</div></div>`;
    };
    const tod=ss.filter(s=>s.date===today);
    const fut=ss.filter(s=>s.date>today).sort((a,b)=>a.date.localeCompare(b.date)); // le plus proche d'abord
    const pst=ss.filter(s=>s.date<today).sort((a,b)=>b.date.localeCompare(a.date)); // le plus récent d'abord
    body=`<div id="prog-today" class="prog-anchor"></div>`;
    if(tod.length) body+=`<p class="lbl prog-sec">Aujourd'hui</p><div class="card">${tod.map(rowOf).join('')}</div>`;
    if(fut.length) body+=`<p class="lbl prog-sec">À venir</p><div class="card">${fut.map(rowOf).join('')}</div>`;
    if(pst.length) body+=`<p class="lbl prog-sec">Historique</p><div class="card">${pst.map(rowOf).join('')}</div>`;
    if(!fut.length&&!tod.length&&!pst.length) body=`<div class="card"><p class="muted" style="margin:0">Aucune séance.</p></div>`;
  }
  return `<div class="topbar"><h1 class="hero-title" style="margin:0">Programme</h1>${gear()}</div><p class="muted" style="margin:8px 0 16px;font-size:14px">Aujourd'hui en haut · à venir, puis historique en dessous</p>${seg}${body}<div style="height:8px"></div>`;
}

function ScreenDay(){
  const iso=state._selDate||isoToday(), today=isoToday();
  const planned=sessionForDate(iso), logs=logsForDate(iso);
  const runs=logs.filter(r=>!isCharge(r)), charges=logs.filter(isCharge);
  const d=new Date(iso+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const back=state._dayBack||'journal';
  let plannedCard='';
  if(planned){
    const status = runs.length ? `<span class="tag" style="color:var(--success);border-color:var(--success)">faite ✓</span>`
      : (iso<today ? `<span class="tag" style="color:var(--danger);border-color:var(--danger)">manquée</span>` : `<span class="tag">prévu</span>`);
    plannedCard=`<div class="card"><div class="sess-head">
      <div class="sess-type">${typeGlyph(planned.type,18)}<span>Séance prévue · ${TYPE_LAB[planned.type]}</span></div>${status}</div>
      <div class="sess-title" style="font-size:21px">${titleOf(planned)}</div><p class="sess-meta">${sessionMeta(planned)}</p>
      <button class="linkrow" data-go="detail" data-id="${planned.id}">Voir le détail ${svg('chevronR',14)}</button></div>`;
  }
  const logRows=runs.map(r=>{ const f=TYPE_FAM[r.type]||'off', ik='t_'+(I['t_'+r.type]?r.type:'autre');
    return `<div class="row" data-go="journalEntry" data-id="${r.id}">
      <div class="ico-wrap" style="background:var(--fam-${f}-soft);color:var(--fam-${f})">${svg(ik,20)}</div>
      <div class="grow"><div class="r-title">${r.distanceKm} km · ${fmtHMS(r.durationSec)}</div>
      <div class="r-sub">${TYPE_LAB[r.type]||r.type} · ${fmtPace(r.paceMinPerKm)} /km${r.elevationGainM?` · ${r.elevationGainM} m D+`:''}</div></div>
      <span class="muted">${svg('chevronR',16)}</span></div>`; }).join('');
  const chargeRows=charges.map(r=>`<div class="row" data-go="journalEntry" data-id="${r.id}">
      <div class="ico-wrap" style="background:var(--fam-off-soft);color:var(--fam-off)">${svg('t_autre',20)}</div>
      <div class="grow"><div class="r-title">${esc(r.source||'Charge ajoutée')} · ${entryLoad(r)} UA</div>
      <div class="r-sub">charge${r.durationMin?` · ${r.durationMin} min`:''}${r.rpe?` · ressenti ${r.rpe}/10`:''}</div></div>
      <span class="muted">${svg('chevronR',16)}</span></div>`).join('');
  const runCard = runs.length?`<div class="card"><p class="lbl">${runs.length>1?runs.length+' sorties réalisées':'Sortie réalisée'}</p>${logRows}</div>`:'';
  const chCard = charges.length?`<div class="card"><p class="lbl">${charges.length>1?charges.length+' charges ajoutées':'Charge ajoutée'}</p>${chargeRows}</div>`:'';
  const emptyCard = (!runs.length&&!charges.length)?`<div class="card"><p class="muted" style="margin:0;font-size:13.5px">Aucune sortie enregistrée ce jour.</p></div>`:'';
  return `<button class="back" data-go="${back}">${svg('chevronL',18)} Retour</button>
    <h1 class="hero-title" style="text-transform:capitalize">${d}</h1><div style="height:14px"></div>
    ${plannedCard}${plannedCard?'<div style="height:4px"></div>':''}${runCard}${chCard}${emptyCard}<div style="height:14px"></div>
    <div class="row2"><button class="btn btn-accent" data-go="record" data-date="${iso}">${svg('plus',18)} ${runs.length?'Autre sortie':'Enregistrer'}</button>
      <button class="btn" data-go="charge" data-date="${iso}">${svg('plus',18)} Charge</button></div>
    <div style="height:8px"></div>
    <button class="btn" data-go="planSession" data-date="${iso}">${svg('target',18)} Planifier une séance</button>`;
}

function weeklyVolumes(n){
  const m0=mondayOf(isoToday()), out=[];
  for(let i=n-1;i>=0;i--){
    const start=addDays(m0,-7*i), end=addDays(start,6);
    const logs=state.journal.filter(r=>r.date>=start&&r.date<=end);
    out.push({ start, km:logs.reduce((a,r)=>a+(r.distanceKm||0),0), dplus:logs.reduce((a,r)=>a+(r.elevationGainM||0),0) });
  }
  return out;
}
function volumeChart(){
  const data=weeklyVolumes(8), max=Math.max(10,...data.map(d=>d.km));
  const W=400, H=110, pad=4, bw=W/data.length;
  const bars=data.map((d,i)=>{
    const h=d.km>0?Math.max(3,(d.km/max)*(H-26)):0;
    const x=i*bw+pad, y=H-14-h, cur=i===data.length-1;
    const lab=new Date(d.start+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'});
    return `${h?`<rect x="${x}" y="${y}" width="${bw-pad*2}" height="${h}" rx="4" fill="${cur?'var(--accent)':'var(--line-strong)'}"/>
      <text x="${x+(bw-pad*2)/2}" y="${y-4}" text-anchor="middle" font-size="9.5" fill="${cur?'var(--accent)':'var(--muted)'}" font-weight="${cur?'600':'400'}">${Math.round(d.km)}</text>`:''}
      <text x="${x+(bw-pad*2)/2}" y="${H-2}" text-anchor="middle" font-size="8" fill="var(--faint)">${lab}</text>`;
  }).join('');
  const tot4=Math.round(data.slice(-4).reduce((a,d)=>a+d.km,0));
  const dplus4=Math.round(data.slice(-4).reduce((a,d)=>a+d.dplus,0));
  return `<div class="card"><p class="lbl">Volume hebdomadaire <span class="faint">(8 semaines · km)</span></p>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" aria-label="Volume par semaine">${bars}</svg>
    <p class="caption" style="margin-top:6px">4 dernières semaines : <b>${tot4} km</b>${dplus4?` · ${dplus4} m D+`:''}</p></div>`;
}

function ScreenJournal(){
  const hasLogs=state.journal.length>0;
  return `<div class="topbar"><h1 class="hero-title" style="margin:0">Journal</h1>${gear()}</div><p class="muted" style="margin:8px 0 16px;font-size:14px">Ton profil, ton calendrier et ton volume.</p>
    ${radarCard()}
    ${hasLogs?`<button class="linkbtn" data-go="stats" style="margin-top:12px">Toutes mes statistiques ${svg('chevronR',16)}</button>`:''}<div style="height:14px"></div>
    <div class="card">${calMonth(state._calYM||ymNow())}</div>${CAL_LEGEND}
    ${hasLogs?`<div style="height:14px"></div>${volumeChart()}`:''}
    <div style="height:14px"></div><button class="btn btn-accent" data-go="record">${svg('plus',19)} Enregistrer une séance</button>`;
}

function ScreenJournalEntry(){
  const r=state.journal.find(x=>x.id===state._selId);
  if(!r) return emptyState('journal','Séance introuvable','','journal','Retour');
  const d=new Date(r.date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  if(isCharge(r)){
    return `<button class="back" data-go="journal">${svg('chevronL',18)} Journal</button>
      <div class="card"><div class="sess-type" style="margin-bottom:8px"><span style="color:var(--accent);font-weight:700;font-size:19px">+</span><span>Charge · ${d}</span></div>
        <div class="sess-title" style="font-size:22px">${esc(r.source||'Charge ajoutée')}</div>
        <p class="sess-meta">${entryLoad(r)} UA${r.durationMin?` · ${r.durationMin} min`:''}${(r.distanceKm)?` · ${String(r.distanceKm).replace('.',',')} km`:''}${(r.elevationGainM)?` · ${r.elevationGainM} m D+`:''}${r.rpe?` · ressenti ${r.rpe}/10 (${RPE_LABELS[r.rpe]})`:''}</p></div>
      ${(r.avgHr||r.cadenceSpm)?`<div class="card">${r.avgHr?`<div class="settings-row"><span class="muted" style="font-size:13.5px">FC moyenne</span><span style="font-weight:500;font-size:14px">${r.avgHr} bpm</span></div>`:''}${r.cadenceSpm?`<div class="settings-row"><span class="muted" style="font-size:13.5px">Cadence moy.</span><span style="font-weight:500;font-size:14px">${r.cadenceSpm} ppm</span></div>`:''}${(()=>{const C=entryLoadChannels(r);return `<div class="settings-row"><span class="muted" style="font-size:13.5px">Charge souffle / impact</span><span style="font-weight:500;font-size:14px">${C.physio} / ${C.struct} UA</span></div>`;})()}</div>`:''}
      ${r.note?`<div class="card"><p class="lbl">Note</p><p style="margin:0;font-size:14px">${esc(r.note)}</p></div>`:''}
      ${r.notes?`<div class="card"><p class="lbl">Note</p><p style="margin:0;font-size:14px">${esc(r.notes)}</p></div>`:''}
      <div class="card"><p class="muted" style="margin:0;font-size:13.5px">Cette charge compte pour ta fatigue et ta récupération, pas pour ta progression spécifique course.</p></div>
      <div style="height:14px"></div>
      <button class="btn btn-danger" id="del">${svg('trash',18)} Supprimer</button>`;
  }
  const line=(l,v)=>v?`<div class="settings-row"><span class="muted" style="font-size:13.5px">${l}</span><span style="font-weight:500;font-size:14px">${v}</span></div>`:'';
  const stars=r.feeling?Array.from({length:5},(_,i)=>`<span style="color:${i<r.feeling?'var(--accent)':'var(--faint)'}">${svg('star',16,i<r.feeling?'currentColor':'none')}</span>`).join(''):'';
  // Comparaison prévu vs réalisé
  const plan = (r.linkedSessionId && state.program.sessions.find(s=>s.id===r.linkedSessionId)) || sessionForDate(r.date);
  let planCard='';
  if(plan){
    const dk=plan.target.distanceKm, delta=dk?Math.round((r.distanceKm-dk)*10)/10:null;
    const deltaTxt=delta===null?'':(delta===0?' — pile au plan':` (${delta>0?'+':''}${String(delta).replace('.',',')} km)`);
    const planPace=plan.pace?`${fmtPace(plan.pace.minPerKm[0])}–${fmtPace(plan.pace.minPerKm[1])} /km`:(plan.effort?`effort ${plan.effort}`:null);
    planCard=`<div class="card"><p class="lbl">Prévu ce jour-là</p>
      ${line('Séance', `${TYPE_LAB[plan.type]}${dk?` · ${dk} km`:''}${plan.target.durationMin?` · ${plan.target.durationMin} min`:''}`)}
      ${planPace?line('Allure cible', planPace):''}
      ${plan.elevationGainM?line('D+ visé', plan.elevationGainM+' m'):''}
      ${delta!==null?line('Écart distance', `${String(r.distanceKm).replace('.',',')} km réalisés${deltaTxt}`):''}
    </div>`;
  }
  // Le mot du Lièvre — généré localement (aucun appel API). Pour une analyse plus
  // poussée, l'usager peut ouvrir l'espace Coach (qui, lui, utilise la clé API).
  const note = r.coachNote || localCoachNote(r);
  const coachCard=`<div class="card coach"><div class="coach-head">${logoSvg(24)}<span>Le mot du Lièvre</span></div>
      <p class="coach-text">${esc(note)}</p>
      <button class="linkrow" data-go="coach" style="margin-top:10px">Approfondir avec le coach ${svg('chevronR',14)}</button></div>`;
  let segCard='';
  if(Array.isArray(r.segments) && r.segments.length){
    const rows=r.segments.map((s,i)=>{
      const bits=[]; if(s.distanceKm!=null) bits.push(String(s.distanceKm).replace('.',',')+' km');
      if(s.durationSec) bits.push(fmtMS(s.durationSec)); if(s.paceMinPerKm) bits.push(fmtPace(s.paceMinPerKm)+' /km');
      if(s.elevationGainM) bits.push(s.elevationGainM+' m D+');
      return `<div class="settings-row"><span class="muted" style="font-size:13.5px">Segment ${i+1}</span><span style="font-weight:500;font-size:14px">${bits.join(' · ')||'—'}</span></div>`;
    }).join('');
    segCard=`<div class="card"><p class="lbl">Répétitions / segments</p>${rows}
      <p class="caption" style="text-align:left;margin-top:8px">Le moteur a découpé la sortie : ces portions à l'intensité ${TYPE_LAB[r.type]}, le reste en footing facile.</p></div>`;
  }
  return `<button class="back" data-go="journal">${svg('chevronL',18)} Journal</button>
    <div class="card"><div class="sess-type" style="margin-bottom:8px">${typeGlyph(r.type,19)}<span>${TYPE_LAB[r.type]||'séance'} · ${d}</span></div>
      <div class="sess-title">${r.distanceKm} km · ${fmtHMS(r.durationSec)}</div>
      <p class="sess-meta">allure ${fmtPace(r.paceMinPerKm)} /km${r.elevationGainM?` · ${r.elevationGainM} m D+`:''} · ${DIFF[(r.difficulty||1)-1].toLowerCase()}</p></div>
    ${coachCard}
    ${planCard}
    ${segCard}
    <div class="card">
      ${line('Fréquence cardiaque moy.', r.avgHr?`${r.avgHr} bpm`:'')}
      ${line('VO₂ max', r.vo2?`${r.vo2}`:'')}
      ${line('Allure récup', r.paceRecovery?`${fmtPace(r.paceRecovery)} /km`:'')}
      ${line('Allure rapide', r.paceFast?`${fmtPace(r.paceFast)} /km`:'')}
      ${stars?`<div class="settings-row"><span class="muted" style="font-size:13.5px">Ressenti</span><span class="stars">${stars}</span></div>`:''}
      ${(r.tags&&r.tags.length)?`<div style="padding-top:12px"><p class="lbl">Conditions</p><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${r.tags.map(id=>TAG_BY_ID[id]?`<span class="chip on" style="cursor:default">${TAG_BY_ID[id].label}</span>`:'').join('')}</div></div>`:''}
      ${r.notes?`<div style="padding-top:12px"><p class="lbl">Notes</p><p style="margin:0;font-size:14px">${esc(r.notes)}</p></div>`:''}
      ${(()=>{const C=entryLoadChannels(r);return `<div class="settings-row" style="margin-top:8px"><span class="muted" style="font-size:13.5px">Charge souffle / impact</span><span style="font-weight:500;font-size:14px">${C.physio} / ${C.struct} UA</span></div>`;})()}
    </div><div style="height:14px"></div>
    <div class="row2"><button class="btn" data-go="record" data-edit="${r.id}">${svg('edit',18)} Modifier</button>
      <button class="btn btn-danger" id="del">${svg('trash',18)} Supprimer</button></div>`;
}

function ScreenDetail(){
  const s=state.program.sessions.find(x=>x.id===state._selId)||sessionForDate(isoToday());
  if(!s) return emptyState('run','Séance introuvable','','home','Retour');
  const d=new Date(s.date+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  let struct='';
  if(s.structure) struct=`<div class="card"><p class="lbl">Structure</p>
    <div class="row"><div class="grow"><div class="r-title">Échauffement</div><div class="r-sub">${s.structure.warmup} min facile</div></div></div>
    <div class="row"><div class="grow"><div class="r-title">${s.structure.reps.count} × ${s.structure.reps.distanceM} m</div><div class="r-sub">allure ${fmtPace(s.structure.reps.paceMinPerKm)} /km · récup ${s.structure.reps.recoveryMin} min</div></div></div>
    <div class="row"><div class="grow"><div class="r-title">Retour au calme</div><div class="r-sub">${s.structure.cooldown} min facile</div></div></div></div>`;
  return `<button class="back" data-go="programme">${svg('chevronL',18)} Programme</button>
    <div class="card"><div class="sess-type" style="margin-bottom:8px">${typeGlyph(s.type,19)}<span>${TYPE_LAB[s.type]} · ${d}</span></div>
      <div class="sess-title">${titleOf(s)}</div><p class="sess-meta">${sessionMeta(s)}</p>
      <p style="font-size:14px;margin:0">${s.description}</p></div>${struct}<div style="height:14px"></div>
    <button class="btn btn-accent" data-go="record" data-date="${s.date}">${svg('plus',19)} Enregistrer cette séance</button>
    ${s.elevationGainM>0?`<div style="height:8px"></div><button class="btn" id="noterrain" data-id="${s.id}">${svg('mountain',18)} Je n'ai pas ce dénivelé</button>`:''}
    <div style="height:8px"></div>
    <button class="btn btn-danger" id="delsession" data-id="${s.id}">${svg('trash',18)} Supprimer cette séance du programme</button>`;
}

function ScreenRecord(){
  const f=state._form, editing=!!state._editId, isInt=f.type==='intervals';
  const RECORD_TYPES=['easy','long','tempo','intervals','cotes'];
  const cross = f._imported && !isRunSport(f.sport);              // import hors course/trail
  const sportChips = f._imported ? Object.keys(SPORT).map(k=>`<button class="chip ${f.sport===k?'on':''}" data-sportk="${k}">${SPORT[k].lab}</button>`).join('') : '';
  const showSeg = !cross && ['tempo','intervals','cotes'].includes(f.type);
  if(!Array.isArray(f.segments)) f.segments=[];
  const pace = f.paceEdited ? f.paceMinPerKm : (f.durationSec>0&&f.distanceKm>0 ? (f.durationSec/60)/f.distanceKm : 0);
  const pm=Math.floor(pace||0), ps=Math.round(((pace||0)-pm)*60);
  const dH=Math.floor(f.durationSec/3600), dM=Math.floor((f.durationSec%3600)/60), dS=f.durationSec%60;
  const typeChips=RECORD_TYPES.map(t=>`<button class="chip ${f.type===t?'on':''}" data-type="${t}">${typeGlyph(t,16)}${TYPE_LAB[t][0].toUpperCase()+TYPE_LAB[t].slice(1)}</button>`).join('');
  // Étoiles : 5★ = très facile … 1★ = très dur (sens d'origine conservé). Plus de cases pleines = plus facile.
  const stars=Array.from({length:5},(_,i)=>`<button class="star ${f.feeling&&i<f.feeling?'on':''}" data-feel="${i+1}">${svg('star',26,f.feeling&&i<f.feeling?'currentColor':'none')}</button>`).join('');

  // --- Détail des segments / répétitions (tâche 4) : ouvert à la demande, sinon saisie simple ---
  const segRow=(s,i)=>`<div class="card" style="padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="lbl" style="margin:0">Segment ${i+1}</span>
        <button class="seg-del linkrow" data-si="${i}" style="color:var(--danger)">Retirer</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><p class="lbl" style="margin:0 0 4px">Distance <span class="faint">(km)</span></p>
          <input class="seg-in" data-sf="dist" data-si="${i}" inputmode="decimal" placeholder="—" value="${s.distanceKm!=null?String(s.distanceKm).replace('.',','):''}" /></div>
        <div><p class="lbl" style="margin:0 0 4px">D+ <span class="faint">(m)</span></p>
          <input class="seg-in" data-sf="dplus" data-si="${i}" inputmode="numeric" placeholder="0" value="${s.elevationGainM!=null?s.elevationGainM:''}" /></div>
        <div><p class="lbl" style="margin:0 0 4px">Temps <span class="faint">(m:ss)</span></p>
          <input class="seg-in" data-sf="temps" data-si="${i}" inputmode="text" placeholder="—" value="${s.durationSec?fmtMS(s.durationSec):''}" /></div>
        <div><p class="lbl" style="margin:0 0 4px">Allure <span class="faint">(/km)</span></p>
          <input class="seg-in" data-sf="allure" data-si="${i}" inputmode="text" placeholder="—" value="${s.paceMinPerKm?fmtPace(s.paceMinPerKm):''}" /></div>
      </div></div>`;
  const segOpen = !!f._segOpen || f.segments.length>0;
  const segBlock = showSeg ? `<div class="field">
      <button class="linkrow" id="segtog" style="font-weight:500">${svg(segOpen?'chevronDown':'chevronR',15)} Détail des répétitions / segments <span class="faint">(optionnel)</span></button>
      ${segOpen?`<p class="help" style="margin-top:8px">Renseigne <b>au moins 2</b> infos par segment (distance, D+, temps, allure) ; la 3ᵉ se déduit. Sans D+ → 0. Le moteur découpe la sortie : chaque segment compte à l'intensité ${TYPE_LAB[f.type]}, le reste en footing facile.</p>
        <div id="seglist">${f.segments.map(segRow).join('')}</div>
        <button class="btn" id="segadd" style="margin-top:4px">${svg('plus',16)} Ajouter un segment</button>`:''}
    </div>` : '';

  return `<button class="back" data-go="${editing?'journalEntry':'home'}" ${editing?`data-id="${state._editId}"`:''}>${svg('chevronL',18)} ${editing?'Séance':"Aujourd'hui"}</button>
    <h1 class="hero-title">${editing?'Modifier la séance':'Enregistrer une séance'}</h1><div style="height:8px"></div>

    ${editing?'':`<input type="file" id="fimport" accept=".gpx,.tcx,.fit,.gz" style="display:none" />
    <button class="btn" id="importbtn" style="margin-bottom:6px">${svg('plus',18)} Importer une activité (.gpx / .tcx / .fit)</button>
    <p class="caption" style="margin:0 0 14px">Un fichier, relu avant d'enregistrer. Pour tout ton historique d'un coup : <b data-go="import" style="text-decoration:underline">Réglages → Importer depuis Strava</b>.</p>`}

    ${f._imported?`<div class="field"><p class="lbl">Activité importée</p>
      <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px">${sportChips}</div>
      ${cross?`<p class="caption">Activité hors course : comptée pour ta <b>fatigue et ta récupération</b>, pas pour ta progression spécifique course.</p>`:`<p class="caption">Détectée comme course/trail : intégrée normalement à ta progression.</p>`}</div>`:''}

    <div class="field"><p class="lbl">Date</p><input type="date" id="fdate" value="${f.date}" /></div>
    ${cross?'':`<div class="field"><p class="lbl">Type</p><div class="chips">${typeChips}</div></div>`}

    <div class="field"><p class="lbl">Distance</p>
      <div class="slider-row"><input type="range" id="fdist" min="0" max="60" step="0.1" value="${f.distanceKm}" />
        <span class="readout" id="fdist-out">${f.distanceKm.toFixed(1).replace('.',',')} km</span></div></div>

    <div class="field"><p class="lbl">Durée</p>
      <div class="wheel3">${numCell('fdh',0,9,dH,'heures')}${numCell('fdm',0,59,dM,'minutes')}${numCell('fds',0,59,dS,'secondes')}</div></div>

    <div class="field"><p class="lbl">Allure <span class="faint">${f.paceEdited?'(ajustée)':'(calculée)'}</span></p>
      <div class="slider-row"><span class="readout" id="fpace-out" style="text-align:left;min-width:auto">${pace?fmtPace(pace):'—'} /km</span>
        <button class="chip" id="paceadj" style="margin-left:auto">${f.paceEdited?'Recalculer':'Ajuster'}</button></div>
      ${f.paceEdited?`<div class="wheel2" style="margin-top:10px">${numCell('fpm',2,12,pm,'minutes / km')}${numCell('fps',0,59,ps,'secondes')}</div>`:''}</div>

    <div class="field"><p class="lbl">Dénivelé positif (D+)</p>
      <div class="slider-row"><input type="range" id="fdplus" min="0" max="6000" step="10" value="${f.elevationGainM}" />
        <span class="readout" id="fdplus-out">${f.elevationGainM} m</span></div></div>

    ${segBlock}

    ${cross?'':`<div class="field"><p class="lbl">Difficulté ressentie du terrain</p>
      <input type="range" id="fdiff" min="1" max="5" step="1" value="${f.difficulty}" />
      <div class="caption" id="fdiff-out">Difficulté : <b>${DIFF[f.difficulty-1]}</b></div></div>`}

    ${cross?'':`<div class="field"><p class="lbl">Conditions de la sortie <span class="faint">(optionnel)</span></p>
      <div class="chips" style="display:flex;flex-wrap:wrap;gap:6px">${TAGS.map(t=>`<button class="chip ${f.tags&&f.tags.includes(t.id)?'on':''}" data-tag="${t.id}">${t.label}</button>`).join('')}</div>
      <p class="caption">Ce qui a changé la « vraie valeur » de la sortie (impact, souffle) — sans toucher au ressenti.</p></div>`}

    ${(isInt&&!cross)?`<div class="row2 field">
      <div><p class="lbl">Allure récup <span class="faint">(opt.)</span></p><div class="wheel2">${numCell('frcm',2,12,f.paceRecovery?Math.floor(f.paceRecovery):6,'minutes / km')}${numCell('frcs',0,59,f.paceRecovery?Math.round((f.paceRecovery%1)*60):0,'secondes')}</div></div>
      <div><p class="lbl">Allure rapide <span class="faint">(opt.)</span></p><div class="wheel2">${numCell('ffam',2,12,f.paceFast?Math.floor(f.paceFast):4,'minutes / km')}${numCell('ffas',0,59,f.paceFast?Math.round((f.paceFast%1)*60):0,'secondes')}</div></div></div>`:''}

    <div class="card" style="margin-bottom:18px"><p class="lbl">Optionnel</p>
      <div class="settings-row"><span style="font-size:14px">Fréquence cardiaque moy.</span>
        <button class="chip ${f.avgHr!==null?'on':''}" id="hrtog">${f.avgHr!==null?f.avgHr+' bpm':'Ajouter'}</button></div>
      ${f.avgHr!==null?`<div class="slider-row" style="padding:8px 0"><input type="range" id="fhr" min="90" max="210" step="1" value="${f.avgHr}" /><span class="readout" id="fhr-out" style="min-width:64px">${f.avgHr}</span></div>`:''}
      <div class="settings-row"><span style="font-size:14px">VO₂ max</span>
        <button class="chip ${f.vo2!==null?'on':''}" id="vo2tog">${f.vo2!==null?f.vo2:'Ajouter'}</button></div>
      ${f.vo2!==null?`<div class="slider-row" style="padding:8px 0"><input type="range" id="fvo2" min="25" max="85" step="1" value="${f.vo2}" /><span class="readout" id="fvo2-out" style="min-width:64px">${f.vo2}</span></div>`:''}
      <div class="settings-row"><span style="font-size:14px">Cadence moy.</span>
        <button class="chip ${f.cadence!=null?'on':''}" id="cadtog">${f.cadence!=null?f.cadence+' ppm':'Ajouter'}</button></div>
      ${f.cadence!=null?`<div class="slider-row" style="padding:8px 0"><input type="range" id="fcad" min="40" max="220" step="1" value="${f.cadence}" /><span class="readout" id="fcad-out" style="min-width:64px">${f.cadence}</span></div>`:''}
    </div>

    <div class="field"><p class="lbl">Ressenti de la séance</p>
      <div class="stars">${stars}</div>
      <p class="caption" style="text-align:left;margin-top:6px">À quel point c'était facile ? <b>1★ très dur</b> · <b>5★ très facile</b></p></div>
    <div class="field"><p class="lbl">Notes <span class="faint">(optionnel)</span></p>
      <input type="text" id="fnotes" placeholder="ex : jambes lourdes, grosse chaleur…" value="${(f.notes||'').replace(/"/g,'&quot;')}" /></div>

    <button class="btn btn-accent" id="fsave">${svg('check',19)} ${editing?'Enregistrer les modifications':'Enregistrer'}</button><div style="height:20px"></div>`;
}

function donateEligible(){
  const ai=(state.coach.conversations||[]).reduce((a,c)=>a+c.messages.filter(m=>m.role==='user').length,0);
  const sleepy=(state.coach.sleepyLog||[]).filter(m=>m.role==='user').length;
  return (ai+sleepy)>=5;
}
function gear(){ return `<button class="iconbtn" data-go="settings" aria-label="Réglages">${svg('settings',22)}</button>`; }
function resLink(label,url){
  return url ? `<a class="res-row" href="${url}" target="_blank" rel="noopener"><span>${label}</span><span class="res-ext">↗</span></a>`
             : `<div class="res-row off"><span>${label}</span><span class="res-soon">à venir</span></div>`;

/* Lien inline « Tes données & l'IA » — affiché au moment du consentement (clé API / Coach).
