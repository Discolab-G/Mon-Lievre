<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16323F" />
<title>Mon Lièvre</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('monlievre.state.v1') || '{}');
      var pref = (s.settings && s.settings.theme) || 'system';
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-ui: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-pill: 999px;
    --shadow: 0 6px 24px rgba(16,50,63,.08);
    --maxw: 460px;
  }
  html[data-theme='light'] {
    --bg: #F4EFE3; --surface: #FBF8F1; --surface-2: #EFE7D6;
    --text: #16323F; --muted: #6B7E88; --faint: #97A6AE;
    --line: #E5DECD; --line-strong: #D8CFBA;
    --accent: #E0792F; --accent-strong: #C9641E; --accent-soft: #FBE4D3;
    --on-accent: #FFF7EC; --navy: #16323F;
    --success: #1D9E75; --danger: #E24B4A;
    /* familles de séance : la couleur = le canal dominant (cf. point 5) */
    --fam-endu:#16323F; --fam-endu-soft:#E3E8EA; --fam-qual:var(--accent); --fam-qual-soft:var(--accent-soft);
    --fam-struct:#A8502C; --fam-struct-soft:#F4DFD2; --fam-recup:#5F7F62; --fam-recup-soft:#E4ECE3;
    --fam-off:#6B7E88; --fam-off-soft:#EBE9E0;
  }
  html[data-theme='dark'] {
    --bg: #0E242E; --surface: #16323F; --surface-2: #1E3A4C;
    --text: #F2ECDE; --muted: #A7BAC3; --faint: #87A0AC;
    --line: #294655; --line-strong: #335162;
    --accent: #F0954A; --accent-strong: #E0792F; --accent-soft: #2A3A40;
    --on-accent: #15252C; --navy: #0E242E;
    --success: #43B98C; --danger: #F0807F;
    --fam-endu:#7FB9E0; --fam-endu-soft:#1B3C50; --fam-qual:var(--accent); --fam-qual-soft:#3A2C1F;
    --fam-struct:#D9906A; --fam-struct-soft:#3B2B21; --fam-recup:#96BA9E; --fam-recup-soft:#21392B;
    --fam-off:#97A5AC; --fam-off-soft:#26353C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }
  .app { max-width: var(--maxw); margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column; position: relative; }
  .scroll { flex: 1; overflow-y: auto; padding: 18px 18px calc(96px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 500; letter-spacing: .2px; margin: 0; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .name { font-family: var(--font-display); font-size: 21px; font-weight: 500; }
  .iconbtn { width: 38px; height: 38px; border-radius: var(--r-pill); border: none; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s; }
  .iconbtn:hover { background: var(--surface-2); color: var(--text); }
  .iconbtn:active { transform: scale(.94); }
  .date { font-size: 13.5px; color: var(--muted); margin: 2px 0 16px; text-transform: capitalize; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 16px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .reveal { animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
  .reveal:nth-child(2){animation-delay:.05s} .reveal:nth-child(3){animation-delay:.1s}
  .reveal:nth-child(4){animation-delay:.15s} .reveal:nth-child(5){animation-delay:.2s}
  @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
  .screen-enter { animation: fade .22s ease both; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  .banner { display: flex; align-items: center; gap: 11px; background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: var(--r-md); padding: 12px 13px; margin-bottom: 16px; }
  html[data-theme='dark'] .banner { border-color: var(--line-strong); }
  .banner .ico { color: var(--accent); flex: 0 0 auto; }
  .banner p { margin: 0; font-size: 13px; line-height: 1.4; flex: 1; }

  .sess-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sess-type { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .sess-type .ico { color: var(--accent); }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 3px 10px; }
  .sess-title { font-family: var(--font-display); font-size: 27px; font-weight: 500; margin: 2px 0 4px; }
  .sess-meta { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .linkrow { display: inline-flex; align-items: center; gap: 4px; color: var(--accent);
    font-size: 13.5px; font-weight: 500; cursor: pointer; background: none; border: none; padding: 0; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-ui);
    font-size: 15px; font-weight: 500; border-radius: var(--r-md); padding: 13px 18px; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); width: 100%;
    transition: transform .12s, background .15s; }
  .btn:active { transform: scale(.985); }
  .btn-accent { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .btn-accent:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-danger { color: var(--danger); border-color: var(--line-strong); background: var(--surface); }
  .btn-block-note { text-align: center; font-size: 11.5px; color: var(--faint); margin: 6px 0 0; }

  .lbl { font-size: 12px; color: var(--muted); margin: 0 0 9px; letter-spacing: .3px; }
  .lbl b { color: var(--text); font-weight: 500; }
  .help { font-size: 12px; color: var(--muted); margin: -2px 0 9px; line-height: 1.4; }
  .caption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
  .caption b { color: var(--accent); font-weight: 500; }

  .week { display: flex; justify-content: space-between; margin-bottom: 11px; }
  .day { text-align: center; }
  .day .dot { width: 34px; height: 34px; border-radius: var(--r-pill); display: grid; place-items: center;
    border: 1px solid var(--line); background: var(--surface); color: var(--faint); font-size: 13px; margin: 0 auto; }
  .day.today .dot { background: var(--accent); color: var(--on-accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .day .lab { font-size: 10px; color: var(--muted); margin-top: 4px; }
  .day.today .lab { color: var(--accent); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend .sw { display: inline-flex; align-items: center; gap: 4px; }

  .field { margin-bottom: 18px; }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px; gap: 2px; }
  .seg button { flex: 1; border: none; background: transparent; color: var(--muted); font-family: var(--font-ui);
    font-size: 13px; font-weight: 500; padding: 10px 4px; border-radius: 10px; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; transition: background .15s, color .15s; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--r-pill);
    padding: 8px 14px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s; }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip.auto { border-style: dashed; }
  .chip.auto.on { background: var(--navy); color: #FFF7EC; border-color: var(--navy); border-style: solid; }
  .days { display: flex; justify-content: space-between; gap: 6px; }
  .dchip { flex: 1; aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: var(--r-pill); font-size: 13px; cursor: pointer; transition: background .15s, color .15s; }
  .dchip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .slider-row { display: flex; align-items: center; gap: 14px; }
  .readout { font-family: var(--font-display); font-size: 21px; font-weight: 500; min-width: 78px; text-align: right; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: var(--r-pill); background: var(--line-strong); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 4px solid var(--bg); cursor: pointer; }
  select, input[type=date], input[type=password], input[type=text], input[type=number] {
    font-family: var(--font-ui); font-size: 14px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-md); padding: 11px 12px; width: 100%; }
  /* Champs numériques : clavier au tap, aucune flèche (ni caret de menu, ni spinner haut/bas). */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .wheel3 input[type=number], .wheel2 input[type=number] { text-align: center; padding-left: 6px; padding-right: 6px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wheel3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .wheel2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stars { display: flex; gap: 8px; }
  .star { background: none; border: none; cursor: pointer; color: var(--faint); padding: 2px; transition: transform .1s; }
  .star.on { color: var(--accent); }
  .star:active { transform: scale(.9); }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row .ico-wrap { width: 38px; height: 38px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: 0 0 auto; }
  html[data-theme='dark'] .row .ico-wrap { background: var(--surface-2); }
  .row .grow { flex: 1; min-width: 0; }
  .row .r-title { font-size: 15px; font-weight: 500; }
  .row .r-sub { font-size: 12.5px; color: var(--muted); }
  .row .r-day { font-size: 12px; color: var(--faint); text-align: right; white-space: nowrap; }

  .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
  .empty .ico { color: var(--faint); margin-bottom: 10px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); gap: 12px; }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .grow { flex: 1; min-width: 0; cursor: pointer; }

  /* calendrier journal */
  .calhead, .calrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calhead div { text-align: center; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .calrow { margin-bottom: 6px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 2px; }
  .cell .cnum { font-size: 9px; color: var(--faint); line-height: 1; }
  .cell .cmk { font-family: var(--font-display); font-size: 16px; font-weight: 500; line-height: 1; }
  .cell .chill { color: var(--accent); margin-top: 1px; }
  .cell.done { background: var(--accent); border-color: var(--accent); }
  .cell.done .cnum { color: var(--on-accent); opacity: .8; }
  .cell.done .cmk, .cell.done .chill { color: var(--on-accent); }
  .cell.plan .cmk { color: var(--muted); }
  .cell.miss .cmk { color: var(--danger); font-size: 13px; }
  .cell.today { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent); }
  .cell.empty .cmk { color: var(--faint); font-size: 11px; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--maxw);
    background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
  .tab { flex: 1; background: none; border: none; color: var(--faint); display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-family: var(--font-ui); font-size: 10.5px; cursor: pointer; padding: 4px; transition: color .15s; }
  .tab.on { color: var(--accent); } .tab:active { transform: scale(.96); }

  .hero-title { font-size: 24px; margin-bottom: 4px; }
  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted);
    font-family: var(--font-ui); font-size: 14px; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .overlay{ position:fixed; inset:0; background:rgba(14,36,46,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .overlay-box{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 30px; text-align:center; max-width:300px; box-shadow:var(--shadow); }
  .overlay-box p{ margin:14px 0 0; font-size:14px; color:var(--text); }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--accent); margin:0 auto; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Le mot du Lièvre */
  .card.coach{ background:var(--accent-soft); border-color:var(--accent); }
  html[data-theme='dark'] .card.coach{ border-color:var(--line-strong); }
  .coach-head{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:15px; font-weight:500; margin-bottom:8px; }
  .coach-text{ margin:0; font-size:14px; line-height:1.55; }
  .dots::after{ content:'…'; animation:dots 1.2s steps(4,end) infinite; }
  @keyframes dots{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'…'} }

  /* Stats hebdo (accueil) */
  .wkstats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:2px 0 12px; }
  .wkstats > div{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:9px 6px; text-align:center; }
  .wkstats .wkv{ display:block; font-family:var(--font-display); font-size:19px; font-weight:500; }
  .wkstats .wku{ display:block; font-size:10.5px; color:var(--muted); margin-top:1px; }

  /* Sections liste programme */
  .prog-sec{ margin:16px 0 8px; }
  .prog-sec:first-child{ margin-top:0; }
  .prog-anchor{ height:1px; }

  /* Espace Coach (chat) */
  .chat{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .bubble{ max-width:88%; padding:11px 13px; border-radius:16px; font-size:14px; line-height:1.5; word-wrap:break-word; }
  .bubble.user{ align-self:flex-end; background:var(--accent); color:var(--on-accent); border-bottom-right-radius:5px; }
  .bubble.coach{ align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px; }
  .chat-input{ display:flex; gap:8px; align-items:flex-end; margin-top:14px; }
  .chat-input textarea{ flex:1; resize:none; overflow-y:auto; font-family:var(--font-ui); font-size:14px; color:var(--text);
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 13px; line-height:1.4; }
  .send-btn{ width:46px; height:46px; flex:0 0 auto; border-radius:var(--r-md); border:none; background:var(--accent);
    color:var(--on-accent); display:grid; place-items:center; cursor:pointer; transition:transform .12s, background .15s; }
  .send-btn:hover{ background:var(--accent-strong); } .send-btn:active{ transform:scale(.95); }
  .send-btn:disabled{ opacity:.45; cursor:default; }

  /* Carte Forme (moteur de charge) */
  .forme-head{ display:flex; align-items:center; gap:8px; }
  .forme-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .forme-label{ font-weight:600; font-size:14.5px; }
  .forme-advice{ margin:7px 0 0; font-size:13px; color:var(--muted); line-height:1.5; }
  .forme-read{ margin:6px 0 0; font-size:13.5px; color:var(--text); }
  .forme-scale{ display:flex; justify-content:space-between; margin-top:3px; font-size:10.5px; color:var(--faint); }

  /* Cartes « Ajouter une charge » */
  .chargecards{ display:flex; flex-direction:column; gap:8px; }
  .chargecard{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:12px 14px; padding-right:64px; cursor:pointer; position:relative; transition:border-color .12s, background .12s; }
  .chargecard.on{ border-color:var(--accent); background:var(--accent-soft); }
  .chargecard .cc-main{ font-weight:500; font-size:14.5px; }
  .chargecard .cc-sub{ font-size:12.5px; color:var(--muted); margin-top:1px; }
  .chargecard .cc-load{ position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:12.5px; color:var(--accent); font-weight:600; }
  .cell.charge{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

  /* Profil du coureur (radar) */
  .profil-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .profil-title{ font-weight:600; font-size:14.5px; }
  .profil-niveau{ font-size:12.5px; font-weight:600; color:var(--accent); background:var(--accent-soft);
    border:1px solid var(--accent); border-radius:999px; padding:3px 11px; }

  /* Coach — 3 états, réveil, sources, toggle */
  .coach.asleep{ opacity:.92; }
  .coach.asleep .coach-head span:first-of-type{ color:var(--muted); }
  .zzz-mini{ margin-left:auto; font-size:13px; color:var(--faint); letter-spacing:2px; font-style:italic; animation:zzz 2.4s ease-in-out infinite; }
  @keyframes zzz{ 0%,100%{opacity:.35;transform:translateY(0)} 50%{opacity:.9;transform:translateY(-2px)} }
  .bubble.hintbubble{ border:1px dashed var(--accent); background:var(--accent-soft); color:var(--text); }
  .coach.byok{ border-color:var(--accent); }
  .advice-line{ margin:0 0 9px; font-size:13.5px; line-height:1.55; color:var(--text); }
  .advice-line:last-child{ margin-bottom:0; }
  .sources{ margin-top:7px; padding-top:6px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  .sources a{ color:var(--muted); }
  .web-on{ color:var(--accent); margin-left:6px; }
  .card.info{ border-color:var(--accent); background:var(--accent-soft); }
  .link-row{ display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; }
  .link-row a{ font-size:13px; color:var(--accent); font-weight:600; text-decoration:none; }
  .toggle{ width:46px; height:27px; border-radius:999px; background:var(--line-strong); border:none; position:relative; cursor:pointer; flex:0 0 auto; transition:background .15s; }
  .toggle.on{ background:var(--accent); }
  .toggle .knob{ position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; transition:left .15s; }
  .toggle.on .knob{ left:22px; }
  .tab-dot{ position:absolute; top:-3px; right:-5px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--surface); }

  /* Animation de réveil du Lièvre */
  .wake-stage{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:62vh; text-align:center; }
  .wake-hare{ animation:wake-pop .9s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes wake-pop{ 0%{transform:scale(.4) rotate(-8deg);opacity:0} 60%{transform:scale(1.12) rotate(3deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
  .wake-zzz{ margin-top:10px; font-size:18px; letter-spacing:4px; color:var(--faint); font-style:italic; animation:wake-fade 1.4s ease-out forwards; }
  @keyframes wake-fade{ 0%{opacity:.8;transform:translateY(0)} 100%{opacity:0;transform:translateY(-18px)} }
  .wake-title{ margin:14px 0 4px; font-family:var(--font-display); font-size:25px; color:var(--navy); opacity:0; animation:wake-in .5s ease-out .5s forwards; }
  .wake-sub{ margin:0; color:var(--muted); font-size:14.5px; opacity:0; animation:wake-in .5s ease-out .8s forwards; }
  @keyframes wake-in{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* Boutons d'aide « ? » + explications inline */
  .help-q{ display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%;
    border:1px solid var(--line-strong); background:transparent; color:var(--muted); font-size:11px; font-weight:700; line-height:1; cursor:pointer; vertical-align:middle; }
  .forme-head .help-q{ margin-left:auto; }
  .help-expl{ margin:9px 0 0; padding-top:9px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--muted); line-height:1.55; }

  /* Écran d'accueil (intro) */
  .intro{ padding:18px 0 0; }
  .intro-hero{ text-align:center; margin:10px 0 18px; }
  .intro-name{ font-family:var(--font-display); font-size:34px; color:var(--navy); margin:10px 0 2px; }
  .intro-sub{ color:var(--accent); font-style:italic; font-size:15px; margin:0; }
  .intro-lead{ margin:0; font-size:14.5px; line-height:1.6; color:var(--text); }
  .intro-points{ margin:14px 0 18px; display:flex; flex-direction:column; gap:12px; }
  .intro-point{ display:flex; gap:13px; align-items:flex-start; }
  .ip-ico{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; }
  .ip-title{ font-weight:600; font-size:14.5px; color:var(--text); }
  .ip-text{ font-size:13px; color:var(--muted); line-height:1.5; margin-top:1px; }

  /* Écran d'aide */
  .help-sec .help-head{ display:flex; align-items:center; gap:9px; color:var(--navy); font-weight:600; font-size:15px; margin-bottom:6px; }
  .help-sec .help-head svg{ color:var(--accent); }
  .help-sec .advice-line{ color:var(--muted); }

  /* Carte de don */
  .card.donate{ border-color:var(--accent); }
  .donate-btn{ margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }

  /* Calendrier mensuel navigable */
  .calnav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calnav-lab{ font-weight:600; font-size:15px; color:var(--navy); }
  .cell.dim{ opacity:.34; }

  /* Conversations du coach */
  .conv-current{ margin:2px 0 0; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:210px; }
  .conv-row.on{ background:var(--accent-soft); border-radius:var(--r-md); }
  .conv-row .grow{ cursor:pointer; }
  .iconbtn{ position:relative; }
  .conv-badge{ position:absolute; top:-3px; right:-3px; background:var(--accent); color:#fff; font-size:9px; font-weight:700; min-width:14px; height:14px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0 3px; box-sizing:border-box; }

  /* Ressources & liens */
  .res-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--text); font-size:14px; }
  .res-row:last-of-type{ border-bottom:none; }
  .res-row.off{ color:var(--muted); }
  .res-ext{ color:var(--accent); font-weight:700; }
  .res-soon{ font-size:11px; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }

  /* Lisibilité en thème sombre : éléments en navy (invisibles sur fond sombre) + calendrier */
  html[data-theme='dark'] .calnav-lab,
  html[data-theme='dark'] .wake-title,
  html[data-theme='dark'] .intro-name { color: var(--text); }
  html[data-theme='dark'] .help-sec .help-head { color: var(--accent); }
  html[data-theme='dark'] .cell .cnum { color: var(--muted); }
  html[data-theme='dark'] .calhead div { color: var(--text); }
  html[data-theme='dark'] .caption, html[data-theme='dark'] .help { color: var(--muted); }
  .linkbtn { display:flex; align-items:center; justify-content:space-between; width:100%; gap:8px;
    padding:12px 15px; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface);
    color:var(--accent); font-weight:600; font-size:14px; font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .linkbtn:active { background:var(--line-strong); }

  /* Hub de configuration : tuiles + écrans de catégorie (blocs par question) */
  .onb-tiles{ display:flex; flex-direction:column; gap:12px; margin:6px 0 18px; }
  .onb-tile{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:15px 16px; box-shadow:var(--shadow);
    cursor:pointer; font-family:inherit; color:inherit; transition:border-color .15s, transform .12s, background .15s; }
  .onb-tile:hover{ border-color:var(--line-strong); }
  .onb-tile:active{ transform:scale(.99); }
  .onb-tile .ot-ico{ flex:0 0 auto; width:42px; height:42px; border-radius:var(--r-md); background:var(--accent-soft);
    color:var(--accent); display:grid; place-items:center; }
  html[data-theme='dark'] .onb-tile .ot-ico{ background:var(--surface-2); }
  .onb-tile .ot-grow{ flex:1; min-width:0; }
  .onb-tile .ot-title{ display:block; font-weight:600; font-size:15.5px; }
  .onb-tile .ot-sum{ display:block; font-size:12.5px; color:var(--muted); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qcat .field{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:14px 14px 16px; margin-bottom:12px; }
  .qcat .field:last-child{ margin-bottom:0; }
  .qcat .field > .lbl:first-child{ margin-top:0; }
  .cpic{ display:inline-flex; line-height:0; vertical-align:-3px; }
  .chip .cpic{ margin-right:6px; }
</style>

const I = {

  t_rest:'<path d="M20.2 13.4A8.4 8.4 0 1 1 10.6 3.8a6.6 6.6 0 0 0 9.6 9.6z"/>',

  hub_cadre:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="15" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="13" cy="17" r="2" fill="currentColor" stroke="none"/>',

  hub_imp:'<path d="M12 4v9M8.5 9.5L12 13l3.5-3.5"/><path d="M4.5 16.5V18a2.5 2.5 0 0 0 2.5 2.5h10A2.5 2.5 0 0 0 19.5 18v-1.5"/>'
};
function svg(name, size = 22, fill) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill||'none'}" stroke="currentColor"
    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[name]||''}</svg>`;
}
function logoSvg(size = 30) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs><clipPath id="sun"><circle cx="50" cy="48" r="40"/></clipPath></defs>

      <rect x="10" y="8" width="80" height="80" fill="#E0792F"/><rect x="10" y="8" width="80" height="14" fill="#F0A35C"/>
      <rect x="10" y="22" width="80" height="9" fill="#E88B3F"/><rect x="10" y="58" width="80" height="30" fill="#EFA94F"/>
      <path d="M10 70 L30 52 L46 66 L58 56 L90 78 L90 90 L10 90Z" fill="#3C5A6B"/></g>
    <ellipse cx="46" cy="60" rx="14" ry="17" fill="#16323F"/><circle cx="56" cy="47" r="8.5" fill="#16323F"/>
    <ellipse cx="54" cy="32" rx="3.2" ry="11" fill="#16323F" transform="rotate(-10 54 32)"/>
    <ellipse cx="61" cy="33" rx="3.2" ry="11" fill="#16323F" transform="rotate(10 61 33)"/>
    <ellipse cx="51" cy="69" rx="6.5" ry="4.5" fill="#16323F"/><circle cx="33" cy="63" r="3.2" fill="#16323F"/></svg>`;
}

// Lien de don (PayPal) — laisse vide pour ne pas afficher de bouton don,
// ou mets ton lien PayPal.me (ex. https://www.paypal.me/TonPseudo) pour l'activer.
const DONATE_URL = '';
// Documentation en ligne (optionnelle) — laisse vide pour n'afficher que l'aide intégrée,
// ou mets l'URL de ta doc (ex. ta page GitHub Pages) pour ajouter un lien « En savoir plus ».
const DOCS_URL = '';
// Document « Tes données & l'IA » (transparence sur ce qui est transmis à l'API Claude).
// À RENSEIGNER avant publication : URL en ligne, OU page intégrée au déploiement web (Google Play).
// Tant que c'est vide, le bouton s'affiche en « à venir » — le code est prêt, il ne reste qu'à brancher la cible.
const PRIVACY_URL = 'privacy.html';

// Valeurs représentatives de D+/km par profil de terrain (m de D+ par km), pour migrer
// l'ancien sélecteur plat/vallonné/montagneux. Bandes : plat ≤100 · vallonné ≤300 · montagne >300.
const TERRAIN_DPLUS_PER_KM = { plat:100, vallonne:300, montagne:400 };
// Plafond DUR de D+/km en séance normale (hors séances de côtes, qui font exception), calibrable.
const DPLUS_PER_KM_CEILING = 500;

const DEFAULT_STATE = {
  route: 'intro', onboarded: false,
  objective: { mode: 'dated', distanceKm: 10, elevationGainM: 0, difficulty: 1, date: '', timeSec: null, focus: 'endurance', rhythm: 'standard', maintain: false, achieved: false,
    constraints: { weeklyHours: null, weeklyKmCap: null, maxSessionMin: null, sessionsMode: 'libre', sessionsMax: null } },
  profile: { weeklyVolumeKm: 25, days: ['mon','wed','sat'], longRunDay: 'sat', refDistanceKm: 5, refTimeSec: 1500, easyPaceSec: 360,
             vmaKmh: null, hrRest: null, hrMax: null, weightKg: null, heightCm: null, age: null, crossTrainHours: null, terrainAccess: null, dplusMaxPerRun: null, dplusMaxPerKm: null },
  program: { sessions: [] }, journal: [],
  coach: { conversations: [], activeId: null, awakened: false, sleepyLog: [], nudges: { log: {} }, hint: null, costEstimate: 0 },
  settings: { theme: 'system', apiKey: '', programView: 'calendar', model: 'claude-sonnet-4-6', webSearch: false }
};
let state = load();
let importFiles = []; // fichiers en attente d'import (objets File, non sérialisables → hors state)
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    const s = Object.assign(structuredClone(DEFAULT_STATE), raw, {
      objective: Object.assign({}, DEFAULT_STATE.objective, raw.objective),
      profile: Object.assign({}, DEFAULT_STATE.profile, raw.profile),
      coach: Object.assign({}, DEFAULT_STATE.coach, raw.coach),
      settings: Object.assign({}, DEFAULT_STATE.settings, raw.settings)
    });
    s.objective.constraints = Object.assign({}, DEFAULT_STATE.objective.constraints, raw.objective && raw.objective.constraints);
    // Migration terrain : ancien sélecteur (plat/vallonné/montagneux) → plafond D+/km accessible.
    if(s.profile.dplusMaxPerKm==null && s.profile.terrainAccess && TERRAIN_DPLUS_PER_KM[s.profile.terrainAccess]!=null)
      s.profile.dplusMaxPerKm = TERRAIN_DPLUS_PER_KM[s.profile.terrainAccess];
    delete s._coachLoading; delete s._noteLoading; delete s._anchorToday; delete s._wake; delete s._coachInfo; delete s._helpForme; delete s._helpRadar; delete s._helpCharge; delete s._coachList; delete s._calYM; delete s._foldObj; delete s._foldNiveau; delete s._openAlloue; delete s._statQ; delete s._statPeriod; delete s._statMetric; delete s._bulkBusy; delete s._onbStep; delete s._importBack; // transitoires : jamais restaurées
    // Migration : ancien fil unique (coach.messages) → liste de conversations.
    const c=s.coach; if(!Array.isArray(c.conversations)) c.conversations=[];
    if(Array.isArray(c.messages) && c.messages.length){ c.conversations.unshift({ id:'cv_'+Date.now(), title:convTitle(c.messages), messages:c.messages, updatedAt:isoToday() }); }
    delete c.messages;
    if(c.activeId && !c.conversations.some(cv=>cv.id===c.activeId)) c.activeId=c.conversations.length?c.conversations[0].id:null;
    if (s.route === 'record' && !s._form) s.route = 'home';
    if (s.route === 'charge' && !s._charge) s.route = 'home';
    if (s.route === 'planSession' && !s._plan) s.route = 'home';
    // Migration : imports anciens classés "course" par erreur (fichier sans type de sport, avant le fix du repli)
    // mais à allure impossible pour de la course à pied (> ~22 km/h) → reclassés en charge (vélo/kite, etc.).
    (s.journal||[]).forEach(r=>{
      if(r && r.imported && r.kind!=='autre' && isRunSport(r.sport) && r.paceMinPerKm>0 && r.paceMinPerKm<2.75){
        r.kind='autre'; r.type='charge'; if(r.structFactor==null) r.structFactor=0.2; r.source=r.source||'Activité importée';
      }
    });
    return s;
  } catch (e) { return structuredClone(DEFAULT_STATE); }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_LAB = { mon:'L', tue:'M', wed:'M', thu:'J', fri:'V', sat:'S', sun:'D' };
const DAY_FULL = { mon:'lundi', tue:'mardi', wed:'mercredi', thu:'jeudi', fri:'vendredi', sat:'samedi', sun:'dimanche' };
const DIFF = ['Facile','Moyen','Difficile','Très difficile','Extrême'];
const TYPE_LAB = { easy:'footing', long:'sortie longue', tempo:'tempo', intervals:'fractionné', recovery:'récupération', rest:'repos', autre:'autre', charge:'charge', cotes:'côtes', renfo:'renforcement', rando:'rando-course' };
// Famille visuelle par type : la couleur raconte le canal dominant (endurance / qualité physio / structurel / récup / repos-hors course).
const TYPE_FAM = { easy:'endu', long:'endu', tempo:'qual', intervals:'qual', cotes:'struct', renfo:'struct', rando:'struct', recovery:'recup', rest:'off', autre:'off', charge:'off' };
function typeGlyph(type,size=16){ const t=I['t_'+type]?type:'autre'; return `<span class="cpic" style="color:var(--fam-${TYPE_FAM[t]||'off'})">${svg('t_'+t,size)}</span>`; }
const TYPES = ['easy','long','tempo','intervals'];
const RPE_LABELS = {1:'très très facile',2:'très facile',3:'facile',4:'modéré',5:'soutenu',6:'assez dur',7:'dur',8:'très dur',9:'presque maximal',10:'maximal'};

/* Dates : formatage en HEURE LOCALE (jamais toISOString, qui convertit en UTC
   et décale d'un jour en France — c'était la cause du calendrier qui dérivait). */
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoToday(){ return toISO(new Date()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return toISO(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dayKeyOf(iso){ const wd=new Date(iso+'T00:00:00').getDay(); return DAY_KEYS[(wd+6)%7]; }
function mondayOf(iso){ return addDays(iso, -DAY_KEYS.indexOf(dayKeyOf(iso))); }
function fmtDateLong(d=new Date()){ return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); }
function fmtPace(m){ const a=Math.floor(m), s=Math.round((m-a)*60); return `${a}:${String(s).padStart(2,'0')}`; }
function fmtMS(sec){ const m=Math.floor(sec/60), s=Math.round(sec%60); return `${m}:${String(s).padStart(2,'0')}`; }
function parseMS(str){ if(str==null) return null; const t=String(str).trim(); if(!t) return null;
  if(t.includes(':')){ const [a,b]=t.split(':'); const m=parseInt(a), s=parseInt(b); if(isNaN(m)||isNaN(b===''?0:s)) return null; return m*60+(isNaN(s)?0:s); }
  const v=parseFloat(t.replace(',','.')); return isNaN(v)?null:Math.round(v*60); } // nombre seul = minutes
function fmtHMS(sec){ const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; }
function sessionForDate(iso){ return state.program.sessions.find(s=>s.date===iso); }
function logForDate(iso){ return state.journal.find(r=>r.date===iso); }
function logsForDate(iso){ return state.journal.filter(r=>r.date===iso).sort((a,b)=>(a.id>b.id?1:-1)); }
function numCell(id,min,max,val,aria){ return `<input type="number" inputmode="numeric" id="${id}" min="${min}" max="${max}" value="${val}"${aria?` aria-label="${aria}"`:''} />`; }
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

/* ===== Moteur de charge — V2 phase 1 =====
   Monnaie unique : sRPE (effort 1–10 × minutes) en unités de charge (UA).
   Deux fenêtres : fatigue (aiguë, ~7 j) et tolérance (chronique, ~28 j),
   en moyennes mobiles exponentielles. Fraîcheur = tolérance − fatigue. */
const CHARGE_PRESETS = [
  { id:'foot',     label:'Footing tranquille',       sub:'~45 min facile',                     load:250 },
  { id:'tempo',    label:'Séance soutenue / tempo',   sub:'~1 h avec de l\u2019intensité',       load:500 },
  { id:'long',     label:'Grosse sortie longue',      sub:'2 h ou plus',                        load:800 },
  { id:'physique', label:'Journée physique',          sub:'travail, déménagement…',             load:600 },
  { id:'pleinair', label:'Grosse session plein air',  sub:'kite, VTT, rando… plusieurs heures', load:900 },
];
const RPE_BY_TYPE = { recovery:3, easy:4, long:5, tempo:7, intervals:8, cotes:7, charge:5, autre:5 };
/* Impact d'une charge sur le canal STRUCTUREL (usure articulaire). Le souffle n'est pas affecté.
   Faible : porté / peu d'impact (vélo, natation, kite, rameur). Fort : avec chocs (rando descendante, sport co). */
const CHARGE_IMPACT = { faible:0.15, modere:0.5, fort:1.0 };
const CHARGE_IMPACT_LAB = { faible:'Faible', modere:'Modéré', fort:'Fort' };
/* Coefficients par sport (points de départ à calibrer).
   - run        : course/trail → pipeline course complet (radar, VMA, allure…).
   - rpe        : intensité-type pour la sRPE quand il n'y a ni FC ni puissance.
   - impact     : facteur du canal STRUCTUREL (course = 1,00 réf). C'est le seul vrai dial inter-sport.
   - dplusScale : part du coût aérobie du D+ retenue côté SOUFFLE (course = 1,0).
   Le canal SOUFFLE reste quasi agnostique au sport : FC→TRIMP si dispo, sinon rpe×durée.
   Le transfert vers la fatigue course est à 100 % (la fatigue reste de la fatigue) ; la
   spécificité est gérée par l'exclusion des métriques course, pas par un rabais de charge. */
const SPORT = {
  course:   { lab:'Course',          run:true,  rpe:5, impact:1.00, dplusScale:1.0 },
  trail:    { lab:'Trail',           run:true,  rpe:5, impact:1.00, dplusScale:1.0 },
  marche:   { lab:'Marche / rando',  run:false, rpe:3, impact:0.55, dplusScale:0.8 },
  velo:     { lab:'Vélo / VTT',      run:false, rpe:4, impact:0.12, dplusScale:0.4 },
  natation: { lab:'Natation',        run:false, rpe:5, impact:0.05, dplusScale:0.0 },
  rameur:   { lab:'Rameur',          run:false, rpe:5, impact:0.30, dplusScale:0.0 },
  kite:     { lab:'Kite / wing',     run:false, rpe:4, impact:0.40, dplusScale:0.0 },
  ski:      { lab:'Ski / ski-rando', run:false, rpe:5, impact:0.50, dplusScale:0.7 },
  renfo:    { lab:'Renfo / muscu',   run:false, rpe:5, impact:1.00, dplusScale:0.0 },
  autre:    { lab:'Autre',           run:false, rpe:4, impact:0.15, dplusScale:0.0 }, // sport inconnu : impact volontairement faible
};
function sportInfo(s){ return SPORT[s] || SPORT.autre; }
function isRunSport(s){ return s ? !!(SPORT[s] && SPORT[s].run) : true; } // sans sport = course (compat)
/* Effort fourni (étoiles, 5★ = très facile … 1★ = très dur) → sRPE 1–10, sens inverse.
   5★→2 (footing tranquille), 3★→6 (modéré), 1★→10 (effort maximal). */
function feelingToRpe(f){ return (f>=1&&f<=5) ? (6-f)*2 : null; }
/* Poids du dénivelé dans la charge (cf. demande : ~+40% vs la base physiologique neutre).
   Avant, le D+ ne pesait dans la charge que via les tags ; il pèse désormais directement. */
const DPLUS_LOAD_BOOST = 1.4;                       // « ~40% de plus », unique bouton de calibrage
const DPLUS_PHYSIO_UA_PER_M = 0.10 * DPLUS_LOAD_BOOST; // montée = coût aérobie (canal souffle)
const DPLUS_STRUCT_UA_PER_M = 0.12 * DPLUS_LOAD_BOOST; // descente = impact excentrique (canal impact)
function isCharge(e){ return e && e.kind==='autre'; }
function entryMinutes(e){ return e.durationSec ? e.durationSec/60 : (e.durationMin||0); }
/* Durée (min) d'un segment : on dérive depuis ce qui est fourni (≥2 infos parmi dist/temps/allure). */
function segMinutes(s, e){
  if(s.durationSec) return s.durationSec/60;
  if(s.distanceKm && s.paceMinPerKm) return s.distanceKm*s.paceMinPerKm;
  if(s.distanceKm){ const p = (e&&e.paceMinPerKm)||6; return s.distanceKm*p; } // repli : allure globale
  return 0;
}
/* Charge sRPE quand la sortie est DÉCOUPÉE en segments (tâche 4) :
   chaque segment compte à l'intensité du TYPE de séance, le reste de la sortie en footing facile.
   Ex. 40 min "tempo" dont 20 min de tempo → 20 min tempo (RPE 7) + 20 min easy (RPE 4). */
function segmentedBaseLoad(e){
  const totalMin = entryMinutes(e), wRpe = RPE_BY_TYPE[e.type] || 7;
  let segMin=0, load=0;
  (e.segments||[]).forEach(s=>{ const m=segMinutes(s,e); segMin+=m; load += wRpe*m; });
  const restMin = Math.max(0, totalMin - segMin);
  load += (RPE_BY_TYPE.easy||4) * restMin;
  return Math.round(load);
}
function entryLoad(e){
  if(typeof e.load==='number' && e.load>0) return e.load;          // charge explicite ou perf importée
  if(Array.isArray(e.segments) && e.segments.length) return segmentedBaseLoad(e); // sortie non régulière
  const rpe = e.rpe || feelingToRpe(e.feeling) || RPE_BY_TYPE[e.type] || 5;
  return Math.round(rpe * entryMinutes(e));                         // sRPE (effort fourni × minutes)
}
/* ===== Charge à DEUX canaux (V2 fondation) =====
   physio  = fatigue cardio-métabolique (pilote l'ACWR / le besoin de repos)
   struct  = impact musculo-squelettique (pilote le risque de blessure)
   Chaque tag module les deux canaux différemment ; le ressenti, s'il est donné,
   amortit les tags pour éviter le double comptage (cf. méthodologie §2.3). */
const TAGS = [
  { id:'chaud',    label:'Chaud (>25°C)',       mPhysio:1.12, mStruct:1.00 },
  { id:'froid',    label:'Froid',               mPhysio:1.03, mStruct:1.05 },
  { id:'mouille',  label:'Mouillé',             mPhysio:1.05, mStruct:1.05 },
  { id:'sable',    label:'Sable / meuble',      mPhysio:1.55, mStruct:0.85 },
  { id:'instable', label:'Terrain instable',    mPhysio:1.10, mStruct:1.25 },
  { id:'devers',   label:'Dévers',              mPhysio:1.05, mStruct:1.25 },
  { id:'stop',     label:'Beaucoup de STOP',    mPhysio:0.85, mStruct:1.00 },
  { id:'piednu',   label:'Pieds nus',           mPhysio:0.97, mStruct:1.40 },
  { id:'altitude', label:'Altitude (>1500 m)',  mPhysio:1.20, mStruct:1.00 },
  { id:'vent',     label:'Vent fort de face',   mPhysio:1.10, mStruct:1.00 },
  { id:'neige',    label:'Neige / boue',        mPhysio:1.30, mStruct:1.05 },
  { id:'tapis',    label:'Tapis',               mPhysio:0.97, mStruct:0.95 },
  { id:'sac',      label:'Charge portée (sac)', mPhysio:1.10, mStruct:1.15 },
  { id:'descente', label:'Descente technique',  mPhysio:1.00, mStruct:1.30 },
];
const TAG_BY_ID = Object.fromEntries(TAGS.map(t=>[t.id,t]));
function hasFeeling(e){ return !!(e && (e.rpe || e.feeling)); }   // ressenti explicite ?
function tagFactor(e, channel){
  if(!e || !Array.isArray(e.tags) || !e.tags.length) return 1;
  const k = !hasFeeling(e) ? 1 : (channel==='physio' ? 0.3 : 0.6); // amorti si ressenti donné
  let f=1;
  e.tags.forEach(id=>{ const t=TAG_BY_ID[id]; if(!t) return;
    const M = channel==='physio' ? t.mPhysio : t.mStruct;
    f *= 1 + (M-1)*k; });
  return f;
}
/* TRIMP (Banister) si FC moyenne + FC repos/max connus → charge cardio objective. */
function trimp(e){
  const p=state.profile, hr=e.avgHr, hrR=p.hrRest, hrM=p.hrMax||(p.age?Math.round(211-0.64*p.age):null);
  if(!hr||!hrR||!hrM||hrM<=hrR) return null;
  const x=Math.max(0,Math.min(1,(hr-hrR)/(hrM-hrR)));
  const k=0.64*Math.exp(1.92*x);
  return Math.round(entryMinutes(e)*x*k*2.7); // échelle calée pour rester comparable aux UA sRPE
}
/* Mise à l'échelle structurelle par le poids (impact ↑ avec la masse), bornée. */
function weightStructFactor(){
  const w=state.profile.weightKg; if(!w) return 1;
  return Math.max(0.85, Math.min(1.25, Math.pow(w/70, 0.75)));
}
/* Charge d'une entrée sur les deux canaux. */
function entryLoadChannels(e){
  const base=entryLoad(e);
  const sp = e.sport ? sportInfo(e.sport) : null;
  const isRun = sp ? sp.run : !isCharge(e);                       // course/trail (ou run manuel sans sport)
  const dplus = e.elevationGainM||0;
  const dplusScale = sp ? sp.dplusScale : (isRun?1:0);
  // SOUFFLE : quasi agnostique au sport (FC→TRIMP si dispo, sinon sRPE), + coût aérobie du D+ pondéré.
  let physio=base; const tr=trimp(e); if(tr!=null) physio=Math.round(0.5*base+0.5*tr);
  physio += dplus*DPLUS_PHYSIO_UA_PER_M*dplusScale;
  physio=Math.round(physio*tagFactor(e,'physio'));
  // IMPACT : très spécifique au sport. Course/trail = poids + D+ excentrique ; autres = base × facteur d'impact.
  let structBase;
  if(isRun){ structBase = base*weightStructFactor() + dplus*DPLUS_STRUCT_UA_PER_M; }
  else { const imp = (typeof e.structFactor==='number') ? e.structFactor : (sp ? sp.impact : 0.6); structBase = base*imp; }
  const struct=Math.round(structBase*tagFactor(e,'struct'));
  return { physio:Math.max(0,physio), struct:Math.max(0,struct) };
}
/* ===== Import de fichiers d'activité (.gpx / .tcx) — Palier 1, 100% local, sans API Strava =====
   On lit un export que l'utilisateur a téléchargé. Aucun appel réseau, aucune dépendance. */
function haversineM(la1,lo1,la2,lo2){ const R=6371000,r=Math.PI/180;
  const dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a))); }
/* D+ depuis une trace d'altitude : l'altitude GPS brute surestime le dénivelé (bruit haute fréquence).
   On lisse (moyenne glissante) puis on somme les montées du signal lissé. Le lissage — pas un seuil
   par point — gère le bruit, ce qui évite d'effacer les montées douces densément échantillonnées.
   DPLUS_SMOOTH_WIN est calibrable selon la fréquence d'échantillonnage des fichiers. */
const DPLUS_SMOOTH_WIN = 8;
function dplusFromEles(eles){
  const e=eles.filter(x=>isFinite(x)); if(e.length<3) return 0;
  const sm=e.map((_,i)=>{ let s=0,c=0; for(let j=Math.max(0,i-DPLUS_SMOOTH_WIN);j<=Math.min(e.length-1,i+DPLUS_SMOOTH_WIN);j++){s+=e[j];c++;} return s/c; });
  let gain=0; for(let i=1;i<sm.length;i++){ const d=sm[i]-sm[i-1]; if(d>0) gain+=d; }
  return Math.round(gain);
}
function mapSport(raw){ if(!raw) return null; const s=String(raw).toLowerCase();
  if(/trail/.test(s)) return 'trail';
  if(/\brun|cours|jog|foot/.test(s)) return 'course';
  if(/bik|cycl|ride|velo|vtt|mountain/.test(s)) return 'velo';
  if(/swim|nat/.test(s)) return 'natation';
  if(/row|rame|kayak|paddl|canoe/.test(s)) return 'rameur';
  if(/walk|hik|march|rando/.test(s)) return 'marche';
  if(/ski|snow/.test(s)) return 'ski';
  if(/kite|wing|surf|sail/.test(s)) return 'kite';
  if(/weight|strength|workout|muscu|renfo|gym/.test(s)) return 'renfo';
  return 'autre';   // type Strava non reconnu → catégorie neutre (impact faible), jamais traité comme une course
}
function parseActivityFile(text){
  let doc; try{ doc=new DOMParser().parseFromString(text,'application/xml'); }catch(e){ return null; }
  if(!doc || doc.querySelector('parsererror')) return null;
  const name=(doc.documentElement&&doc.documentElement.nodeName||'').toLowerCase();
  let lats=[],lons=[],eles=[],times=[],hrs=[],cads=[],cumDist=null,sportRaw=null;
  if(name==='gpx'){
    const tt=doc.querySelector('trk > type'); sportRaw = tt?tt.textContent:null;
    doc.querySelectorAll('trkpt').forEach(pt=>{
      lats.push(parseFloat(pt.getAttribute('lat'))); lons.push(parseFloat(pt.getAttribute('lon')));
      const el=pt.querySelector('ele'); eles.push(el?parseFloat(el.textContent):NaN);
      const t=pt.querySelector('time'); times.push(t?Date.parse(t.textContent):NaN);
      Array.from(pt.getElementsByTagName('*')).forEach(x=>{ const ln=(x.localName||'').toLowerCase();
        if(ln==='hr') hrs.push(parseFloat(x.textContent)); if(ln==='cad') cads.push(parseFloat(x.textContent)); });
    });
  } else if(name==='trainingcenterdatabase'){
    const act=doc.querySelector('Activity'); sportRaw = act?act.getAttribute('Sport'):null;
    doc.querySelectorAll('Trackpoint').forEach(pt=>{
      const pos=pt.querySelector('Position');
      if(pos){ const la=pos.querySelector('LatitudeDegrees'), lo=pos.querySelector('LongitudeDegrees');
        if(la&&lo){ lats.push(parseFloat(la.textContent)); lons.push(parseFloat(lo.textContent)); } }
      const el=pt.querySelector('AltitudeMeters'); if(el) eles.push(parseFloat(el.textContent));
      const t=pt.querySelector('Time'); if(t) times.push(Date.parse(t.textContent));
      const d=pt.querySelector('DistanceMeters'); if(d) cumDist=parseFloat(d.textContent);
      const hr=pt.querySelector('HeartRateBpm > Value'); if(hr) hrs.push(parseFloat(hr.textContent));
      const cad=pt.querySelector('Cadence'); if(cad) cads.push(parseFloat(cad.textContent));
    });
  } else return null;
  let distM=0;
  if(cumDist!=null && cumDist>0) distM=cumDist;                  // TCX fournit la distance cumulée (plus fiable)
  else for(let i=1;i<lats.length;i++){ if(isFinite(lats[i])&&isFinite(lats[i-1])&&isFinite(lons[i])&&isFinite(lons[i-1])) distM+=haversineM(lats[i-1],lons[i-1],lats[i],lons[i]); }
  const tt=times.filter(t=>isFinite(t));
  const durSec = tt.length>=2 ? Math.max(0,Math.round((tt[tt.length-1]-tt[0])/1000)) : 0;
  const date = tt.length ? toISO(new Date(tt[0])) : isoToday();
  const distanceKm = Math.round(distM/100)/10;
  const avgHr = hrs.filter(isFinite).length ? Math.round(hrs.filter(isFinite).reduce((a,x)=>a+x,0)/hrs.filter(isFinite).length) : null;
  const cadence = cads.filter(isFinite).length ? Math.round(cads.filter(isFinite).reduce((a,x)=>a+x,0)/cads.filter(isFinite).length) : null;
  const paceMinPerKm = (distanceKm>0&&durSec>0) ? (durSec/60)/distanceKm : 0;
  return { sport:mapSport(sportRaw)||'autre', date, distanceKm, durationSec:durSec, elevationGainM:dplusFromEles(eles), avgHr, cadence, paceMinPerKm };
}

/* ===== Décodeur FIT minimal (montres Garmin / Polar / Wahoo) — 100% local, sans dépendance =====
   Lit l'en-tête, les messages de définition, puis les messages "record" (timestamp, position,
   altitude, FC, cadence, distance) et le sport (session/sport). Renvoie EXACTEMENT la même
   structure que parseActivityFile, pour se brancher sans friction dans l'import existant.
   Format binaire documenté (FIT SDK). Robuste : toute anomalie -> renvoie null (fichier ignoré). */
function parseFitFile(buffer){
  try{
    const dv=new DataView(buffer), u8=new Uint8Array(buffer), len=buffer.byteLength;
    if(len<14) return null;
    const headerSize=dv.getUint8(0);
    if(headerSize<12 || headerSize>=len) return null;
    // Signature ".FIT" en octets 8..11
    if(!(u8[8]===0x2E && u8[9]===0x46 && u8[10]===0x49 && u8[11]===0x54)) return null;
    const dataSize=dv.getUint32(4,true);
    const dataEnd=Math.min(len, headerSize+dataSize);
    const FIT_EPOCH=631065600;                                   // 1989-12-31 00:00 UTC -> Unix
    const defs={};                                               // localType -> définition
    const lats=[], lons=[], eles=[], times=[], hrs=[], cads=[];
    let cumDist=null, sportEnum=null, lastTimestamp=null;

    // Lecture d'un champ scalaire (premier élément si tableau) selon son type de base FIT.
    const readField=(off,baseType,le)=>{
      switch(baseType){
        case 0x84: { const v=dv.getUint16(off,le); return v===0xFFFF?null:v; }            // uint16
        case 0x8B: { const v=dv.getUint16(off,le); return v===0x0000?null:v; }            // uint16z
        case 0x83: return dv.getInt16(off,le);                                            // sint16
        case 0x86: { const v=dv.getUint32(off,le); return v===0xFFFFFFFF?null:v; }        // uint32
        case 0x8C: { const v=dv.getUint32(off,le); return v===0x00000000?null:v; }        // uint32z
        case 0x85: return dv.getInt32(off,le);                                            // sint32
        case 0x88: { const v=dv.getFloat32(off,le); return isFinite(v)?v:null; }          // float32
        case 0x02: case 0x0A: case 0x0D: { const v=dv.getUint8(off); return v===0xFF?null:v; } // uint8 / uint8z / byte
        case 0x01: return (dv.getInt8(off));                                              // sint8
        case 0x00: { const v=dv.getUint8(off); return v===0xFF?null:v; }                  // enum
        default: return null;                                                            // string/float64/64-bit : ignorés
      }
    };

    // Lecture d'un message de DONNÉES selon sa définition. cts = timestamp ms (en-tête compressé).
    const readDataMessage=(def,p,cts)=>{
      const le=def.le, rec={};
      for(const f of def.fields){
        if(p+f.size<=len){ rec[f.num]=readField(p,f.baseType,le); }
        p+=f.size;
      }
      for(const d of def.devFields){ p+=d.size; }
      if(def.globalNum===20){                                   // message "record"
        if(rec[253]!=null){ lastTimestamp=rec[253]; times.push((rec[253]+FIT_EPOCH)*1000); }
        else if(cts!=null){ times.push(cts); }
        lats.push(rec[0]!=null ? rec[0]*(180/2147483648) : NaN);
        lons.push(rec[1]!=null ? rec[1]*(180/2147483648) : NaN);
        let alt=NaN;
        if(rec[78]!=null) alt=rec[78]/5-500;                    // enhanced_altitude (uint32) prioritaire
        else if(rec[2]!=null) alt=rec[2]/5-500;                 // altitude (uint16) ; échelle 5, offset 500
        eles.push(alt);
        if(rec[3]!=null) hrs.push(rec[3]);                      // heart_rate
        if(rec[4]!=null) cads.push(rec[4]);                     // cadence
        if(rec[5]!=null) cumDist=rec[5]/100;                    // distance cumulée (m)
      } else if(def.globalNum===18){                            // session : sport (champ 5)
        if(sportEnum==null && rec[5]!=null) sportEnum=rec[5];
      } else if(def.globalNum===12){                            // sport : sport (champ 0)
        if(sportEnum==null && rec[0]!=null) sportEnum=rec[0];
      }
      return p;
    };

    let pos=headerSize;
    while(pos < dataEnd){
      const rh=dv.getUint8(pos); pos++;
      if(rh & 0x80){                                            // en-tête à timestamp compressé
        const localType=(rh>>5)&0x03, def=defs[localType];
        if(!def) break;
        let ctsMs=null;
        if(lastTimestamp!=null){ const off5=rh&0x1F; let ts=(lastTimestamp & ~0x1F)+off5; if(ts<lastTimestamp) ts+=0x20; lastTimestamp=ts; ctsMs=(ts+FIT_EPOCH)*1000; }
        pos=readDataMessage(def,pos,ctsMs);
      } else if(rh & 0x40){                                     // message de DÉFINITION
        if(pos+5>len) break;
        const le=dv.getUint8(pos+1)===0;                        // 0 = little-endian
        const globalNum=dv.getUint16(pos+2,le);
        const nFields=dv.getUint8(pos+4);
        let p=pos+5; const fields=[];
        for(let i=0;i<nFields;i++){ if(p+3>len) break; fields.push({ num:dv.getUint8(p), size:dv.getUint8(p+1), baseType:dv.getUint8(p+2) }); p+=3; }
        const devFields=[];
        if(rh & 0x20){ if(p<len){ const nDev=dv.getUint8(p); p++; for(let i=0;i<nDev;i++){ if(p+3>len) break; devFields.push({ size:dv.getUint8(p+1) }); p+=3; } } }
        defs[rh & 0x0F]={ le, globalNum, fields, devFields };
        pos=p;
      } else {                                                 // message de DONNÉES
        const def=defs[rh & 0x0F];
        if(!def) break;
        pos=readDataMessage(def,pos);
      }
    }

    // Sport FIT (enum) -> catégorie interne. Inconnu -> 'autre' (jamais 'course'), comme le repli GPX.
    const FIT_SPORT={ 0:'autre', 1:'course', 2:'velo', 5:'natation', 11:'marche', 17:'trail', 37:'natation' };
    let sport = sportEnum!=null ? (FIT_SPORT[sportEnum]||'autre') : 'autre';

    let distM=0;
    if(cumDist!=null && cumDist>0) distM=cumDist;               // distance cumulée FIT (fiable)
    else for(let i=1;i<lats.length;i++){ if(isFinite(lats[i])&&isFinite(lats[i-1])&&isFinite(lons[i])&&isFinite(lons[i-1])) distM+=haversineM(lats[i-1],lons[i-1],lats[i],lons[i]); }
    const tt=times.filter(t=>isFinite(t));
    const durSec = tt.length>=2 ? Math.max(0,Math.round((tt[tt.length-1]-tt[0])/1000)) : 0;
    const date = tt.length ? toISO(new Date(tt[0])) : isoToday();
    const distanceKm=Math.round(distM/100)/10;
    const hv=hrs.filter(isFinite), avgHr=hv.length?Math.round(hv.reduce((a,x)=>a+x,0)/hv.length):null;
    const cv=cads.filter(isFinite), cadence=cv.length?Math.round(cv.reduce((a,x)=>a+x,0)/cv.length):null;
    const paceMinPerKm=(distanceKm>0&&durSec>0)?(durSec/60)/distanceKm:0;
    if(!distanceKm && !durSec) return null;                     // rien d'exploitable
    return { sport, date, distanceKm, durationSec:durSec, elevationGainM:dplusFromEles(eles), avgHr, cadence, paceMinPerKm };
  }catch(e){ return null; }
}

/* ===== Import EN MASSE (archive .zip Strava ou plusieurs fichiers) — Palier 3 =====
   100% local et sans dépendance : on lit le ZIP nous-mêmes et on décompresse avec l'API native
   DecompressionStream (gzip pour les .gz, deflate-raw pour les entrées ZIP). */
function hasDecompression(){ return typeof DecompressionStream!=='undefined'; }
async function decompressBytes(bytes, format){            // format: 'gzip' | 'deflate-raw'
  const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
/* Lecteur ZIP minimal (sans ZIP64) : End-Of-Central-Directory → entrées → données locales. */
function readZip(arrayBuffer){
  const dv=new DataView(arrayBuffer), u8=new Uint8Array(arrayBuffer), len=arrayBuffer.byteLength, dec=new TextDecoder();
  let eocd=-1; const lo=Math.max(0,len-22-65536);
  for(let i=len-22;i>=lo;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('Archive ZIP illisible.');
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const entries=[];
  for(let n=0;n<count && off+46<=len;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true), extraLen=dv.getUint16(off+30,true), commLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=dec.decode(u8.subarray(off+46, off+46+nameLen));
    entries.push({ name, method, compSize, lho });
    off += 46+nameLen+extraLen+commLen;
  }
  return { dv, u8, entries };
}
async function zipEntryBytes(z, en){
  const { dv, u8 }=z, lho=en.lho;
  if(dv.getUint32(lho,true)!==0x04034b50) throw new Error('entrée ZIP invalide');
  const nameLen=dv.getUint16(lho+26,true), extraLen=dv.getUint16(lho+28,true);
  const start=lho+30+nameLen+extraLen, comp=u8.subarray(start, start+en.compSize);
  if(en.method===0) return comp.slice();                  // stored
  if(en.method===8) return await decompressBytes(comp,'deflate-raw'); // deflate
  throw new Error('compression ZIP non gérée');
}
/* activities.csv de l'archive Strava : associe chaque fichier à son type d'activité (source la plus fiable). */
function parseStravaCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.length); if(!lines.length) return {};
  const split=line=>{ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===','&&!q){ out.push(cur); cur=''; } else cur+=c; }
    out.push(cur); return out; };
  const head=split(lines[0]).map(h=>h.trim().toLowerCase());
  const fi=head.findIndex(h=>h.includes('filename')), ti=head.findIndex(h=>h.includes('activity type')||h==='type');
  const map={}; if(fi<0||ti<0) return map;
  for(let i=1;i<lines.length;i++){ const c=split(lines[i]); if(c.length<=Math.max(fi,ti)) continue;
    const fn=(c[fi]||'').trim().replace(/^activities\//,''); const ty=(c[ti]||'').trim(); if(fn) map[fn]=ty; }
  return map;
}
/* Construit une entrée de journal à partir d'une activité parsée (course OU cross-training). */
function buildEntryFromParsed(p){
  const id='r_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  if(isRunSport(p.sport)){
    return { id, date:p.date, type:'easy', sport:p.sport, distanceKm:p.distanceKm, durationSec:p.durationSec,
      paceMinPerKm:p.paceMinPerKm, elevationGainM:p.elevationGainM, difficulty:1, avgHr:p.avgHr, vo2:null,
      cadenceSpm:p.cadence, feeling:null, notes:'', tags:[],
      linkedSessionId:(sessionForDate(p.date)||{}).id||null, imported:true };
  }
  const minutes=(p.durationSec||0)/60, rpe=sportInfo(p.sport).rpe;
  return { id, kind:'autre', sport:p.sport, date:p.date, durationMin:Math.round(minutes), durationSec:p.durationSec,
    distanceKm:p.distanceKm, elevationGainM:p.elevationGainM, load:Math.round(rpe*minutes), avgHr:p.avgHr,
    cadenceSpm:p.cadence, feeling:null, notes:'', source:sportInfo(p.sport).lab, imported:true };
}
/* Importe une liste de fichiers (.zip / .gpx / .tcx / .gz). Retourne un récap. */
async function importBulk(fileList){
  const res={ added:0, dup:0, fit:0, err:0, skipped:0 };
  const acts=[]; // { text, hint }
  for(const file of Array.from(fileList)){
    const nm=file.name.toLowerCase();
    try{
      if(nm.endsWith('.zip')){
        if(!hasDecompression()){ throw new Error('Ton navigateur ne gère pas la décompression ZIP. Sélectionne plutôt les fichiers .gpx / .tcx un par un ou en lot.'); }
        const z=readZip(await file.arrayBuffer());
        const csvEn=z.entries.find(en=>/(^|\/)activities\.csv$/i.test(en.name));
        let csv={}; if(csvEn){ try{ csv=parseStravaCsv(new TextDecoder().decode(await zipEntryBytes(z,csvEn))); }catch(e){} }
        for(const en of z.entries){
          const en_nm=en.name.toLowerCase();
          if(/\.fit(\.gz)?$/.test(en_nm)){
            try{
              let fb=await zipEntryBytes(z,en);
              if(en_nm.endsWith('.gz')) fb=await decompressBytes(fb,'gzip');
              const fbase=en.name.split('/').pop();
              const pf=parseFitFile(fb.buffer.slice(fb.byteOffset, fb.byteOffset+fb.byteLength));
              if(pf) acts.push({ parsed:pf, hint: csv[en.name]||csv[fbase]||null }); else res.fit++;
            }catch(e){ res.fit++; }
            continue;
          }
          if(!/\.(gpx|tcx)(\.gz)?$/.test(en_nm)) continue;
          try{
            let bytes=await zipEntryBytes(z,en);
            if(en_nm.endsWith('.gz')) bytes=await decompressBytes(bytes,'gzip');
            const base=en.name.split('/').pop();
            acts.push({ text:new TextDecoder().decode(bytes), hint: csv[en.name]||csv[base]||null });
          }catch(e){ res.err++; }
        }
      } else if(/\.(gpx|tcx)\.gz$/.test(nm)){
        if(!hasDecompression()){ res.skipped++; continue; }
        acts.push({ text:new TextDecoder().decode(await decompressBytes(new Uint8Array(await file.arrayBuffer()),'gzip')), hint:null });
      } else if(/\.(gpx|tcx)$/.test(nm)){
        acts.push({ text:await file.text(), hint:null });
      } else if(/\.fit(\.gz)?$/.test(nm)){
        try{
          let fb=new Uint8Array(await file.arrayBuffer());
          if(nm.endsWith('.gz')){ if(!hasDecompression()){ res.skipped++; continue; } fb=await decompressBytes(fb,'gzip'); }
          const pf=parseFitFile(fb.buffer.slice(fb.byteOffset, fb.byteOffset+fb.byteLength));
          if(pf) acts.push({ parsed:pf, hint:null }); else res.fit++;
        }catch(e){ res.fit++; }
      }
      else res.skipped++;
    }catch(e){ if(e && e.message && /navigateur/.test(e.message)) throw e; res.err++; }
  }
  // parse + dédup (contre le journal existant ET au sein du lot)
  const key=o=>o.date+'|'+Math.round((o.distanceKm||0)*10)+'|'+Math.round((o.durationSec||0)/60);
  const seen=new Set(state.journal.map(key)); const fresh=[];
  for(const a of acts){
    const p = a.parsed || (a.text!=null ? parseActivityFile(a.text) : null); if(!p){ res.err++; continue; }
    if(a.hint){ const m=mapSport(a.hint); if(m) p.sport=m; }      // le type CSV/officiel prime
    const k=key(p); if(seen.has(k)){ res.dup++; continue; }
    seen.add(k); fresh.push(buildEntryFromParsed(p)); res.added++;
  }
  if(fresh.length){ state.journal.push(...fresh); adaptHorizon(); save(); }
  return res;
}
/* Amorçage à froid PAR CANAL : volume course (+ tolérance hors-course côté physio). */
function baselineDailyLoad(){
  const p=state.profile, vol=p.weeklyVolumeKm||0;
  const easyMin = p.easyPaceSec ? p.easyPaceSec/60 : paceAnchorSec()/60;
  const runDaily = vol ? (vol*4*easyMin)/7 : 0;
  const crossDaily = p.crossTrainHours ? (p.crossTrainHours*60*4)/7 : 0; // ~RPE4 × minutes
  return { physio: Math.round(runDaily+crossDaily), struct: Math.round(runDaily) };
}
/* État de charge à deux canaux + monotonie/contrainte (Foster).
   Mémoïsé par date de réf : la fonction est appelée plusieurs fois par rendu (forme, nudge, stats…) sur
   le même journal. Le cache est vidé dès que le journal change (début de adaptHorizon / rescheduleSpentDay). */
let _lscCache = {};
function clearLoadCache(){ _lscCache = {}; }
function loadStateChannels(refIso){
  const today = refIso || isoToday();
  if(_lscCache[today]) return _lscCache[today];
  const dayP={}, dayS={};
  state.journal.forEach(e=>{ if(e.date<=today){ const L=entryLoadChannels(e);
    dayP[e.date]=(dayP[e.date]||0)+L.physio; dayS[e.date]=(dayS[e.date]||0)+L.struct; } });
  const b=baselineDailyLoad();
  const firstLog = state.journal.length ? state.journal.reduce((m,e)=> e.date<m ? e.date : m, '9999-99-99') : null;
  const ewma=(daily,base)=>{ let acute=base,chronic=base; const la=2/(7+1),lc=2/(28+1),N=42;
    for(let i=N;i>=0;i--){ const d=addDays(today,-i);
      const L = (!firstLog || d<firstLog) ? base : (daily[d]||0); // amorçage : baseline avant le 1er log réel
      acute+=la*(L-acute); chronic+=lc*(L-chronic); }
    return { acute, chronic, acwr: chronic>0?acute/chronic:0, freshness: chronic-acute }; };
  const physio=ewma(dayP,b.physio), struct=ewma(dayS,b.struct);
  const tot=[]; for(let i=6;i>=0;i--){ const d=addDays(today,-i); tot.push((dayP[d]||0)+(dayS[d]||0)); }
  const mean=tot.reduce((a,x)=>a+x,0)/7;
  const sd=Math.sqrt(tot.reduce((a,x)=>a+(x-mean)*(x-mean),0)/7);
  const monotony = sd>0 ? mean/sd : (mean>0?3:0);
  const strain = Math.round(mean*7*monotony);
  return (_lscCache[today] = { physio, struct, monotony:+monotony.toFixed(2), strain });
}
/* loadState (compat) : conserve la forme historique, mais alimentée par les 2 canaux.
   Le statut prend le canal le PLUS chargé (physio ou struct) pour ne rien laisser passer. */
function loadState(refIso){
  const C=loadStateChannels(refIso);
  const acwr=Math.max(C.physio.acwr, C.struct.acwr);
  const acute=Math.round(C.physio.acute), chronic=Math.round(C.physio.chronic), freshness=Math.round(C.physio.freshness);
  let key, label, advice;
  if(chronic < 5){ key='new'; label='À calibrer'; advice='Enregistre quelques sorties pour estimer ta forme.'; }
  else if(acwr > 1.5){ key='high'; label='Charge élevée'; advice='Pic de charge récent — privilégie le repos ou du très facile.'; }
  else if(acwr > 1.3){ key='build'; label='Charge soutenue'; advice='Tu montes vite : reste prudent sur l\u2019intensité.'; }
  else if(acwr < 0.8){ key='fresh'; label='Frais'; advice='Bonne fraîcheur — tu peux pousser un peu si l\u2019envie est là.'; }
  else { key='ok'; label='Équilibré'; advice='Charge bien équilibrée, continue ainsi.'; }
  if(key!=='new' && C.struct.acwr>1.3 && C.struct.acwr>C.physio.acwr+0.2)
    advice='Tes jambes encaissent plus que ton souffle (impact) — pense au repos structurel (descentes, pieds nus).';
  return { acute, chronic, acwr, freshness, key, label, advice, channels:C };
}
function formeColor(key){
  return key==='high' ? 'var(--danger)' : key==='build' ? 'var(--accent)'
       : key==='fresh' ? 'var(--navy)' : key==='ok' ? 'var(--success)' : 'var(--muted)';
}
function formeCard(){
  const L = loadState(), col = formeColor(L.key), ready = L.chronic >= 5;

  const reading = !ready ? '' :
    (Math.abs(pct)<=10 ? 'Charge récente dans ta moyenne habituelle.'
     : `Charge récente <b>${pct>0?'+':''}${pct}\u00A0%</b> par rapport à ton habitude.`);
  const gauge = ready ? `
    <svg viewBox="0 0 ${W} 16" style="width:100%;display:block;margin-top:8px" aria-hidden="true">

    <div class="forme-scale"><span>reposé</span><span>zone idéale</span><span>chargé</span></div>` : '';
  return `<div class="card forme"><div class="forme-head">

    ${gauge}
    <p class="forme-advice">${L.advice}</p>
    ${state._helpForme?`<p class="help-expl">La forme compare ta charge récente à ton habitude. « Chargé » = tu en fais beaucoup en ce moment ; « reposé » = tu es frais. La zone idéale est l'équilibre entre les deux — et c'est en récupérant qu'on progresse.</p>`:''}
    ${L.chronic>=5?`<button class="linkbtn" data-go="data" style="margin-top:12px">Voir le détail — deux charges, tendances ${svg('chevronR',16)}</button>`:''}</div>`;
}
/* Modulation du plan selon la forme (P2) — gentle. */
function loadModulation(){
  const L=loadState(); let f=1;
  if(L.key==='high') f=0.8; else if(L.key==='build') f=0.9; else if(L.key==='fresh') f=1.05;
  return { volFactor:f, key:L.key, L };
}
/* ===== Adaptation à deux canaux (incrément 4) =====
   Réévalue l'horizon À VENIR (jours suivants) après chaque saisie. Non destructif :
   repart de la « base » de chaque séance, respecte les séances manuelles/fixées et celles déjà réalisées,
   n'agit qu'au-delà d'aujourd'hui (le jour même reste au choix via le nudge), et applique une hystérésis. */
function snapSession(s){ return { type:s.type, target:s.target?JSON.parse(JSON.stringify(s.target)):{}, pace:s.pace?JSON.parse(JSON.stringify(s.pace)):null, effort:s.effort||null, elevationGainM:s.elevationGainM||0, difficulty:s.difficulty||1, structure:s.structure?JSON.parse(JSON.stringify(s.structure)):null, description:s.description||'', priority:s.priority||'optional' }; }
/* Décalage d'une journée « déjà consommée » : si la fatigue (ACWR) passe en zone risque un jour où une
   séance course est encore prévue (typiquement une grosse charge cross-training), on ne garde pas un
   footing le même jour — la séance glisse au prochain jour disponible ET libre, et le jour devient repos.
   Non destructif : la séance est déplacée (drapeau shiftedFrom), jamais effacée ; le journal est intact.
   Déclenché par la FATIGUE, pas par une valeur d'UA absolue → auto-calibré sur la tolérance du coureur. */
function rescheduleSpentDay(dateIso){
  clearLoadCache();
  if(!state.program || !state.program.sessions) return null;
  const s = state.program.sessions.find(x=>x.date===dateIso && !x.manual);
  if(!s || s.type==='rest' || s.type==='recovery') return null;       // rien à décaler / journée déjà légère
  if(logsForDate(dateIso).some(r=>!isCharge(r))) return null;          // séance course déjà faite ce jour-là
  const C=loadStateChannels(dateIso);                                  // fatigue intégrant la charge du jour
  if(Math.max(C.physio.acwr, C.struct.acwr) < 1.5) return null;        // pas en zone risque → pas de décalage
  const prof=state.profile;
  const avail = (prof.days && prof.days.length) ? prof.days
              : [...new Set(state.program.sessions.filter(x=>x.date>=dateIso).map(x=>dayKeyOf(x.date)))];
  const availSet = new Set(avail.length?avail:DAY_KEYS);
  for(let i=1;i<=14;i++){
    const d=addDays(dateIso,i);
    if(!availSet.has(dayKeyOf(d))) continue;                           // jour non disponible
    if(state.program.sessions.some(x=>x.date===d)) continue;          // déjà une séance ce jour
    if(logsForDate(d).length) continue;                               // déjà une activité ce jour
    s.shiftedFrom=dateIso; s.shifted=true; s.date=d; delete s.base;   // déplacement (adaptation recalculée proprement ensuite)
    return d;
  }
  return null;                                                        // aucun créneau libre proche → softenToday/nudge prend le relais
}
function adaptHorizon(){
  clearLoadCache();
  if(!state.program || !state.program.sessions) return;
  const today=isoToday();
  const C=loadStateChannels();
  const acwr=Math.max(C.physio.acwr, C.struct.acwr);
  const structDriven = C.struct.acwr > C.physio.acwr + 0.2;
  const prev = state._adaptLevel||0;
  let level = acwr>=1.5 ? 2 : acwr>=1.33 ? 1 : 0;
  if(prev===2 && acwr>=1.42) level=2;              // reste « repos » tant qu'on n'est pas bien redescendu
  if(prev>=1 && level===0 && acwr>=1.25) level=1;  // zone tampon avant le retour à la normale
  state._adaptLevel = level;

  const horizonEnd = addDays(today, 4);
  const upcoming = state.program.sessions
    .filter(s=>s.date>today && s.date<=horizonEnd && !s.manual && !logsForDate(s.date).length)
    .sort((a,b)=>a.date.localeCompare(b.date));
  let restedOne=false;
  upcoming.forEach(s=>{
    if(!s.base) s.base = snapSession(s);
    const b=s.base;                                  // repart toujours de la base (idempotent, réversible)
    s.type=b.type; s.target=JSON.parse(JSON.stringify(b.target)); s.pace=b.pace?JSON.parse(JSON.stringify(b.pace)):null;
    s.effort=b.effort; s.elevationGainM=b.elevationGainM; s.difficulty=b.difficulty;
    s.structure=b.structure?JSON.parse(JSON.stringify(b.structure)):null; s.description=b.description; s.priority=b.priority;
    delete s.adapted;
    if(level===0) return;
    const isHard = b.priority==='key' || ['long','tempo','intervals','cotes'].includes(b.type);
    if(!isHard) return;
    if(level>=2 && !restedOne){                       // rétrograder la prochaine séance dure
      s.type='recovery'; s.pace=null; s.effort='très facile'; s.structure=null; s.elevationGainM=0;
      s.target={ distanceKm: Math.max(4, Math.round((b.target.distanceKm||6)*0.4)) };
      s.priority='optional'; s.adapted='rest';
      s.description='Allégée : charge récente élevée'+(structDriven?' côté impact':'')+' — on récupère (footing très court ou repos).';
      restedOne=true;
    } else {                                          // raboter
      if(b.target.distanceKm) s.target={ distanceKm: Math.max(4, Math.round(b.target.distanceKm*0.7)) };
      s.elevationGainM=Math.round((b.elevationGainM||0)*0.6);
      s.adapted='trim';
      s.description=(b.description||describeSession(s.type,s.target,s.structure,s.effort,s.elevationGainM))+' · Volume réduit (charge récente un peu haute).';
    }
  });
}
/* Conseil du jour selon la charge (non destructif). */
function todayLoadNudge(){

      <button class="btn" id="ease" style="width:auto;padding:7px 13px;background:var(--navy);color:#FFF7EC;border:none;font-size:12.5px">${severe?'Lever le pied':'Alléger'}</button></div>`;
  }
